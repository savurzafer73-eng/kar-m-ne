<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mina Video AI V46.2 — GeldStory Studio</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#090b0f;
  color:#eee;
  font-family:Arial,Helvetica,sans-serif;
}

header{
  background:#11151c;
  border-bottom:1px solid #282e38;
  padding:20px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:25px;
}

header p{
  color:#929baa;
  margin:7px 0 0;
}

.container{
  width:min(1200px,94%);
  margin:20px auto 60px;
}

.card{
  background:#11151c;
  border:1px solid #282e38;
  border-radius:14px;
  padding:18px;
  margin-bottom:18px;
}

h2{
  margin:0 0 14px;
  font-size:19px;
}

textarea{
  width:100%;
  min-height:240px;
  background:#07090c;
  color:#fff;
  border:1px solid #303743;
  border-radius:10px;
  padding:15px;
  resize:vertical;
  font-size:16px;
  line-height:1.65;
}

button{
  border:0;
  border-radius:9px;
  padding:12px 17px;
  color:white;
  background:#29313d;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  filter:brightness(1.15);
}

button.primary{
  background:#5967ff;
}

button.green{
  background:#13864b;
}

button.red{
  background:#a72c3b;
}

button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.row{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:12px;
}

.status{
  margin-top:12px;
  background:#080a0d;
  border:1px solid #282e38;
  border-radius:9px;
  padding:12px;
  color:#aab3c0;
  font-size:13px;
  line-height:1.5;
}

.success{color:#42d48a}
.error{color:#ff6878}
.warning{color:#e8bd55}

#sceneList{
  display:flex;
  flex-direction:column;
  gap:13px;
}

.scene{
  background:#080b0f;
  border:1px solid #29313b;
  border-radius:12px;
  overflow:hidden;
}

.sceneHead{
  background:#151a22;
  padding:12px 14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.sceneBody{
  padding:14px;
}

.sceneText{
  width:100%;
  min-height:105px;
  background:#06080b;
  color:white;
  border:1px solid #303743;
  border-radius:8px;
  padding:11px;
  resize:vertical;
  line-height:1.55;
}

.sceneActions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:10px;
}

.sceneMeta{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:9px;
}

.badge{
  background:#252c37;
  color:#adb6c4;
  border-radius:20px;
  padding:4px 8px;
  font-size:11px;
}

.audioBox{
  margin-top:12px;
  padding:10px;
  background:#11161d;
  border-radius:8px;
}

.audioBox audio{
  width:100%;
}

#progress{
  width:100%;
  height:8px;
  background:#222933;
  border-radius:10px;
  overflow:hidden;
  margin-top:12px;
}

#progressBar{
  width:0%;
  height:100%;
  background:#6270ff;
  transition:.2s;
}

.small{
  font-size:12px;
  color:#7f8998;
  line-height:1.55;
}
</style>
</head>

<body>

<header>
  <h1>🎬 Mina Video AI V46.2</h1>
  <p>GeldStory Studio — Scene + WAV TTS</p>
</header>

<div class="container">

  <div class="card">

    <h2>📖 1. Hikâyeyi Gir</h2>

    <textarea id="storyInput"
      placeholder="Almanca gerçek hikâyeni buraya yapıştır..."></textarea>

    <div class="row">

      <button
        id="splitBtn"
        class="primary"
        type="button">
        ✂️ SAHNELERE BÖL
      </button>

      <button
        id="clearBtn"
        type="button">
        🗑️ TEMİZLE
      </button>

    </div>

    <div id="mainStatus" class="status">
      Sistem hazır.
    </div>

  </div>


  <div class="card">

    <h2>🎙️ 2. Almanca Seslendirme</h2>

    <div class="small">
      Seslendirme yalnızca düğmeye basıldığında yüklenir.
      Mikrofon kullanılmaz. Amaç doğrudan WAV oluşturmaktır.
    </div>

    <div class="row">

      <button
        id="voiceAllBtn"
        class="green"
        type="button">
        🎙️ TÜM SAHNELERİ SESLENDİR VE KAYDET
      </button>

    </div>

    <div id="ttsStatus" class="status">
      TTS henüz başlatılmadı.
    </div>

    <div id="progress">
      <div id="progressBar"></div>
    </div>

  </div>


  <div class="card">

    <h2>🎬 3. SAHNELER</h2>

    <div id="sceneInfo" class="status">
      Henüz sahne oluşturulmadı.
    </div>

    <br>

    <div id="sceneList"></div>

  </div>

</div>


<script>

"use strict";

/* =========================================================
   GLOBAL
========================================================= */

let scenes = [];
let piper = null;
let piperLoading = false;


/* =========================================================
   DOM
========================================================= */

const storyInput =
  document.getElementById("storyInput");

const splitBtn =
  document.getElementById("splitBtn");

const clearBtn =
  document.getElementById("clearBtn");

const voiceAllBtn =
  document.getElementById("voiceAllBtn");

const sceneList =
  document.getElementById("sceneList");

const sceneInfo =
  document.getElementById("sceneInfo");

const mainStatus =
  document.getElementById("mainStatus");

const ttsStatus =
  document.getElementById("ttsStatus");

const progressBar =
  document.getElementById("progressBar");


/* =========================================================
   TEXT NORMALIZE
========================================================= */

function normalizeText(text){

  return String(text || "")
    .replace(/\r\n/g,"\n")
    .replace(/\r/g,"\n")
    .replace(/\u00A0/g," ")
    .replace(/[ \t]+/g," ")
    .replace(/\n{2,}/g,"\n")
    .trim();

}


/* =========================================================
   SENTENCE SPLITTER
========================================================= */

function splitSentences(text){

  text = normalizeText(text);

  if(!text){
    return [];
  }

  const result = [];

  let current = "";

  for(let i=0;i<text.length;i++){

    const ch = text[i];

    current += ch;

    const next =
      text[i+1] || "";

    if(
      /[.!?…]/.test(ch) &&
      (
        !next ||
        /\s/.test(next)
      )
    ){

      const sentence =
        current.trim();

      if(sentence){
        result.push(sentence);
      }

      current = "";

    }

  }

  if(current.trim()){
    result.push(
      current.trim()
    );
  }

  return result;

}


/* =========================================================
   CREATE SCENES
========================================================= */

function createScenes(text){

  const sentences =
    splitSentences(text);

  const result = [];

  for(
    let i=0;
    i<sentences.length;
    i+=2
  ){

    const a =
      sentences[i] || "";

    const b =
      sentences[i+1] || "";

    const sceneText =
      [a,b]
      .filter(Boolean)
      .join(" ")
      .trim();

    if(!sceneText){
      continue;
    }

    result.push({

      id:
        result.length + 1,

      text:
        sceneText,

      sentenceCount:
        [a,b].filter(Boolean).length,

      audioBlob:
        null,

      audioUrl:
        null,

      duration:
        0

    });

  }

  return result;

}


/* =========================================================
   SPLIT STORY
========================================================= */

function splitStory(){

  const text =
    storyInput.value.trim();

  if(!text){

    mainStatus.innerHTML =
      '<span class="warning">⚠️ Önce hikâyeyi gir.</span>';

    return;

  }

  try{

    mainStatus.innerHTML =
      "⏳ Hikâye cümlelere ayrılıyor...";

    scenes =
      createScenes(text);

    renderScenes();

    if(!scenes.length){

      mainStatus.innerHTML =
        '<span class="error">❌ Cümle bulunamadı.</span>';

      return;

    }

    const totalSentences =
      scenes.reduce(
        (n,s)=>
          n+s.sentenceCount,
        0
      );

    mainStatus.innerHTML =
      `<span class="success">
        ✅ ${scenes.length} sahne oluşturuldu.
      </span>
      <br>
      ${totalSentences} cümle işlendi.`;

  }
  catch(error){

    console.error(error);

    mainStatus.innerHTML =
      `<span class="error">
        ❌ ${escapeHTML(error.message)}
      </span>`;

  }

}


/* =========================================================
   RENDER
========================================================= */

function renderScenes(){

  sceneList.innerHTML = "";

  sceneInfo.innerHTML =
    scenes.length
      ? `🎬 <b>${scenes.length}</b> sahne hazır.`
      : "Henüz sahne oluşturulmadı.";


  scenes.forEach(
    (scene,index)=>{

      const box =
        document.createElement("div");

      box.className =
        "scene";


      const head =
        document.createElement("div");

      head.className =
        "sceneHead";

      head.innerHTML = `
        <b>SAHNE ${index+1}</b>
        <span class="badge">
          ${scene.sentenceCount} cümle
        </span>
      `;


      const body =
        document.createElement("div");

      body.className =
        "sceneBody";


      const text =
        document.createElement("textarea");

      text.className =
        "sceneText";

      text.value =
        scene.text;


      text.addEventListener(
        "input",
        ()=>{
          scene.text =
            text.value;
        }
      );


      const meta =
        document.createElement("div");

      meta.className =
        "sceneMeta";


      const sentenceBadge =
        document.createElement("span");

      sentenceBadge.className =
        "badge";

      sentenceBadge.textContent =
        scene.sentenceCount === 2
          ? "✓ 2 cümle"
          : "1 cümle";


      const audioBadge =
        document.createElement("span");

      audioBadge.className =
        "badge";

      audioBadge.textContent =
        "🔇 Ses yok";


      meta.appendChild(
        sentenceBadge
      );

      meta.appendChild(
        audioBadge
      );


      const actions =
        document.createElement("div");

      actions.className =
        "sceneActions";


      const voice =
        document.createElement("button");

      voice.className =
        "green";

      voice.type =
        "button";

      voice.textContent =
        "🎙️ SESLENDİR VE KAYDET";


      voice.onclick =
        ()=>generateVoice(index);


      const play =
        document.createElement("button");

      play.type =
        "button";

      play.textContent =
        "▶️ SESİ ÇAL";


      play.onclick =
        ()=>{

          if(!scene.audioUrl){

            alert(
              "Önce sahneyi seslendir."
            );

            return;

          }

          const audio =
            new Audio(
              scene.audioUrl
            );

          audio.play();

        };


      const download =
        document.createElement("button");

      download.type =
        "button";

      download.textContent =
        "⬇️ WAV";


      download.onclick =
        ()=>downloadWav(scene);


      actions.appendChild(
        voice
      );

      actions.appendChild(
        play
      );

      actions.appendChild(
        download
      );


      const audioBox =
        document.createElement("div");

      audioBox.className =
        "audioBox";


      body.appendChild(
        text
      );

      body.appendChild(
        meta
      );

      body.appendChild(
        actions
      );

      body.appendChild(
        audioBox
      );


      box.appendChild(
        head
      );

      box.appendChild(
        body
      );


      sceneList.appendChild(
        box
      );


      scene.ui = {

        audioBox,

        audioBadge

      };

    }
  );

}


/* =========================================================
   PIPER LOAD
========================================================= */

async function loadPiper(){

  if(piper){
    return piper;
  }

  if(piperLoading){

    while(piperLoading){

      await sleep(100);

    }

    if(piper){
      return piper;
    }

  }

  piperLoading =
    true;


  try{

    ttsStatus.innerHTML =
      "⏳ TTS motoru yükleniyor...";


    /*
      Piper web paketini dinamik yükle.
    */

    const mod =
      await import(
        "https://cdn.jsdelivr.net/npm/@mintplex-labs/piper-tts-web@1.1.0/+esm"
      );


    if(
      !mod ||
      typeof mod.predict !== "function"
    ){

      throw new Error(
        "Piper predict fonksiyonu bulunamadı."
      );

    }


    /*
      Piper nesnesini hazırlıyoruz.
    */

    piper =
      mod;


    /*
      ONNX Runtime'ın kendi modülü
      bazı sürümlerde wasm yolunu otomatik
      cdnjs üzerinden arıyor.

      Burada sayfanın temel çalışma koşullarını
      kontrol ediyoruz.
    */

    if(
      typeof WebAssembly ===
      "undefined"
    ){

      throw new Error(
        "Tarayıcı WebAssembly desteklemiyor."
      );

    }


    ttsStatus.innerHTML =
      `<span class="success">
        ✅ TTS motoru yüklendi.
      </span>`;


    return piper;

  }
  catch(error){

    console.error(
      "Piper:",
      error
    );


    piper =
      null;


    ttsStatus.innerHTML =
      `<span class="error">
        ❌ TTS motoru yüklenemedi.
        <br><br>
        ${escapeHTML(error.message)}
      </span>`;


    throw error;

  }
  finally{

    piperLoading =
      false;

  }

}


/* =========================================================
   GENERATE VOICE
========================================================= */

async function generateVoice(index){

  const scene =
    scenes[index];

  if(!scene){
    return;
  }


  try{

    const tts =
      await loadPiper();


    ttsStatus.innerHTML =
      `🎙️ Sahne ${index+1} hazırlanıyor...`;


    /*
      Almanca ses.

      Önce doğrudan Thorsten deneniyor.
    */

    let voiceId =
      "de_DE-thorsten-medium";


    /*
      Mevcut sesleri kontrol et.
    */

    if(
      typeof tts.voices ===
      "function"
    ){

      try{

        const voices =
          await tts.voices();


        console.log(
          "Piper voices:",
          voices
        );


        const names =
          Object.keys(
            voices || {}
          );


        const german =
          names.find(
            x =>
              /^de_DE/i.test(x)
          );


        if(german){

          voiceId =
            german;

        }

      }
      catch(e){

        console.warn(
          "Voice listesi alınamadı:",
          e
        );

      }

    }


    /*
      GERÇEK TTS
    */

    const wav =
      await tts.predict({

        text:
          scene.text,

        voiceId:
          voiceId

      });


    if(
      !(wav instanceof Blob)
    ){

      throw new Error(
        "Piper WAV Blob döndürmedi."
      );

    }


    if(scene.audioUrl){

      URL.revokeObjectURL(
        scene.audioUrl
      );

    }


    scene.audioBlob =
      wav;

    scene.audioUrl =
      URL.createObjectURL(
        wav
      );


    scene.duration =
      await getAudioDuration(
        scene.audioUrl
      );


    updateAudioUI(
      scene
    );


    ttsStatus.innerHTML =
      `<span class="success">
        ✅ Sahne ${index+1} seslendirildi.
        Süre: ${formatTime(scene.duration)}
      </span>`;


  }
  catch(error){

    console.error(
      "TTS ERROR:",
      error
    );


    ttsStatus.innerHTML =
      `<span class="error">
        ❌ Sahne ${index+1} seslendirme hatası:
        <br><br>
        ${escapeHTML(error.message)}
        <br><br>
        <small>
        Bu hata WAV oluşturulmadan önce ONNX/WASM
        motorunda oluştu.
        </small>
      </span>`;

  }

}


/* =========================================================
   ALL VOICES
========================================================= */

async function generateAll(){

  if(!scenes.length){

    alert(
      "Önce SAHNELERE BÖL."
    );

    return;

  }


  voiceAllBtn.disabled =
    true;

  splitBtn.disabled =
    true;


  try{

    for(
      let i=0;
      i<scenes.length;
      i++
    ){

      progressBar.style.width =
        (
          (i / scenes.length) * 100
        ) + "%";


      await generateVoice(
        i
      );

    }


    progressBar.style.width =
      "100%";


    ttsStatus.innerHTML =
      `<span class="success">
        🎉 ${scenes.length} sahnenin seslendirmesi tamamlandı.
      </span>`;

  }
  finally{

    voiceAllBtn.disabled =
      false;

    splitBtn.disabled =
      false;

  }

}


/* =========================================================
   AUDIO UI
========================================================= */

function updateAudioUI(scene){

  if(
    !scene.ui
  ){
    return;
  }


  scene.ui.audioBox
    .innerHTML = "";


  const audio =
    document.createElement("audio");

  audio.controls =
    true;

  audio.src =
    scene.audioUrl;


  scene.ui.audioBox
    .appendChild(
      audio
    );


  scene.ui.audioBadge
    .textContent =
      "🔊 " +
      formatTime(
        scene.duration
      );

}


/* =========================================================
   AUDIO DURATION
========================================================= */

function getAudioDuration(url){

  return new Promise(
    resolve=>{

      const audio =
        new Audio();


      audio.preload =
        "metadata";


      audio.onloadedmetadata =
        ()=>{

          const d =
            Number(
              audio.duration
            );

          resolve(
            Number.isFinite(d)
              ? d
              : 0
          );

        };


      audio.onerror =
        ()=>resolve(0);


      audio.src =
        url;

    }
  );

}


/* =========================================================
   DOWNLOAD WAV
========================================================= */

function downloadWav(scene){

  if(
    !scene.audioBlob ||
    !scene.audioUrl
  ){

    alert(
      "Önce seslendirme oluştur."
    );

    return;

  }


  const a =
    document.createElement("a");

  a.href =
    scene.audioUrl;

  a.download =
    "GeldStory_Sahne_" +
    scene.id +
    ".wav";


  document.body.appendChild(
    a
  );

  a.click();

  a.remove();

}


/* =========================================================
   CLEAR
========================================================= */

function clearAll(){

  scenes.forEach(
    scene=>{

      if(scene.audioUrl){

        URL.revokeObjectURL(
          scene.audioUrl
        );

      }

    }
  );


  scenes =
    [];


  storyInput.value =
    "";


  sceneList.innerHTML =
    "";


  sceneInfo.textContent =
    "Henüz sahne oluşturulmadı.";


  mainStatus.textContent =
    "Sistem hazır.";


  ttsStatus.textContent =
    "TTS henüz başlatılmadı.";


  progressBar.style.width =
    "0%";

}


/* =========================================================
   HELPERS
========================================================= */

function sleep(ms){

  return new Promise(
    r=>setTimeout(r,ms)
  );

}


function formatTime(seconds){

  if(
    !Number.isFinite(seconds)
  ){
    return "00:00";
  }


  const total =
    Math.round(
      Math.max(
        0,
        seconds
      )
    );


  const min =
    Math.floor(
      total / 60
    );


  const sec =
    total % 60;


  return (
    String(min).padStart(2,"0")
    +
    ":"
    +
    String(sec).padStart(2,"0")
  );

}


function escapeHTML(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   EVENTS
========================================================= */

splitBtn.addEventListener(
  "click",
  splitStory
);


clearBtn.addEventListener(
  "click",
  clearAll
);


voiceAllBtn.addEventListener(
  "click",
  generateAll
);


/* =========================================================
   READY
========================================================= */

console.log(
  "Mina Video AI V46.2 hazır."
);

</script>

</body>
</html>
