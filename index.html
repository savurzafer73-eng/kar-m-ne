<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="theme-color" content="#06130d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Batak Royale</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020805;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    color:white;
}

button{
    border:0;
    outline:0;
    cursor:pointer;
    font-family:inherit;
}

#app{
    position:relative;
    width:100%;
    height:100dvh;
    min-height:100vh;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 42%,#14502f 0,#0a2d1d 38%,#03120b 78%);
}

/* =========================
   MAIN MENU
========================= */

#menu{
    position:absolute;
    inset:0;
    z-index:500;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
        radial-gradient(circle at 50% 30%,rgba(24,125,73,.35),transparent 42%),
        linear-gradient(180deg,#04170e,#020805);
}

.menuBox{
    width:min(430px,94vw);
    padding:30px 22px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:28px;
    background:rgba(4,20,13,.92);
    box-shadow:
        0 30px 80px rgba(0,0,0,.55),
        inset 0 1px rgba(255,255,255,.08);
    text-align:center;
}

.logo{
    font-size:34px;
    font-weight:1000;
    letter-spacing:1px;
    margin-bottom:8px;
}

.logo span{
    color:#e8c66a;
}

.subtitle{
    color:#91a99d;
    font-size:13px;
    margin-bottom:30px;
}

.menuBtn{
    width:100%;
    height:58px;
    margin-top:12px;
    border-radius:17px;
    color:white;
    font-size:17px;
    font-weight:900;
    background:linear-gradient(135deg,#159653,#08713d);
    box-shadow:0 8px 22px rgba(0,0,0,.3);
}

.menuBtn:active{
    transform:scale(.97);
}

.menuBtn.secondary{
    background:linear-gradient(135deg,#273c33,#182b23);
}

.menuInfo{
    margin-top:20px;
    color:#72867c;
    font-size:11px;
}

/* =========================
   GAME
========================= */

#game{
    position:absolute;
    inset:0;
    display:none;
}

#topbar{
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:58px;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 12px;
    background:linear-gradient(180deg,rgba(0,0,0,.55),transparent);
}

.topPill{
    min-width:78px;
    height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 12px;
    border-radius:14px;
    background:rgba(0,0,0,.38);
    border:1px solid rgba(255,255,255,.08);
    font-size:12px;
    font-weight:900;
}

#pauseBtn{
    width:40px;
    height:40px;
    border-radius:13px;
    color:white;
    background:rgba(0,0,0,.4);
    border:1px solid rgba(255,255,255,.1);
    font-size:17px;
}

/* =========================
   TABLE
========================= */

#table{
    position:absolute;
    left:4%;
    right:4%;
    top:10%;
    bottom:20%;
    border-radius:45%;
    border:8px solid #4a2a17;
    background:
        radial-gradient(ellipse at center,#167044 0,#0c492c 53%,#07301d 100%);
    box-shadow:
        inset 0 0 45px rgba(0,0,0,.5),
        0 18px 50px rgba(0,0,0,.4);
}

#table:before{
    content:"";
    position:absolute;
    inset:3%;
    border:2px solid rgba(225,190,103,.18);
    border-radius:45%;
    pointer-events:none;
}

/* =========================
   PLAYERS
========================= */

.player{
    position:absolute;
    z-index:25;
    display:flex;
    align-items:center;
    gap:7px;
}

.avatar{
    width:42px;
    height:42px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(145deg,#263b35,#10231b);
    border:2px solid rgba(255,255,255,.16);
    box-shadow:0 5px 15px rgba(0,0,0,.35);
    font-size:20px;
}

.playerInfo{
    min-width:75px;
}

.playerName{
    font-size:11px;
    font-weight:900;
}

.playerStatus{
    margin-top:2px;
    color:#9bb1a6;
    font-size:9px;
}

#p0{
    left:50%;
    bottom:14%;
    transform:translateX(-50%);
}

#p1{
    right:2%;
    top:43%;
}

#p2{
    left:50%;
    top:5%;
    transform:translateX(-50%);
}

#p3{
    left:2%;
    top:43%;
}

/* =========================
   CENTER TRICK
========================= */

#trickArea{
    position:absolute;
    left:50%;
    top:50%;
    width:190px;
    height:180px;
    transform:translate(-50%,-50%);
    z-index:40;
}

.trickCard{
    position:absolute;
    width:57px;
    height:81px;
    left:50%;
    top:50%;
    transform-origin:center;
    transition:
        transform .35s cubic-bezier(.2,.8,.2,1),
        opacity .25s;
}

.trickCard .card{
    width:100%;
    height:100%;
}

/* =========================
   CARDS
========================= */

.card{
    position:relative;
    width:60px;
    height:86px;
    border-radius:9px;
    background:
        linear-gradient(145deg,#ffffff,#eeeeee);
    color:#151515;
    border:1px solid rgba(0,0,0,.22);
    box-shadow:
        0 5px 10px rgba(0,0,0,.38),
        inset 0 0 0 1px rgba(255,255,255,.75);
    overflow:hidden;
}

.card.red{
    color:#bd2020;
}

.cardCorner{
    position:absolute;
    left:5px;
    top:4px;
    display:flex;
    flex-direction:column;
    align-items:center;
    line-height:.9;
    font-weight:1000;
}

.cardRank{
    font-size:15px;
}

.cardSuitSmall{
    font-size:12px;
    margin-top:2px;
}

.cardCenterSuit{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-size:31px;
    opacity:.92;
}

.cardGloss{
    position:absolute;
    inset:0;
    background:linear-gradient(
        125deg,
        rgba(255,255,255,.42),
        transparent 30%,
        transparent 70%,
        rgba(0,0,0,.05)
    );
    pointer-events:none;
}

/* =========================
   USER HAND
========================= */

#userArea{
    position:absolute;
    z-index:95 !important;
    left:50%;
    bottom:0;
    width:min(500px,100%);
    transform:translateX(-50%);
    padding:5px 4px calc(8px + env(safe-area-inset-bottom));
}

.handPanel{
    width:100%;
}

.handRow{
    display:flex;
    flex-direction:row;
    flex-wrap:nowrap;
    justify-content:center;
    align-items:flex-end;
    direction:ltr;
    gap:4px;
    min-height:88px;
}

.userCardWrap{
    flex:0 0 auto;
    transition:
        transform .18s ease,
        margin .18s ease;
}

.userCardWrap .card{
    transition:
        transform .18s ease,
        box-shadow .18s ease;
}

.userCardWrap.playable .card{
    box-shadow:
        0 8px 17px rgba(0,0,0,.4),
        0 0 0 2px rgba(255,211,87,.13);
}

.userCardWrap:hover .card{
    transform:translateY(-8px);
}

.userCardWrap.selected .card{
    transform:translateY(-13px);
    box-shadow:
        0 12px 25px rgba(0,0,0,.5),
        0 0 0 2px #e9c75e;
}

/* =========================
   PARTNER HAND
========================= */

#partnerHand{
    position:absolute;
    left:50%;
    top:12%;
    transform:translateX(-50%);
    width:min(370px,75%);
    z-index:20;
    display:none;
}

.partnerTitle{
    text-align:center;
    font-size:10px;
    color:#b9c9c1;
    margin-bottom:3px;
    font-weight:900;
}

.partnerCards{
    display:flex;
    flex-wrap:nowrap;
    justify-content:center;
    direction:ltr;
    gap:2px;
}

.partnerCard{
    width:27px;
    height:40px;
    border-radius:5px;
    background:linear-gradient(145deg,#fff,#e8e8e8);
    color:#222;
    border:1px solid rgba(0,0,0,.2);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:8px;
    font-weight:1000;
    box-shadow:0 2px 5px rgba(0,0,0,.3);
}

.partnerCard.red{
    color:#bd2020;
}

/* =========================
   BIDDING
========================= */

#bidOverlay,
#trumpOverlay,
#resultOverlay,
#pauseOverlay{
    position:absolute;
    inset:0;
    z-index:80;
    display:none;
    align-items:center;
    justify-content:center;
}

#bidOverlay{
    z-index:80;
    align-items:flex-start;
    justify-content:center;
    padding-top:13%;
    background:rgba(0,0,0,.18);
    backdrop-filter:blur(2px);
}

.panel{
    width:min(380px,90vw);
    padding:19px;
    border-radius:24px;
    background:rgba(4,15,10,.96);
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 25px 70px rgba(0,0,0,.6);
    text-align:center;
}

.panelTitle{
    font-size:20px;
    font-weight:1000;
    margin-bottom:6px;
}

.panelSub{
    color:#94a99f;
    font-size:11px;
    margin-bottom:15px;
}

.bidButtons{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:7px;
}

.bidBtn{
    height:45px;
    border-radius:12px;
    color:white;
    font-weight:1000;
    background:linear-gradient(145deg,#165c3a,#0b3925);
    border:1px solid rgba(255,255,255,.08);
}

.bidBtn.pass{
    background:linear-gradient(145deg,#4c3028,#30201a);
}

.bidBtn:active{
    transform:scale(.94);
}

/* =========================
   TRUMP
========================= */

.trumpButtons{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.trumpBtn{
    height:65px;
    border-radius:16px;
    background:#f3f3f3;
    color:#222;
    font-size:27px;
    font-weight:1000;
    box-shadow:0 7px 15px rgba(0,0,0,.3);
}

.trumpBtn.red{
    color:#c11e1e;
}

.trumpBtn.black{
    color:#111;
}

/* =========================
   RESULT
========================= */

#resultOverlay{
    background:rgba(0,0,0,.65);
    backdrop-filter:blur(5px);
}

.resultScore{
    font-size:39px;
    font-weight:1000;
    color:#e6c568;
    margin:15px 0;
}

.resultText{
    color:#b6c6be;
    font-size:13px;
    line-height:1.6;
    margin-bottom:15px;
}

/* =========================
   PAUSE
========================= */

#pauseOverlay{
    z-index:300;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(7px);
}

/* =========================
   TOAST
========================= */

#toast{
    position:absolute;
    left:50%;
    top:58%;
    transform:translate(-50%,-50%);
    z-index:400;
    padding:11px 17px;
    border-radius:14px;
    background:rgba(0,0,0,.75);
    border:1px solid rgba(255,255,255,.12);
    color:white;
    font-size:12px;
    font-weight:900;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s;
}

/* =========================
   WIN FLASH
========================= */

#winFlash{
    position:absolute;
    inset:0;
    z-index:100;
    pointer-events:none;
    opacity:0;
    background:radial-gradient(circle,rgba(255,216,85,.24),transparent 45%);
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    #table{
        left:2%;
        right:2%;
        top:9%;
        bottom:22%;
        border-width:6px;
    }

    .avatar{
        width:36px;
        height:36px;
        font-size:17px;
    }

    .playerInfo{
        min-width:58px;
    }

    .playerName{
        font-size:9px;
    }

    .playerStatus{
        font-size:8px;
    }

    #p1{
        right:0;
    }

    #p3{
        left:0;
    }

    #p2{
        top:5%;
    }

    #partnerHand{
        top:11%;
        width:90%;
    }

    .partnerCard{
        width:25px;
        height:37px;
        font-size:7px;
    }

    .handRow{
        gap:2px;
        min-height:73px;
    }

    .card{
        width:49px;
        height:71px;
        border-radius:7px;
    }

    .cardRank{
        font-size:12px;
    }

    .cardSuitSmall{
        font-size:10px;
    }

    .cardCenterSuit{
        font-size:24px;
    }

    .userCardWrap{
        flex-basis:auto;
    }

    #trickArea{
        width:160px;
        height:150px;
    }

    .trickCard{
        width:49px;
        height:71px;
    }

    #bidOverlay{
        padding-top:15%;
    }

    .panel{
        padding:15px;
        width:92vw;
    }

    .panelTitle{
        font-size:18px;
    }

    .bidBtn{
        height:42px;
        font-size:13px;
    }

    #userArea{
        padding-bottom:calc(6px + env(safe-area-inset-bottom));
    }
}

/* very small screens */
@media(max-width:360px){

    .card{
        width:43px;
        height:64px;
    }

    .handRow{
        gap:1px;
    }

    .cardRank{
        font-size:11px;
    }

    .cardCenterSuit{
        font-size:21px;
    }

    .partnerCard{
        width:22px;
        height:33px;
    }
}
</style>
</head>

<body>

<div id="app">

    <!-- ================= MENU ================= -->

    <div id="menu">

        <div class="menuBox">

            <div class="logo">
                BATAK <span>ROYALE</span>
            </div>

            <div class="subtitle">
                Profesyonel Batak Deneyimi
            </div>

            <button class="menuBtn" onclick="startGame(false)">
                ♠ TEKLİ BATAK
            </button>

            <button class="menuBtn" onclick="startGame(true)">
                ♣ EŞLİ BATAK
            </button>

            <button class="menuBtn secondary" onclick="toggleSound()">
                🔊 SES: <span id="soundText">AÇIK</span>
            </button>

            <div class="menuInfo">
                52 Kart • 13 El • Akıllı Yapay Zekâ
            </div>

        </div>

    </div>

    <!-- ================= GAME ================= -->

    <div id="game">

        <div id="topbar">

            <div class="topPill">
                EL <span id="trickCount" style="margin-left:5px">0/13</span>
            </div>

            <div class="topPill">
                KOZ <span id="trumpText" style="margin-left:5px">-</span>
            </div>

            <button id="pauseBtn" onclick="pauseGame()">Ⅱ</button>

        </div>

        <!-- TABLE -->

        <div id="table">

            <div id="p0" class="player">

                <div class="avatar">🙂</div>

                <div class="playerInfo">
                    <div class="playerName">SEN</div>
                    <div id="p0Status" class="playerStatus">Hazır</div>
                </div>

            </div>

            <div id="p1" class="player">

                <div class="playerInfo">
                    <div class="playerName">MERT</div>
                    <div id="p1Status" class="playerStatus">Rakip</div>
                </div>

                <div class="avatar">😎</div>

            </div>

            <div id="p2" class="player">

                <div class="avatar">🤝</div>

                <div class="playerInfo">
                    <div class="playerName">PARTNER</div>
                    <div id="p2Status" class="playerStatus">Takım</div>
                </div>

            </div>

            <div id="p3" class="player">

                <div class="avatar">🧠</div>

                <div class="playerInfo">
                    <div class="playerName">AHMET</div>
                    <div id="p3Status" class="playerStatus">Rakip</div>
                </div>

            </div>

            <!-- CENTER -->

            <div id="trickArea"></div>

        </div>

        <!-- PARTNER HAND -->

        <div id="partnerHand">

            <div class="partnerTitle">
                PARTNERİN ELİ — KARTLARINI SEN OYNATIRSIN
            </div>

            <div id="partnerCards" class="partnerCards"></div>

        </div>

        <!-- USER HAND -->

        <div id="userArea">

            <div class="handPanel">

                <div id="userRow1" class="handRow"></div>

                <div id="userRow2" class="handRow"></div>

            </div>

        </div>

        <!-- BID -->

        <div id="bidOverlay">

            <div class="panel">

                <div class="panelTitle">
                    İHALE
                </div>

                <div class="panelSub" id="bidInfo">
                    Kaç el alacağını seç
                </div>

                <div class="bidButtons">

                    <button class="bidBtn" onclick="playerBid(5)">5</button>
                    <button class="bidBtn" onclick="playerBid(6)">6</button>
                    <button class="bidBtn" onclick="playerBid(7)">7</button>
                    <button class="bidBtn" onclick="playerBid(8)">8</button>
                    <button class="bidBtn" onclick="playerBid(9)">9</button>

                    <button class="bidBtn" onclick="playerBid(10)">10</button>
                    <button class="bidBtn" onclick="playerBid(11)">11</button>
                    <button class="bidBtn" onclick="playerBid(12)">12</button>
                    <button class="bidBtn" onclick="playerBid(13)">13</button>
                    <button class="bidBtn pass" onclick="playerBid(0)">PAS</button>

                </div>

            </div>

        </div>

        <!-- TRUMP -->

        <div id="trumpOverlay">

            <div class="panel">

                <div class="panelTitle">
                    KOZ SEÇ
                </div>

                <div class="panelSub">
                    Elini görerek kozunu belirle
                </div>

                <div class="trumpButtons">

                    <button class="trumpBtn black" onclick="chooseTrump('♠')">♠</button>
                    <button class="trumpBtn red" onclick="chooseTrump('♥')">♥</button>
                    <button class="trumpBtn red" onclick="chooseTrump('♦')">♦</button>
                    <button class="trumpBtn black" onclick="chooseTrump('♣')">♣</button>

                </div>

            </div>

        </div>

        <!-- RESULT -->

        <div id="resultOverlay">

            <div class="panel">

                <div class="panelTitle" id="resultTitle">
                    EL BİTTİ
                </div>

                <div class="resultScore" id="resultScore">
                    0 - 0
                </div>

                <div class="resultText" id="resultText"></div>

                <button class="menuBtn" onclick="newRound()">
                    YENİ EL
                </button>

                <button class="menuBtn secondary" onclick="backMenu()">
                    ANA MENÜ
                </button>

            </div>

        </div>

        <!-- PAUSE -->

        <div id="pauseOverlay">

            <div class="panel">

                <div class="panelTitle">
                    OYUN DURAKLATILDI
                </div>

                <button class="menuBtn" onclick="resumeGame()">
                    DEVAM ET
                </button>

                <button class="menuBtn secondary" onclick="backMenu()">
                    ANA MENÜ
                </button>

            </div>

        </div>

        <div id="toast"></div>

        <div id="winFlash"></div>

    </div>

</div>

<script>

/* =========================================================
   BATak ROYALE
   TEK DOSYA SÜRÜM
========================================================= */

/* =========================
   CONSTANTS
========================= */

const SUITS = ["♠","♥","♦","♣"];

const SUIT_ORDER = {
    "♠":0,
    "♥":1,
    "♦":2,
    "♣":3
};

const RANKS = [
    {name:"2",value:2},
    {name:"3",value:3},
    {name:"4",value:4},
    {name:"5",value:5},
    {name:"6",value:6},
    {name:"7",value:7},
    {name:"8",value:8},
    {name:"9",value:9},
    {name:"10",value:10},
    {name:"J",value:11},
    {name:"Q",value:12},
    {name:"K",value:13},
    {name:"A",value:14}
];

/*
    ÖNEMLİ:
    Kartlar artık önce sembole göre,
    sonra aynı sembol içinde büyükten küçüğe sıralanır.

    ♠ A K Q J 10 9 8 7 6 5 4 3 2
    ♥ A K Q J 10 9 8 7 6 5 4 3 2
    ♦ A K Q J 10 9 8 7 6 5 4 3 2
    ♣ A K Q J 10 9 8 7 6 5 4 3 2
*/

function compareCards(a,b){

    if(a.suit !== b.suit){
        return SUIT_ORDER[a.suit] - SUIT_ORDER[b.suit];
    }

    return b.value - a.value;
}

/* =========================
   STATE
========================= */

const state = {

    teamMode:false,

    sound:true,

    phase:"menu",

    dealer:0,

    turn:0,

    bidder:-1,

    highestBid:0,

    bids:[],

    trump:null,

    hands:[[],[],[],[]],

    trick:[],

    trickNumber:0,

    tricksWon:[0,0,0,0],

    teamTricks:[0,0],

    scores:[0,0],

    selectedCard:null,

    paused:false,

    pendingWinner:null,

    roundStarted:false

};

/* =========================
   HELPERS
========================= */

function $(id){
    return document.getElementById(id);
}

function sleep(ms){
    return new Promise(resolve=>setTimeout(resolve,ms));
}

function random(min,max){
    return Math.floor(Math.random()*(max-min+1))+min;
}

function shuffle(array){

    for(let i=array.length-1;i>0;i--){

        const j=Math.floor(Math.random()*(i+1));

        [array[i],array[j]]=[array[j],array[i];

    }

    return array;
}

function cardLabel(card){
    return card.rank + card.suit;
}

function isRedSuit(suit){
    return suit==="♥" || suit==="♦";
}

/* =========================
   SOUND
========================= */

let audioCtx=null;

function initAudio(){

    if(!state.sound) return;

    try{

        if(!audioCtx){
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        if(audioCtx.state==="suspended"){
            audioCtx.resume();
        }

    }catch(e){}
}

function playTone(freq,duration=0.08,type="sine"){

    if(!state.sound) return;

    initAudio();

    if(!audioCtx) return;

    try{

        const osc=audioCtx.createOscillator();
        const gain=audioCtx.createGain();

        osc.type=type;
        osc.frequency.value=freq;

        gain.gain.setValueAtTime(.0001,audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(.06,audioCtx.currentTime+.01);
        gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime+duration+.02);

    }catch(e){}
}

function toggleSound(){

    state.sound=!state.sound;

    $("soundText").textContent=state.sound ? "AÇIK" : "KAPALI";

    if(state.sound){
        initAudio();
        playTone(650,.1);
    }
}

/* =========================
   DECK
========================= */

function createDeck(){

    const deck=[];

    for(const suit of SUITS){

        for(const rank of RANKS){

            deck.push({
                suit:suit,
                rank:rank.name,
                value:rank.value
            });

        }

    }

    return deck;
}

function dealCards(){

    state.hands=[[],[],[],[]];

    for(let i=0;i<52;i++){

    /*

async function aiBidSequence(){

    state.phase="bidAI";

    for(let p=1;p<4;p++){

        await sleep(650);

        const bid=calculateAIBid(p);

        state.bids[p]=bid;

        if(bid>state.highestBid){

            state.highestBid=bid;
            state.bidder=p;

        }

        updateStatuses();

    }

    await sleep(500);

    /*
       Herkes pas geçerse kullanıcıya 5 ver.
    */

    if(state.bidder===-1){

        state.bidder=0;
        state.highestBid=5;

        showToast("Herkes pas geçti — ihale sana kaldı");

        await sleep(700);

    }

    state.phase="trump";

    if(state.bidder===0){

        /*
           Kullanıcı koz seçerken de eli görünür.
        */

        state.hands[0].sort(compareCards);

        renderUserHand();

        $("userArea").style.display="block";
        $("userArea").style.zIndex="95";

        $("trumpOverlay").style.display="flex";

        const aiTrump=chooseAITrump(state.bidder);

    }

}

/* =========================
   AI BID
========================= */

function calculateAIBid(player){

    const hand=state.hands[player];

    let score=0;

    for(const card of hand){

        if(card.value>=14){
            score+=1.4;
        }else if(card.value===13){
            score+=.85;
        }else if(card.value===12){
            score+=.55;
        }else if(card.value===11){
            score+=.35;
        }

    }

    const suits={};

    for(const s of SUITS){
        suits[s]=hand.filter(c=>c.suit===s).length;
    }

    const maxSuit=Math.max(...Object.values(suits));

    score+=Math.max(0,maxSuit-3)*.45;

    let bid=Math.round(4+score);

    bid=Math.max(5,Math.min(10,bid));

    /*
       Üst ihaleyi geçme ihtimali
    */

    if(state.highestBid>0){

        if(bid<=state.highestBid){

            return 0;

        }

        if(Math.random()<.28){

            return 0;

        }

    }

    return bid;
}

function chooseTrump(suit){

    if(state.phase!=="trump") return;

    startPlay(suit);

/* =========================
   AI TRUMP
========================= */

function chooseAITrump(player){

    const hand=state.hands[player];

    let bestSuit=SUITS[0];
    let bestScore=-999;

    for(const suit of SUITS){

        const suited=hand.filter(c=>c.suit===suit);

        let score=suited.length*2;

        suited.forEach(c=>{

            if(c.value>=14) score+=3;
            else if(c.value>=13) score+=2;
            else if(c.value>=12) score+=1;

        });

        if(score>bestScore){

            bestScore=score;
            bestSuit=suit;

        }

    }

    return bestSuit;
}

/* =========================
   VALID CARD
========================= */

function getLeadSuit(){

    if(state.trick.length===0){
        return null;
    }

    return state.trick[0].card.suit;
}

function canPlayCard(player,card){

    if(state.phase!=="play"){
        return false;
    }

    if(state.turn!==player){
        return false;
    }

    if(state.trick.length===0){
        return true;
    }

    const leadSuit=getLeadSuit();

    const hasLead=state.hands[player].some(
        c=>c.suit===leadSuit
    );

    if(hasLead){
        return card.suit===leadSuit;
    }

    return true;
}

========================= */

    if(state.phase!=="play") return;

    const hand=state.hands[player];

    const card=hand[index];

    if(!card) return;

    if(!canPlayCard(player,card)) return;

    hand.splice(index,1);

    state.trick.push({
        player:player,
        card:card
    });

    playTone(
        isRedSuit(card.suit)?520:430,
        .07,
        "triangle"
    );

    renderUserHand();

    if(state.teamMode){
        renderPartnerHand();
    }

    animatePlayedCard(player,card);

    updateStatuses();

    await sleep(380);

    if(state.trick.length===4){

        await finishTrick();

    }else{

        state.turn=(state.turn+1)%4;

        updateStatuses();

        setTimeout(()=>{

            playCurrentTurn();

/* =========================
   AI CARD
========================= */

function chooseAICard(player){

    const hand=state.hands[player];

    const valid=hand.filter(c=>canPlayCard(player,c));

    if(valid.length===0){
        return 0;
    }

    /*
       İlk kart:
       yüksek ama her zaman As değil.
    */

    if(state.trick.length===0){

        const sorted=[...valid].sort((a,b)=>b.value-a.value);

        const high=sorted.filter(c=>c.value>=11);

        if(high.length && Math.random()<.65){

            const chosen=high[random(0,high.length-1)];

            return hand.indexOf(chosen);

        }

        const chosen=sorted[random(
            Math.max(0,sorted.length-3),
            sorted.length-1
        )];

        return hand.indexOf(chosen);

    }

    /*
       Kazanabiliyorsa en düşük kazanma kartını seç.
    */

    const winning=valid.filter(card=>{

        const hypothetical=[
            ...state.trick,
            {player:player,card:card}
        ];

        const winner=findTrickWinner(hypothetical);

        return winner===player;

    });

    if(winning.length){

        winning.sort((a,b)=>{

            const av=a.suit===state.trump ? 100+b.value : b.value;
            const bv=b.suit===state.trump ? 100+a.value : a.value;

            return av-bv;

        });

        return hand.indexOf(winning[0]);

    }

    /*
       Kazanamıyorsa en düşük kart.
    */

    valid.sort((a,b)=>{

        let av=a.value;
        let bv=b.value;

        if(a.suit===state.trump) av+=20;
        if(b.suit===state.trump) bv+=20;

        return av-bv;

    });

    return hand.indexOf(valid[0]);

}

/* =========================
   TRICK WINNER
========================= */

function findTrickWinner(trick){

    if(!trick.length){
        return -1;
    }

    const leadSuit=trick[0].card.suit;

    let best=trick[0];

    for(let i=1;i<trick.length;i++){

        const current=trick[i];

        if(isCardStronger(
            current.card,
            best.card,
            leadSuit
        )){

            best=current;

        }

    }

    return best.player;
}

function isCardStronger(a,b,leadSuit){

    const aTrump=a.suit===state.trump;
    const bTrump=b.suit===state.trump;

    if(aTrump && !bTrump) return true;

    if(!aTrump && bTrump) return false;

    if(aTrump && bTrump){

        return a.value>b.value;

    }

    const aLead=a.suit===leadSuit;
    const bLead=b.suit===leadSuit;

    if(aLead && !bLead) return true;

    if(!aLead && bLead) return false;

    if(!aLead && !bLead) return false;

    return a.value>b.value;
}

/* =========================
   FINISH TRICK
========================= */

async function finishTrick(){

    const winner=findTrickWinner(state.trick);

    state.tricksWon[winner]++;

    if(winner===0 || winner===2){

        state.teamTricks[0]++;

    }else{

        state.teamTricks[1]++;

    }

    showWinnerFlash(winner);

    await sleep(650);

    animateTrickToWinner(winner);

    await sleep(500);

    clearTrick();

    state.trickNumber++;

    $("trickCount").textContent=
        state.trickNumber+"/13";

    if(state.trickNumber>=13){

        await finishRound();

        return;

    }

    state.turn=winner;

    state.trick=[];

    renderUserHand();

    if(state.teamMode){
        renderPartnerClickable();
    }

    updateStatuses();

    await sleep(350);

    playCurrentTurn();

}

/* =========================
   ROUND RESULT
========================= */

async function finishRound(){

    state.phase="result";

    let teamA=state.teamTricks[0];
    let teamB=state.teamTricks[1];

    if(!state.teamMode){

        teamA=state.tricksWon[0];
        teamB=
            state.tricksWon[1]+
            state.tricksWon[2]+
            state.tricksWon[3];

    }

    const bidder=state.bidder;
    const contract=state.highestBid;

    let bidderTeam;

    if(!state.teamMode){

        bidderTeam=bidder===0 ? 0 : 1;

    }else{

        bidderTeam=
            (bidder===0 || bidder===2)
                ? 0
                : 1;

    }

    const bidderTricks=
        bidderTeam===0
            ? teamA
            : teamB;

    let result="";

    if(bidderTricks>=contract){

        state.scores[bidderTeam]+=contract;

        result=
            "İhale başarılı! "+contract+
            " el hedefini geçtin.";

    }else{

        state.scores[bidderTeam]-=contract;

        result=
            "İhale başarısız. "+
            contract+" el alınamadı.";

    }

    if(teamA>teamB){

        $("resultTitle").textContent=
            "TAKIMIN KAZANDI";

    }else if(teamA<teamB){

        $("resultTitle").textContent=
            "RAKİP KAZANDI";

    }else{

        $("resultTitle").textContent=
            "BERABERE";

    }

    $("resultScore").textContent=
        teamA+" - "+teamB;

    $("resultText").innerHTML=
        result+
        "<br><br>"+
        "Toplam skor: "+
        state.scores[0]+" - "+state.scores[1];

    $("resultOverlay").style.display="flex";

}

        renderPartnerClickable();

        showToast("Partnerinin kartını sen seç");

        return;

    }

    if(state.turn===0){

        renderUserHand();

        return;

    }

    const player=state.turn;

    setTimeout(()=>{

        if(state.phase!=="play") return;

        const index=chooseAICard(player);

        playCard(player,index);

    },500);

};

/* =========================
   OVERRIDE RENDER USER
   KEEP SORTED
========================= */

const oldRenderUserHand=renderUserHand;

renderUserHand=function(){

    state.hands[0].sort(compareCards);

    oldRenderUserHand();

};

/* =========================
   INITIAL UI
========================= */

$("soundText").textContent=
    state.sound ? "AÇIK" : "KAPALI";

/* =========================
   AUDIO START ON TOUCH
========================= */

document.addEventListener(
    "pointerdown",
    ()=>{
        if(state.sound){
            initAudio();
        }
    },
    {once:true}
);

</script>

</body>
</html>
