<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mina Video AI V37 - Scene Test</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#070b12;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

header{
    background:#111827;
    border-bottom:1px solid #263244;
    padding:20px;
    position:sticky;
    top:0;
    z-index:10;
}

h1{
    margin:0;
    font-size:25px;
}

.headerText{
    color:#94a3b8;
    margin-top:6px;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.box{
    background:#111827;
    border:1px solid #263244;
    border-radius:15px;
    padding:18px;
    margin-bottom:18px;
}

textarea{
    width:100%;
    background:#05080d;
    color:#fff;
    border:1px solid #334155;
    border-radius:10px;
    padding:14px;
    font-size:15px;
    line-height:1.5;
    resize:vertical;
    outline:none;
}

#story{
    min-height:220px;
}

button{
    border:0;
    border-radius:9px;
    padding:12px 16px;
    margin-top:12px;
    margin-right:8px;
    background:#2563eb;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:.85;
}

.green{
    background:#059669;
}

.orange{
    background:#d97706;
}

.gray{
    background:#475569;
}

button:disabled{
    opacity:.4;
    cursor:not-allowed;
}

.controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:12px;
}

select{
    background:#05080d;
    color:white;
    border:1px solid #334155;
    border-radius:8px;
    padding:10px;
}

#status{
    margin-top:15px;
    padding:12px;
    background:#05080d;
    border-radius:9px;
    color:#94a3b8;
}

#scenes{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
}

.scene{
    background:#0b1220;
    border:1px solid #334155;
    border-radius:14px;
    overflow:hidden;
}

.sceneHeader{
    padding:12px 14px;
    background:#172033;
    font-weight:bold;
    border-bottom:1px solid #334155;
}

.sceneContent{
    padding:14px;
}

.sceneImage{
    width:100%;
    aspect-ratio:16/9;
    background:#020617;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    margin-bottom:14px;
}

.sceneImage img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.placeholder{
    color:#64748b;
    text-align:center;
}

.sceneLabel{
    color:#93c5fd;
    font-weight:bold;
    font-size:13px;
    margin:12px 0 6px;
}

.sceneText{
    min-height:120px;
}

.prompt{
    min-height:210px;
    font-size:13px;
}

.sceneButtons{
    display:flex;
    flex-wrap:wrap;
}

.sceneButtons button{
    flex:1;
    min-width:130px;
}

.error{
    margin-top:10px;
    padding:10px;
    background:#3f1010;
    border:1px solid #7f1d1d;
    border-radius:8px;
    color:#fca5a5;
}

.success{
    color:#86efac !important;
}

@media(max-width:800px){
    #scenes{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header>
    <h1>🎬 Mina Video AI V37</h1>
    <div class="headerText">
        GeldStory — Sahne + Prompt + Görsel Test
    </div>
</header>

<div class="container">

<div class="box">

    <h2>1️⃣ Hikâyeni Gir</h2>

    <textarea id="story"></textarea>

    <div class="controls">

        <label>
            Sahne:
            <select id="sceneCount">
                <option value="6">6</option>
                <option value="8" selected>8</option>
                <option value="10">10</option>
                <option value="12">12</option>
            </select>
        </label>

        <label>
            Format:
            <select id="format">
                <option value="16:9">16:9</option>
                <option value="9:16">9:16</option>
                <option value="1:1">1:1</option>
            </select>
        </label>

    </div>

    <button onclick="createScenes()">
        🎬 2 — SAHNELERİ OLUŞTUR
    </button>

    <button
        id="allButton"
        class="green"
        onclick="generateAll()"
        disabled>
        🖼️ 3 — TÜM GÖRSELLERİ ÜRET
    </button>

    <button
        class="gray"
        onclick="clearEverything()">
        🗑️ TEMİZLE
    </button>

    <div id="status">
        Hazır.
    </div>

</div>


<div class="box">

    <h2>🎞️ SAHNELER</h2>

    <div id="scenes">
        <div class="placeholder">
            Henüz sahne oluşturulmadı.
        </div>
    </div>

</div>

</div>


<script>

/* =====================================================
   GLOBAL
===================================================== */

var scenes = [];


/* =====================================================
   ÖRNEK HİKÂYE
===================================================== */

document.getElementById("story").value =
"Im Jahr 1985 hatte ein junger Mann namens Thomas nur wenige Euro in seiner Tasche. " +
"Er arbeitete jeden Tag in einem kleinen Geschäft und träumte davon, eines Tages sein eigenes Unternehmen zu gründen. " +
"Viele Menschen glaubten nicht an seine Idee. Trotzdem sparte Thomas jeden Monat einen kleinen Teil seines Gehalts. " +
"Nach mehreren Jahren wagte er den ersten Schritt und eröffnete ein kleines Geschäft in einer unscheinbaren Straße. " +
"Die ersten Monate waren schwierig. Es kamen nur wenige Kunden und Thomas musste jeden Tag länger arbeiten. " +
"Doch er gab nicht auf. Er veränderte seine Strategie und hörte seinen Kunden genau zu. " +
"Langsam wuchs das Geschäft und immer mehr Menschen wurden auf das Unternehmen aufmerksam. " +
"Nach vielen Jahren war aus dem kleinen Geschäft ein erfolgreiches Unternehmen geworden. " +
"Thomas hatte seinen Traum nicht aufgegeben.";


/* =====================================================
   STATUS
===================================================== */

function status(text,success){

    var el=document.getElementById("status");

    el.innerHTML=text;

    if(success){
        el.className="success";
    }else{
        el.className="";
    }

}


/* =====================================================
   CÜMLELER
===================================================== */

function getSentences(text){

    text=text
        .replace(/\r/g," ")
        .replace(/\n/g," ")
        .replace(/\s+/g," ")
        .trim();

    if(!text){
        return [];
    }

    var parts=text.match(/[^.!?]+[.!?]+|[^.!?]+$/g);

    if(!parts){
        return [text];
    }

    return parts
        .map(function(x){
            return x.trim();
        })
        .filter(function(x){
            return x.length>0;
        });

}


/* =====================================================
   SAHNELERE BÖL
===================================================== */

function makeParts(text,count){

    var sentences=getSentences(text);

    var result=[];

    if(sentences.length===0){
        return result;
    }

    var per=Math.ceil(sentences.length/count);

    for(var i=0;i<count;i++){

        var start=i*per;

        var end=start+per;

        var piece=sentences.slice(start,end);

        if(piece.length>0){
            result.push(piece.join(" "));
        }

    }


    /*
       Eğer cümle sayısı azsa,
       kalan sahneleri kelimelere böl.
    */

    if(result.length<count){

        var words=text.split(/\s+/);

        var total=count;

        result=[];

        var size=Math.ceil(words.length/total);

        for(var j=0;j<total;j++){

            var part=words.slice(
                j*size,
                (j+1)*size
            );

            if(part.length){
                result.push(part.join(" "));
            }

        }

    }


    /*
       Her durumda istenen sahne sayısını tamamla.
    */

    while(result.length<count){

        result.push(
            result[result.length-1] || text
        );

    }

    return result.slice(0,count);

}


/* =====================================================
   PROMPT
===================================================== */

function makePrompt(sceneText,index,total){

    var position="";

    if(index===0){
        position="opening scene, establishing shot";
    }
    else if(index===total-1){
        position="final scene, successful and emotional conclusion";
    }
    else if(index<total/2){
        position="early story development";
    }
    else{
        position="turning point and progress";
    }


    return (
        "Cinematic photorealistic German business documentary scene. " +

        "Story moment: " +
        sceneText +

        ". " +

        "Visualize this exact story moment with realistic characters " +
        "and believable real-world surroundings. " +

        "Consistent main character throughout the entire story. " +

        position + ". " +

        "The character is actively doing something related to the story, " +
        "not simply posing. " +

        "Professional cinematic camera composition, natural perspective, " +
        "realistic facial expression, realistic hands, realistic clothing, " +
        "natural skin texture, realistic architecture, detailed background, " +
        "natural cinematic lighting, realistic shadows, shallow depth of field, " +
        "35mm documentary photography, high-end German television documentary, " +
        "dramatic but realistic atmosphere, highly detailed, photorealistic, " +
        "professional film still, no text, no subtitles, no watermark, " +
        "no logo, no cartoon, no anime, no illustration, no CGI, no distorted face, " +
        "no extra fingers, no extra limbs, no duplicate people."
    );

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   SAHNELERİ OLUŞTUR
===================================================== */

function createScenes(){

    var story=
        document.getElementById("story").value.trim();

    if(!story){

        status("❌ Hikâye boş.",false);

        return;
    }


    var count=
        parseInt(
            document.getElementById("sceneCount").value,
            10
        );


    status(
        "⏳ Sahneler oluşturuluyor..."
    );


    var parts=
        makeParts(
            story,
            count
        );


    scenes=[];


    for(var i=0;i<count;i++){

        scenes.push({

            id:i+1,

            text:parts[i] || story,

            prompt:makePrompt(
                parts[i] || story,
                i,
                count
            ),

            image:null,

            error:""

        });

    }


    renderScenes();


    document.getElementById("allButton").disabled=false;


    status(
        "✅ "+scenes.length+
        " sahne oluşturuldu. "+
        "Her sahnenin prompt'u hazır.",
        true
    );

}


/* =====================================================
   SAHNELERİ GÖSTER
===================================================== */

function renderScenes(){

    var container=
        document.getElementById("scenes");


    if(!scenes.length){

        container.innerHTML=
            '<div class="placeholder">Henüz sahne yok.</div>';

        return;
    }


    var html="";


    for(var i=0;i<scenes.length;i++){

        var s=scenes[i];


        html+=
        '<div class="scene">'+

            '<div class="sceneHeader">'+
                '🎬 SAHNE '+s.id+
            '</div>'+

            '<div class="sceneContent">'+


                '<div class="sceneImage" id="image-'+s.id+'">'+

                    (
                        s.image

                        ?

                        '<img src="'+
                        s.image+
                        '" alt="Sahne '+s.id+'">'

                        :

                        '<div class="placeholder">'+
                        '🖼️<br>Görsel henüz üretilmedi'+
                        '</div>'
                    )

                +'</div>'+


                '<div class="sceneLabel">'+
                    '📝 SAHNE METNİ'+
                '</div>'+

                '<textarea '+
                    'class="sceneText" '+
                    'id="text-'+s.id+'" '+
                    'onchange="changeText('+s.id+',this.value)">'+
                    escapeHTML(s.text)+
                '</textarea>'+


                '<div class="sceneLabel">'+
                    '🎨 GÖRSEL PROMPT'+
                '</div>'+

                '<textarea '+
                    'class="prompt" '+
                    'id="prompt-'+s.id+'" '+
                    'onchange="changePrompt('+s.id+',this.value)">'+
                    escapeHTML(s.prompt)+
                '</textarea>'+


                (
                    s.error

                    ?

                    '<div class="error">'+
                    escapeHTML(s.error)+
                    '</div>'

                    :

                    ''
                )+


                '<div class="sceneButtons">'+

                    '<button '+
                        'class="green" '+
                        'onclick="generateImage('+s.id+')">'+
                        '🖼️ GÖRSEL ÜRET'+
                    '</button>'+

                    '<button '+
                        'class="orange" '+
                        'onclick="copyPrompt('+s.id+')">'+
                        '📋 PROMPT KOPYALA'+
                    '</button>'+

                    '<button '+
                        'class="gray" '+
                        'onclick="newPrompt('+s.id+')">'+
                        '🔄 PROMPT YENİLE'+
                    '</button>'+

                '</div>'+

            '</div>'+

        '</div>';

    }


    container.innerHTML=html;

}


/* =====================================================
   METİN DEĞİŞTİR
===================================================== */

function changeText(id,value){

    var s=findScene(id);

    if(s){
        s.text=value;
    }

}


/* =====================================================
   PROMPT DEĞİŞTİR
===================================================== */

function changePrompt(id,value){

    var s=findScene(id);

    if(s){
        s.prompt=value;
    }

}


/* =====================================================
   SAHNE BUL
===================================================== */

function findScene(id){

    for(var i=0;i<scenes.length;i++){

        if(scenes[i].id===id){
            return scenes[i];
        }

    }

    return null;

}


/* =====================================================
   PROMPT YENİLE
===================================================== */

function newPrompt(id){

    var s=findScene(id);

    if(!s){
        return;
    }

    s.prompt=
        makePrompt(
            s.text,
            id-1,
            scenes.length
        );

    renderScenes();

    status(
        "✅ Sahne "+id+" prompt'u yenilendi.",
        true
    );

}


/* =====================================================
   PROMPT KOPYALA
===================================================== */

function copyPrompt(id){

    var s=findScene(id);

    if(!s){
        return;
    }


    var area=
        document.getElementById(
            "prompt-"+id
        );


    area.select();


    try{

        document.execCommand("copy");

        status(
            "✅ Sahne "+id+" prompt'u kopyalandı.",
            true
        );

    }
    catch(e){

        status(
            "Prompt seçildi. CTRL+C ile kopyalayabilirsin."
        );

    }

}


/* =====================================================
   GÖRSEL BOYUT
===================================================== */

function dimensions(){

    var format=
        document.getElementById("format").value;


    if(format==="9:16"){

        return {
            width:720,
            height:1280
        };

    }


    if(format==="1:1"){

        return {
            width:1024,
            height:1024
        };

    }


    return {
        width:1280,
        height:720
    };

}


/* =====================================================
   GÖRSEL URL
===================================================== */

function imageURL(prompt,seed){

    var d=dimensions();


    return (
        "https://image.pollinations.ai/prompt/" +

        encodeURIComponent(prompt) +

        "?width="+d.width+
        "&height="+d.height+
        "&seed="+seed+
        "&nologo=true"
    );

}


/* =====================================================
   GÖRSEL ÜRET
===================================================== */

function generateImage(id){

    var s=findScene(id);

    if(!s){
        return;
    }


    if(!s.prompt || s.prompt.length<20){

        s.error=
            "Prompt boş. Önce prompt oluştur.";

        renderScenes();

        return;
    }


    s.error="";

    renderScenes();


    status(
        "⏳ Sahne "+id+" görseli hazırlanıyor..."
    );


    var url=
        imageURL(
            s.prompt,
            Math.floor(Math.random()*1000000000)
        );


    var img=new Image();


    img.onload=function(){

        s.image=url;

        renderScenes();

        status(
            "✅ Sahne "+id+" görseli hazır.",
            true
        );

    };


    img.onerror=function(){

        s.error=
            "Görsel sunucusundan görüntü alınamadı. " +
            "İnternet bağlantısını veya görsel servisinin erişimini kontrol et.";

        renderScenes();

        status(
            "❌ Sahne "+id+" görseli alınamadı.",
            false
        );

    };


    img.src=url;

}


/* =====================================================
   TÜM GÖRSELLER
===================================================== */

async function generateAll(){

    if(!scenes.length){

        status(
            "❌ Önce sahneleri oluştur."
        );

        return;
    }


    var button=
        document.getElementById("allButton");


    button.disabled=true;


    for(var i=0;i<scenes.length;i++){

        var id=scenes[i].id;


        status(
            "🖼️ "+id+
            "/"+scenes.length+
            " görsel hazırlanıyor..."
        );


        await generateOneAndWait(id);

    }


    button.disabled=false;


    status(
        "🎉 Tüm görsel işlemleri tamamlandı.",
        true
    );

}


/* =====================================================
   BEKLEYEREK GÖRSEL ÜRET
===================================================== */

function generateOneAndWait(id){

    return new Promise(function(resolve){

        var s=findScene(id);

        if(!s){

            resolve();

            return;
        }


        var url=
            imageURL(
                s.prompt,
                Math.floor(
                    Math.random()*1000000000
                )
            );


        var img=new Image();


        img.onload=function(){

            s.image=url;

            renderScenes();

            resolve();

        };


        img.onerror=function(){

            s.error=
                "Bu sahnenin görseli alınamadı.";

            renderScenes();

            resolve();

        };


        img.src=url;

    });

}


/* =====================================================
   TEMİZLE
===================================================== */

function clearEverything(){

    scenes=[];

    document.getElementById("scenes").innerHTML=
        '<div class="placeholder">'+
        'Henüz sahne oluşturulmadı.'+
        '</div>';


    document.getElementById("allButton").disabled=true;


    status(
        "Temizlendi. Yeni hikâye girebilirsin."
    );

}

</script>

</body>
</html>
