<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mina Video AI V48.1 — GeldStory Studio</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#0b0d10;
  color:#eee;
  font-family:Arial,Helvetica,sans-serif;
}
header{
  position:sticky;
  top:0;
  z-index:20;
  background:#11151b;
  border-bottom:1px solid #292f38;
  padding:14px;
}
h1{margin:0 0 5px;font-size:22px}
.small{color:#9ba3ad;font-size:12px}
.container{max-width:1450px;margin:auto;padding:18px}
.panel{
  background:#12161c;
  border:1px solid #292f38;
  border-radius:14px;
  padding:16px;
  margin-bottom:16px;
}
textarea,input,select,button{font-family:inherit}
textarea,input,select{
  width:100%;
  background:#0c1015;
  color:#eee;
  border:1px solid #303743;
  border-radius:9px;
  padding:10px;
  outline:none;
}
textarea:focus,input:focus,select:focus{border-color:#777}
#story{min-height:190px;resize:vertical;line-height:1.5}
button{
  background:#242a33;
  color:#fff;
  border:1px solid #39414c;
  padding:10px 14px;
  border-radius:9px;
  cursor:pointer;
  font-weight:bold;
}
button:hover{background:#303844}
button.primary{background:#eee;color:#111}
button.danger{background:#4b2025}
button.green{background:#193b29}
button.voiceAll{
  background:#513c12;
  border-color:#8c6a20;
}
button.voiceAll:hover{background:#6a4e17}
button:disabled{
  opacity:.5;
  cursor:not-allowed;
}
.toolbar{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px;
}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.scenes{display:grid;gap:18px}
.scene{
  background:#10141a;
  border:1px solid #303743;
  border-radius:16px;
  padding:15px;
}
.scene-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}
.scene-title{font-size:18px;font-weight:bold}
.badge{
  font-size:11px;
  border:1px solid #39414c;
  padding:5px 8px;
  border-radius:20px;
  color:#b9c1ca;
}
.grid{
  display:grid;
  grid-template-columns:minmax(0,1.1fr) minmax(300px,.9fr);
  gap:16px;
}
.box{
  background:#0b0f14;
  border:1px solid #282f38;
  border-radius:12px;
  padding:12px;
  margin-bottom:12px;
}
.box-title{font-weight:bold;margin-bottom:8px;font-size:13px}
.scene-text{min-height:110px}
.prompt{min-height:190px;font-size:12px;line-height:1.4}
.negative{min-height:100px;font-size:12px}
.director{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
}
.director-item{
  background:#11161d;
  border:1px solid #252d36;
  border-radius:8px;
  padding:8px;
}
.director-item b{
  display:block;
  font-size:10px;
  color:#8f99a5;
  margin-bottom:4px;
}
.director-item span{font-size:12px;line-height:1.3}
.preview{
  width:100%;
  aspect-ratio:16/9;
  background:#050608;
  border:1px solid #303743;
  border-radius:10px;
  display:block;
  object-fit:contain;
}
.image-preview{
  width:100%;
  aspect-ratio:16/9;
  background:#050608;
  border-radius:9px;
  border:1px solid #252b33;
  object-fit:cover;
  margin-top:8px;
}
.audio{width:100%;margin-top:8px}
.range-row{
  display:grid;
  grid-template-columns:1fr 80px;
  gap:8px;
  align-items:center;
}
.status{color:#aeb7c2;font-size:12px;min-height:18px}
.tts-status{color:#bfc7d0;font-size:12px;margin-top:7px}
label{font-size:11px;color:#9ba4af;display:block;margin-bottom:5px}
.progressBox{
  display:none;
  margin-top:12px;
  background:#0b0f14;
  border:1px solid #3b3220;
  border-radius:10px;
  padding:12px;
}
.progressOuter{
  height:12px;
  background:#20252c;
  border-radius:10px;
  overflow:hidden;
}
.progressInner{
  width:0%;
  height:100%;
  background:#d3a52d;
  transition:width .2s;
}
.progressText{
  font-size:12px;
  margin-top:7px;
  color:#c9c0a5;
}
footer{
  text-align:center;
  color:#737c87;
  padding:30px;
  font-size:12px;
}
@media(max-width:900px){
  .grid{grid-template-columns:1fr}
}
@media(max-width:600px){
  .director{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
  <h1>🎬 Mina Video AI V48.1 — GeldStory Studio</h1>
  <div class="small">
    German Story → Scenes → Visual Director → WAV → Motion → WebM
  </div>
</header>

<div class="container">

<div class="panel">

  <div class="box-title">📖 HİKÂYENİ BURAYA YAPIŞTIR</div>

  <textarea id="story"
    placeholder="Almanca hikâyeni buraya yapıştır..."></textarea>

  <br><br>

  <div class="toolbar">

    <button class="primary" id="createBtn">
      ✂️ SAHNELERİ OLUŞTUR
    </button>

    <button class="voiceAll" id="voiceAllBtn">
      🎙️ TÜM SAHNELERİ SESLENDİR & KAYDET
    </button>

    <button id="addBtn">
      ➕ SAHNE EKLE
    </button>

    <button id="directorBtn">
      🧠 VISUAL DIRECTOR
    </button>

    <button id="renderBtn" class="green">
      🎬 VİDEOYU OLUŞTUR
    </button>

  </div>

  <div id="voiceProgress" class="progressBox">

    <div class="progressOuter">
      <div id="voiceProgressInner" class="progressInner"></div>
    </div>

    <div id="voiceProgressText" class="progressText">
      Hazırlanıyor...
    </div>

  </div>

  <br>

  <div id="globalStatus" class="status">
    Hazır.
  </div>

</div>


<div class="panel">

  <div class="box-title">⚙️ VİDEO AYARLARI</div>

  <div class="toolbar">

    <div>
      <label>Format</label>
      <select id="format">
        <option value="16:9">16:9 YouTube</option>
        <option value="9:16">9:16 Shorts</option>
        <option value="1:1">1:1 Kare</option>
      </select>
    </div>

    <div>
      <label>FPS</label>
      <select id="fps">
        <option value="24">24 FPS</option>
        <option value="30">30 FPS</option>
      </select>
    </div>

    <div>
      <label>Almanca Ses</label>
      <select id="voice">
        <option value="de_DE-thorsten-medium">
          Thorsten Medium
        </option>
        <option value="de_DE-thorsten-high">
          Thorsten High
        </option>
      </select>
    </div>

  </div>

</div>


<div class="panel">

  <div class="box-title">
    🎞️ SAHNELER
    <span id="sceneCount" class="badge">0 sahne</span>
  </div>

  <div id="scenes" class="scenes"></div>

</div>


<div class="panel">

  <div class="box-title">🎥 VİDEO ÖNİZLEME</div>

  <canvas id="mainCanvas"
    class="preview"
    width="1280"
    height="720"></canvas>

  <br>

  <div class="row">

    <button id="previewBtn">
      ▶️ ÖNİZLE
    </button>

    <button id="stopPreviewBtn">
      ⏹️ DURDUR
    </button>

  </div>

  <br>

  <div id="renderStatus" class="status">
    Render bekleniyor.
  </div>

</div>

</div>

<footer>
Mina Video AI V48.1 • GeldStory Studio
</footer>


<script>

/* =========================================================
   GLOBAL
========================================================= */

let scenes = [];
let sceneCounter = 1;

let ttsModule = null;
let ttsSession = null;

let previewRunning = false;
let previewStop = false;

let renderRunning = false;
let allVoiceRunning = false;


/* =========================================================
   HELPERS
========================================================= */

function $(id){
  return document.getElementById(id);
}

function status(text){
  $("globalStatus").textContent = text;
}

function ttsMessage(text){
  $("renderStatus").textContent = text;
}

function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================================================
   SPLIT SENTENCES
========================================================= */

function splitSentences(text){

  text = text
    .replace(/\r/g," ")
    .replace(/\n+/g," ")
    .replace(/\s+/g," ")
    .trim();

  if(!text) return [];

  const result = text.match(
    /[^.!?…]+[.!?…]+(?=\s|$)|[^.!?…]+$/g
  );

  return (result || [text])
    .map(x=>x.trim())
    .filter(Boolean);
}


/* =========================================================
   VISUAL DIRECTOR
========================================================= */

function safeAnalyzeScene(text){

  try{

    const clean =
      String(text || "")
      .replace(/\s+/g," ")
      .trim();

    const lower =
      clean.toLowerCase();

    let person =
      "Gerçekçi yetişkin kişi veya kişiler";

    if(
      /mutter|mama|tochter|sohn|kind|vater|familie|frau|mann/.test(lower)
    ){
      person =
        "Hikâyede anlatılan gerçekçi insan karakterleri";
    }

    let location =
      "Hikâyede anlatılan gerçekçi ortam";

    if(/wohnung|zimmer|haus|küche/.test(lower)){
      location =
        "Gerçekçi, mütevazı bir ev içi";
    }
    else if(/büro|office|firma|unternehmen|arbeit|arbeitsplatz/.test(lower)){
      location =
        "Gerçekçi bir iş yeri veya ofis";
    }
    else if(/straße|stadt|markt/.test(lower)){
      location =
        "Gerçekçi şehir ortamı";
    }
    else if(/schule|universität|college/.test(lower)){
      location =
        "Gerçekçi eğitim ortamı";
    }
    else if(/restaurant|küche/.test(lower)){
      location =
        "Gerçekçi restoran veya profesyonel mutfak";
    }

    let emotion =
      "stille Hoffnung, Entschlossenheit und authentische menschliche Emotion";

    if(
      /angst|scheitert|gescheitert|problem|schwierig|schulden|arm|kaum geld/.test(lower)
    ){
      emotion =
        "finanzielle Sorgen, Unsicherheit, Erschöpfung und stille Hoffnung";
    }

    if(
      /erfolg|gewonnen|reich|million|millionen|erfolgreich/.test(lower)
    ){
      emotion =
        "Erleichterung, Freude, Selbstvertrauen und Erfolg";
    }

    let period =
      "zeitlich glaubwürdige, historisch passende Darstellung";

    if(/1990|neunziger/.test(lower)){
      period = "1990er Jahre";
    }
    else if(/1980|achtziger/.test(lower)){
      period = "1980er Jahre";
    }
    else if(/1970|siebziger/.test(lower)){
      period = "1970er Jahre";
    }
    else if(/1960|sechziger/.test(lower)){
      period = "1960er Jahre";
    }

    let action =
      "natürliches Verhalten passend zur Erzählung";

    if(/schrieb|schreiben|buch|geschichte/.test(lower)){
      action =
        "Eine Person schreibt konzentriert an einer Geschichte oder einem Manuskript";
    }
    else if(/arbeit|arbeiten|job|arbeitete/.test(lower)){
      action =
        "Eine Person arbeitet konzentriert in einer realistischen Umgebung";
    }
    else if(/ging|gingen|läuft|laufen/.test(lower)){
      action =
        "Die Person bewegt sich natürlich durch die Umgebung";
    }

    return {
      person,
      location,
      emotion,
      period,
      action,
      camera:
        "cinematic medium-wide documentary shot, eye-level camera",
      lens:
        "35mm cinematic lens, natural perspective, realistic depth",
      lighting:
        "soft natural cinematic lighting with subtle practical light",
      composition:
        "strong foreground subject, visible environment, balanced cinematic composition",
      atmosphere:
        "authentic documentary atmosphere, subtle film grain, realistic depth"
    };

  }catch(error){

    return {
      person:"realistische Person oder Personen",
      location:"realistische Umgebung",
      emotion:"authentische menschliche Emotion",
      period:"zeitlich glaubwürdige Darstellung",
      action:"natürliche Handlung",
      camera:"cinematic documentary shot",
      lens:"35mm lens",
      lighting:"natural cinematic lighting",
      composition:"strong storytelling composition",
      atmosphere:"realistic documentary atmosphere"
    };

  }

}


/* =========================================================
   IMAGE PROMPT
========================================================= */

function createImagePrompt(text,index){

  const clean =
    String(text || "")
    .replace(/\s+/g," ")
    .trim();

  const d =
    safeAnalyzeScene(clean);

  return `
CINEMATIC DOCUMENTARY MASTER PROMPT

Create a photorealistic cinematic documentary scene for a German real-life success story.

STORY MOMENT:
"${clean}"

VISUAL DIRECTOR ANALYSIS:

PERSON:
${d.person}

LOCATION:
${d.location}

PERIOD:
${d.period}

EMOTION:
${d.emotion}

ACTION:
${d.action}

CAMERA:
${d.camera}

LENS:
${d.lens}

LIGHTING:
${d.lighting}

COMPOSITION:
${d.composition}

ATMOSPHERE:
${d.atmosphere}

VISUAL QUALITY:

photorealistic human appearance,
natural facial expressions,
realistic skin texture,
realistic hands,
realistic clothing,
physically believable environment,
authentic architecture,
natural body proportions,
cinematic depth of field,
professional documentary photography,
subtle film grain,
realistic shadows,
natural contrast,
high dynamic range,
cinematic storytelling,
emotionally powerful but not exaggerated,
historically believable details,
premium documentary film still,
professional cinematography,
high detail,
sharp subject,
soft background separation,
natural color reproduction,
16:9 cinematic composition.

IMPORTANT:
The image must visualize the exact moment described in the story.
Do not create a generic stock photo.
The people, environment and emotion must visually match the narration.

NO TEXT.
NO SUBTITLES.
NO CAPTIONS.
NO LOGOS.
NO WATERMARK.
`.trim();

}


/* =========================================================
   NEGATIVE PROMPT
========================================================= */

function createNegativePrompt(){

  return `
text, subtitles, captions, letters, typography,
logo, watermark, signature,
blurry face, deformed face,
bad anatomy, extra fingers,
missing fingers, malformed hands,
extra limbs, duplicate people,
duplicate objects,
unnatural eyes,
plastic skin,
cartoon, anime,
3d render, CGI,
oversaturated colors,
unrealistic lighting,
low resolution,
pixelated,
compression artifacts,
generic stock photo,
distorted background,
floating objects,
bad perspective
`.trim();

}


/* =========================================================
   CREATE SCENES
========================================================= */

function createScenes(){

  const text =
    $("story").value.trim();

  if(!text){
    alert("Önce hikâyeyi gir.");
    return;
  }

  const sentences =
    splitSentences(text);

  if(!sentences.length){
    alert("Cümle bulunamadı.");
    return;
  }

  scenes = [];
  sceneCounter = 1;

  for(
    let i=0;
    i<sentences.length;
    i+=2
  ){

    let textPart =
      sentences[i];

    if(sentences[i+1]){
      textPart +=
        " " +
        sentences[i+1];
    }

    let scene = {

      id:sceneCounter++,

      text:textPart,

      subtitle:textPart,

      subtitleEnabled:false,

      prompt:"",

      negativePrompt:"",

      analysis:null,

      image:null,

      imageURL:null,

      imageObject:null,

      audio:null,

      audioURL:null,

      duration:4,

      motion:"zoomIn",

      ttsState:"Hazır"

    };

    try{

      scene.analysis =
        safeAnalyzeScene(
          textPart
        );

      scene.prompt =
        createImagePrompt(
          textPart,
          scenes.length
        );

      scene.negativePrompt =
        createNegativePrompt();

    }catch(error){

      scene.analysis =
        safeAnalyzeScene("");

      scene.prompt =
        "Cinematic realistic documentary scene: " +
        textPart;

      scene.negativePrompt =
        createNegativePrompt();

    }

    scenes.push(scene);

  }

  renderScenes();

  status(
    "✅ " +
    scenes.length +
    " sahne oluşturuldu."
  );

}


/* =========================================================
   ADD SCENE
========================================================= */

function addScene(){

  scenes.push({

    id:sceneCounter++,

    text:"",

    subtitle:"",

    subtitleEnabled:false,

    prompt:"",

    negativePrompt:
      createNegativePrompt(),

    analysis:
      safeAnalyzeScene(""),

    image:null,

    imageURL:null,

    imageObject:null,

    audio:null,

    audioURL:null,

    duration:4,

    motion:"zoomIn",

    ttsState:"Hazır"

  });

  renderScenes();

}


/* =========================================================
   RENDER SCENES
========================================================= */

function renderScenes(){

  const container =
    $("scenes");

  $("sceneCount").textContent =
    scenes.length +
    " sahne";

  container.innerHTML = "";

  scenes.forEach(
    (scene,index)=>{

      if(!scene.analysis){
        scene.analysis =
          safeAnalyzeScene(
            scene.text
          );
      }

      if(!scene.prompt){
        scene.prompt =
          createImagePrompt(
            scene.text,
            index
          );
      }

      if(!scene.negativePrompt){
        scene.negativePrompt =
          createNegativePrompt();
      }

      const a =
        scene.analysis;

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "scene";

      div.innerHTML = `

      <div class="scene-head">

        <div class="scene-title">
          🎬 Sahne ${index+1}
        </div>

        <div class="row">

          <span class="badge">
            ${escapeHTML(scene.ttsState)}
          </span>

          <span class="badge">
            ${Number(scene.duration||4).toFixed(2)} sn
          </span>

        </div>

      </div>


      <div class="grid">

      <div>

        <div class="box">

          <div class="box-title">
            📝 SAHNE METNİ
          </div>

          <textarea
            class="scene-text"
            data-text="${index}"
          >${escapeHTML(scene.text)}</textarea>

        </div>


        <div class="box">

          <div class="box-title">
            🧠 VISUAL DIRECTOR
          </div>

          <div class="director">

            <div class="director-item">
              <b>👤 KİŞİ</b>
              <span>${escapeHTML(a.person)}</span>
            </div>

            <div class="director-item">
              <b>📍 MEKÂN</b>
              <span>${escapeHTML(a.location)}</span>
            </div>

            <div class="director-item">
              <b>📅 DÖNEM</b>
              <span>${escapeHTML(a.period)}</span>
            </div>

            <div class="director-item">
              <b>❤️ DUYGU</b>
              <span>${escapeHTML(a.emotion)}</span>
            </div>

            <div class="director-item">
              <b>🎬 EYLEM</b>
              <span>${escapeHTML(a.action)}</span>
            </div>

            <div class="director-item">
              <b>📷 KAMERA</b>
              <span>${escapeHTML(a.camera)}</span>
            </div>

            <div class="director-item">
              <b>🔭 LENS</b>
              <span>${escapeHTML(a.lens)}</span>
            </div>

            <div class="director-item">
              <b>💡 IŞIK</b>
              <span>${escapeHTML(a.lighting)}</span>
            </div>

            <div class="director-item">
              <b>🖼️ KOMPOZİSYON</b>
              <span>${escapeHTML(a.composition)}</span>
            </div>

            <div class="director-item">
              <b>🌫️ ATMOSFER</b>
              <span>${escapeHTML(a.atmosphere)}</span>
            </div>

          </div>

          <br>

          <button
            class="directorRefresh"
            data-index="${index}">
            🧠 ANALİZİ YENİLE
          </button>

        </div>


        <div class="box">

          <div class="box-title">
            🎨 PROFESYONEL GÖRSEL PROMPT
          </div>

          <textarea
            class="prompt"
            data-prompt="${index}"
          >${escapeHTML(scene.prompt)}</textarea>

          <br><br>

          <div class="row">

            <button
              class="copyPrompt"
              data-index="${index}">
              📋 PROMPT KOPYALA
            </button>

            <button
              class="regeneratePrompt"
              data-index="${index}">
              🔄 PROMPT YENİLE
            </button>

          </div>

        </div>


        <div class="box">

          <div class="box-title">
            🚫 NEGATIVE PROMPT
          </div>

          <textarea
            class="negativePrompt"
            data-negative="${index}"
          >${escapeHTML(scene.negativePrompt)}</textarea>

        </div>


        <div class="box">

          <div class="box-title">
            🖼️ GÖRSEL
          </div>

          <input
            type="file"
            accept="image/*"
            class="imageInput"
            data-index="${index}"
          >

          ${
            scene.imageURL
            ?
            `
            <img
              class="image-preview"
              src="${scene.imageURL}"
            >

            <br>

            <button
              class="removeImage"
              data-index="${index}">
              🗑️ GÖRSELİ KALDIR
            </button>
            `
            :
            `
            <div class="small">
              Bu sahne için kendi görselini yükleyebilirsin.
            </div>
            `
          }

        </div>


        <div class="box">

          <div class="box-title">
            🎙️ SESLENDİRME
          </div>

          <button
            class="ttsButton"
            data-index="${index}">
            🎙️ SESLENDİR VE KAYDET
          </button>

          ${
            scene.audioURL
            ?
            `
            <audio
              class="audio"
              controls
              src="${scene.audioURL}">
            </audio>

            <br>

            <a
              href="${scene.audioURL}"
              download="GeldStory_Sahne_${index+1}.wav">

              <button>
                💾 WAV İNDİR
              </button>

            </a>
            `
            :
            ""
          }

          <div class="tts-status">
            ${escapeHTML(scene.ttsState)}
          </div>

        </div>


        <div class="box">

          <div class="box-title">
            💬 ALTYAZI
          </div>

          <button
            class="subtitleButton"
            data-index="${index}">

            ${
              scene.subtitleEnabled
              ?

  .forEach(el=>{

    el.addEventListener(
      "input",
      function(){

        if(
          this.dataset.text !== undefined
        ){

          const i =
            Number(this.dataset.text);

          scenes[i].text =
            this.value;

          scenes[i].subtitle =
            this.value;

        }

      }
    );

  });


  document.querySelectorAll("[data-prompt]")
  .forEach(el=>{

    el.addEventListener(
      "input",
      function(){

        const i =
          Number(
            this.dataset.prompt
          );

        scenes[i].prompt =
          this.value;

      }
    );

  });


  document.querySelectorAll("[data-subtitle]")
  .forEach(el=>{

    el.addEventListener(
      "input",
      function(){

        const i =
          Number(
            this.dataset.subtitle
          );

        scenes[i].subtitle =
          this.value;

      }
    );

  });


  document.querySelectorAll("[data-negative]")
  .forEach(el=>{

    el.addEventListener(
      "input",
      function(){

        const i =
          Number(
            this.dataset.negative
          );

        scenes[i].negativePrompt =
          this.value;

      }
    );

  });


  document.querySelectorAll(".directorRefresh")
  .forEach(btn=>{

    btn.onclick = ()=>{

      const i =
        Number(btn.dataset.index);

      scenes[i].analysis =
        safeAnalyzeScene(
          scenes[i].text
        );

      scenes[i].prompt =
        createImagePrompt(
          scenes[i].text,

        );

        createNegativePrompt();

      renderScenes();

    };

  });


  document.querySelectorAll(".copyPrompt")
  .forEach(btn=>{

    btn.onclick = ()=>{

      const i =
        Number(btn.dataset.index);

      copyText(
        scenes[i].prompt
      );

    };

  });


  document.querySelectorAll(".regeneratePrompt")
  .forEach(btn=>{

    btn.onclick = ()=>{

      const i =
        Number(btn.dataset.index);

      scenes[i].analysis =
        safeAnalyzeScene(
          scenes[i].text
        );

      scenes[i].prompt =
        createImagePrompt(
          scenes[i].text,
          i
        );

      scenes[i].negativePrompt =
        createNegativePrompt();

      renderScenes();

    };

  });


  document.querySelectorAll(".ttsButton")
  .forEach(btn=>{

    btn.onclick = ()=>{

      generateSceneVoice(
        Number(btn.dataset.index)
      );

    };

  });


  document.querySelectorAll(".subtitleButton")
  .forEach(btn=>{

    btn.onclick = ()=>{

      const i =
        Number(btn.dataset.index);

      scenes[i].subtitleEnabled =
        !scenes[i].subtitleEnabled;

      renderScenes();

    };

  });


  document.querySelectorAll(".motionSelect")
  .forEach(el=>{

    el.onchange = ()=>{

      const i =
        Number(el.dataset.index);

      scenes[i].motion =
        el.value;

      drawScene(
        scenes[i],
        document.querySelector(
          `[data-canvas="${i}"]`
        ),
        0
      );

    };

  });


  document.querySelectorAll(".durationRange")
  .forEach(el=>{

    el.oninput = ()=>{

      const i =
        Number(el.dataset.index);

      scenes[i].duration =
        Number(el.value);

      const n =
        document.querySelector(
          `.durationNumber[data-index="${i}"]`
        );

      if(n){
        n.value =
          el.value;
      }

    };

  });


  document.querySelectorAll(".durationNumber")
  .forEach(el=>{

    el.oninput = ()=>{

      const i =
        Number(el.dataset.index);

      let value =
        Math.max(
          1,
          Math.min(
            60,
            Number(el.value) || 1
          )
        );

      scenes[i].duration =
        value;

      const r =
        document.querySelector(
          `.durationRange[data-index="${i}"]`
        );

      if(r){
        r.value =
          value;
      }

    };

  });


  document.querySelectorAll(".imageInput")
  .forEach(input=>{

    input.onchange =
      event=>{

        const i =
          Number(
            input.dataset.index
          );

        const file =
          event.target.files[0];

        if(!file) return;

        if(scenes[i].imageURL){

          try{
            URL.revokeObjectURL(
              scenes[i].imageURL
            );
          }catch(e){}

        }

        scenes[i].image =
          file;

        scenes[i].imageURL =
          URL.createObjectURL(
            file
          );

        scenes[i].imageObject =
          null;

        renderScenes();

        loadSceneImage(
          scenes[i],
          i
        );

      };

  });


  document.querySelectorAll(".removeImage")
  .forEach(btn=>{

    btn.onclick = ()=>{

      const i =
        Number(btn.dataset.index);

      if(scenes[i].imageURL){

        try{
          URL.revokeObjectURL(
            scenes[i].imageURL
          );
        }catch(e){}

      }

      scenes[i].image =
        null;

      scenes[i].imageURL =
        null;

      scenes[i].imageObject =
        null;

      renderScenes();

    };

  });


  document.querySelectorAll(".duplicateScene")
  .forEach(btn=>{

    btn.onclick = ()=>{

      const i =
        Number(btn.dataset.index);

      const original =
        scenes[i];

      const copy = {

        ...original,

        id:
          sceneCounter++,

        image:
          original.image,

        imageURL:
          original.imageURL,

        imageObject:
          original.imageObject,

        audio:
          original.audio,

        audioURL:
          original.audioURL

      };

      scenes.splice(
        i+1,
        0,
        copy
      );

      renderScenes();

    };

  });


  document.querySelectorAll(".deleteScene")
  .forEach(btn=>{

    btn.onclick = ()=>{

      const i =
        Number(btn.dataset.index);

      if(!confirm(
        "Bu sahneyi silmek istiyor musun?"
      )){
        return;
      }

      scenes.splice(
        i,
        1
      );

      renderScenes();

    };

  });


  document.querySelectorAll(".scenePreview")
  .forEach(btn=>{

    btn.onclick = ()=>{

      previewSingleScene(
        Number(btn.dataset.index)
      );

    };

  });

}

/* =========================================================
   IMAGE LOAD
========================================================= */

function loadSceneImage(
  scene,
  index
){

  if(!scene.imageURL)
    return;

  const img =
    new Image();

  img.onload = ()=>{

    scene.imageObject =
      img;

    const canvas =
      document.querySelector(
        `[data-canvas="${index}"]`
      );

    if(canvas){

      drawScene(
        scene,
        canvas,
        0
      );

    }

  };

  img.src =
    scene.imageURL;

}


/* =========================================================
   CANVAS SIZE
========================================================= */

function getCanvasSize(){

  const format =
    $("format").value;

  if(format === "9:16"){

    return {
      width:720,
      height:1280
    };

  }

  if(format === "1:1"){

    return {
      width:1080,
      height:1080
    };

  }

  return {
    width:1280,
    height:720
  };

}


/* =========================================================
   DRAW COVER
========================================================= */

function drawCover(
  ctx,
  img,
  canvas,
  progress,
  motion
){

  const cw =
    canvas.width;

  const ch =
    canvas.height;

  const iw =
    img.width;

  const ih =
    img.height;

  const scale =
    Math.max(
      cw/iw,
      ch/ih
    );

  const baseW =
    iw * scale;

  const baseH =
    ih * scale;

  let zoom = 1;

  if(motion === "zoomIn"){
    zoom =
      1 + progress*.10;
  }
  else if(motion === "zoomOut"){
    zoom =
      1.10-progress*.10;
  }
  else if(motion === "kenBurns"){
    zoom =
      1.04+progress*.08;
  }

  const w =
    baseW*zoom;

  const h =
    baseH*zoom;

  let x =
    (cw-w)/2;

  let y =
    (ch-h)/2;

  if(motion === "panLeft"){
    x =
      (cw-w)*progress;
  }

  if(motion === "panRight"){
    x =
      (cw-w)*(1-progress);
  }

  if(motion === "panUp"){
    y =
      (ch-h)*progress;
  }

  if(motion === "panDown"){
    y =
      (ch-h)*(1-progress);
  }

  ctx.drawImage(
    img,
    x,
    y,
    w,
    h
  );

}


/* =========================================================
   DRAW SCENE
========================================================= */

function drawScene(
  scene,
  canvas,
  progress
){

  if(!canvas)
    return;

  const size =
    getCanvasSize();

  if(
    canvas.width !== size.width ||
    canvas.height !== size.height
  ){

    canvas.width =
      size.width;

    canvas.height =
      size.height;

  }

  const ctx =
    canvas.getContext("2d");

  const w =
    canvas.width;

  const h =
    canvas.height;

  ctx.clearRect(
    0,
    0,
    w,
    h
  );

  ctx.fillStyle =
    "#050608";

  ctx.fillRect(
    0,
    0,
    w,
    h
  );


  if(scene.imageObject){

    drawCover(
      ctx,
      scene.imageObject,
      canvas,
      progress,
      scene.motion
    );

  }else{

    const gradient =
      ctx.createLinearGradient(
        0,
        0,
        w,
        h
      );

    gradient.addColorStop(
      0,
      "#171b22"
    );

    gradient.addColorStop(
      1,
      "#050608"
    );

    ctx.fillStyle =
      gradient;

    ctx.fillRect(
      0,
      0,
      w,
      h
    );

    ctx.fillStyle =
      "rgba(255,255,255,.75)";

    ctx.font =
      Math.max(
        18,
        w/55
      ) +
      "px Arial";

    ctx.textAlign =
      "center";

    ctx.fillText(
      "Görsel yüklenmedi",
      w/2,
      h/2
    );

  }


  const overlay =
    ctx.createLinearGradient(
      0,
      0,
      0,
      h
    );

  overlay.addColorStop(
    0,
    "rgba(0,0,0,.08)"
  );

  overlay.addColorStop(
    .65,
    "rgba(0,0,0,.12)"
  );

  overlay.addColorStop(
    1,
    "rgba(0,0,0,.58)"
  );

  ctx.fillStyle =
    overlay;

  ctx.fillRect(
    0,
    0,
    w,
    h
  );


  if(
    scene.subtitleEnabled &&
    scene.subtitle
  ){

    const fontSize =
      Math.max(
        22,
        Math.round(w/42)
      );

    ctx.font =
      "bold " +
      fontSize +
      "px Arial";

    ctx.textAlign =
      "center";

    const maxWidth =
      w*.84;

    const words =
      scene.subtitle.split(/\s+/);

    let lines = [];
    let line = "";

    words.forEach(word=>{

      const test =
        line
        ? line+" "+word
        : word;

      if(
        ctx.measureText(test).width >
        maxWidth
      ){

        lines.push(line);
        line = word;

      }else{

        line = test;

      }

    });

    if(line)
      lines.push(line);

    const lineHeight =
      fontSize*1.25;

    const total =
      lines.length*
      lineHeight;

    let y =
      h-total-h*.08;

    ctx.textBaseline =
      "top";

    lines.forEach(text=>{

      ctx.lineWidth =
        Math.max(
          4,
          fontSize/5
        );

      ctx.strokeStyle =
        "rgba(0,0,0,.9)";

      ctx.strokeText(
        text,
        w/2,
        y
      );

      ctx.fillStyle =
        "#fff";

      ctx.fillText(
        text,
        w/2,
        y
      );

      y +=
        lineHeight;

    });

  }


  ctx.textAlign =
    "right";

  ctx.textBaseline =
    "bottom";

  ctx.font =
    "bold " +
    Math.max(
      16,
      w/70
    ) +
    "px Arial";

  ctx.fillStyle =
    "rgba(255,255,255,.82)";

  ctx.fillText(
    "GeldStory",
    w-25,
    h-20
  );

}


/* =========================================================
   AUDIO DURATION
========================================================= */

function getAudioDuration(url){

  return new Promise(resolve=>{

    const audio =
      new Audio();

    audio.preload =
      "metadata";

    audio.onloadedmetadata =
      ()=>{

        const d =
          Number(
            audio.duration
          );

        resolve(
          isFinite(d)
          ? d
          : 0
        );

      };

    audio.onerror =
      ()=>resolve(0);

    audio.src =
      url;

  });

}


/* =========================================================
   LOAD TTS
========================================================= */

async function loadTTS(){

  if(ttsModule)
    return ttsModule;

  ttsMessage(
    "⏳ Piper TTS yükleniyor..."
  );

  try{

    ttsModule =
      await import(
        "https://cdn.jsdelivr.net/npm/@realtimex/piper-tts-web@1.1.1/+esm"
      );

    ttsMessage(
      "✅ Piper TTS hazır."
    );

    return ttsModule;

  }catch(error){

    console.error(error);

    ttsMessage(
      "❌ Piper TTS yüklenemedi: " +
      error.message
    );

    throw error;

  }

}

   GET VOICE
========================================================= */

function getVoice(){

  return $("voice").value;

}


/* =========================================================
   SINGLE SCENE VOICE
========================================================= */

async function generateSceneVoice(
  index
){

  const scene =
    scenes[index];

  if(!scene.text.trim()){

    alert(
      "Sahne metni boş."
    );

    return false;

  }

  scene.ttsState =
    "⏳ Ses oluşturuluyor...";

  renderScenes();

  try{

    const tts =
      await loadTTS();

    const voice =
      getVoice();

    ttsMessage(
      "🎙️ Sahne " +
      (index+1) +
      " seslendiriliyor..."
    );


    if(tts.TtsSession){

      if(
        !ttsSession ||
        ttsSession.voiceId !== voice
      ){

        ttsSession =
          new tts.TtsSession({

            voiceId:voice,

            allowLocalModels:true,

            fallbackStrategy:"auto",

            progress:p=>{

              if(
                p &&
                p.total
              ){

                const percent =
                  Math.round(
                    p.loaded*100/p.total
                  );

                ttsMessage(
                  "🎙️ Model yükleniyor: " +
                  percent +
                  "%"
                );

              }

            },

            logger:message=>{
              console.log(
                "Piper:",
                message
              );
            }

          });

        ttsSession.voiceId =
          voice;

      }


      const wav =
        await ttsSession.predict(
          scene.text.trim()
        );

      scene.audio =
        wav;

      scene.audioURL =
        URL.createObjectURL(
          wav
        );

    }else{

      const wav =
        await tts.predict({
          text:
            scene.text.trim(),
          voiceId:
            voice
        });

      scene.audio =
        wav;

      scene.audioURL =
        URL.createObjectURL(
          wav
        );

    }


    const duration =
      await getAudioDuration(
        scene.audioURL
      );

    if(duration > 0){

      scene.duration =
        duration;

    }


    scene.ttsState =
      "✅ WAV hazır — " +
      scene.duration.toFixed(2) +
      " sn";

    renderScenes();

    return true;

  }catch(error){

    console.error(error);

    scene.ttsState =
      "❌ Hata: " +
      error.message;

    renderScenes();

    return false;

  }

}


/* =========================================================
   ⭐ YENİ:
   TÜM SAHNELERİ SIRAYLA SESLENDİR
========================================================= */

async function generateAllSceneVoices(){

  if(allVoiceRunning){

    alert(
      "Toplu seslendirme zaten çalışıyor."
    );

    return;

  }

  if(!scenes.length){

    alert(
      "Önce sahneleri oluştur."
    );

    return;

  }


  /*
    Seslendirmeye başlamadan önce
    metin kontrolü.
  */

  const emptyScenes =
    scenes.filter(
      scene =>
        !scene.text ||
        !scene.text.trim()
    );

  if(emptyScenes.length){

    alert(
      "Boş sahneler var. Önce boş sahneleri doldur."
    );

    return;

  }


  allVoiceRunning =
    true;

  $("voiceAllBtn").disabled =
    true;

  $("createBtn").disabled =
    true;

  $("addBtn").disabled =
    true;

  $("directorBtn").disabled =
    true;

  $("renderBtn").disabled =
    true;

  $("voiceProgress").style.display =
    "block";


  try{

    /*
      TTS motorunu bir kez yükle.
      Böylece her sahnede tekrar yüklenmez.
    */

    await loadTTS();


    for(
      let i=0;
      i<scenes.length;
      i++
    ){

      if(!allVoiceRunning)
        break;


      const percent =
        Math.round(
          (i /
           scenes.length) *
          100
        );

      $("voiceProgressInner").style.width =
        percent + "%";

      $("voiceProgressText").textContent =
        "🎙️ Sahne " +
        (i+1) +
        " / " +
        scenes.length +
        " seslendiriliyor...";


      status(
        "🎙️ Toplu seslendirme: Sahne " +
        (i+1) +
        "/" +
        scenes.length
      );


      /*
        SAHNE 1 BİTMEDEN
        SAHNE 2 BAŞLAMAZ.
      */

      await generateSceneVoice(i);


      /*
        Render ekranını güncelle.
      */

      $("voiceProgressInner").style.width =
        Math.round(
          ((i+1) /
           scenes.length) *
          100
        ) + "%";


      /*
        Çok kısa bekleme:
        tarayıcının UI'ı güncellemesine izin verir.
      */

      await new Promise(
        resolve =>
          setTimeout(
            resolve,
            100
          )
      );

    }


    $("voiceProgressInner").style.width =
      "100%";

    $("voiceProgressText").textContent =
      "✅ TÜM SAHNELERİN SESLENDİRMESİ TAMAMLANDI";


    status(
      "✅ " +
      scenes.length +
      " sahnenin tamamı WAV olarak kaydedildi."
    );

    ttsMessage(
      "🎉 Tüm sahnelerin sesleri hazır."
    );


  }catch(error){

    console.error(error);

    $("voiceProgressText").textContent =
      "❌ Toplu seslendirme hatası: " +
      error.message;

    status(
      "❌ Toplu seslendirme sırasında hata oluştu."
    );

  }finally{

    allVoiceRunning =
      false;

    $("voiceAllBtn").disabled =
      false;

    $("createBtn").disabled =
      false;

    $("addBtn").disabled =
      false;

    $("directorBtn").disabled =
      false;

    $("renderBtn").disabled =
      false;

    renderScenes();

  }

}

/* =========================================================
   SINGLE SCENE PREVIEW
========================================================= */

async function previewSingleScene(
  index
){

  const scene =
    scenes[index];

  const canvas =
    document.querySelector(
      `[data-canvas="${index}"]`
    );

  if(!canvas)
    return;

  previewRunning =
    true;

  previewStop =
    false;

  const start =
    performance.now();

  const duration =
    Math.max(
      1,
      Number(
        scene.duration || 4
      )
    )*1000;


  function frame(now){

    if(
      !previewRunning ||
      previewStop
    ){

      previewRunning =
        false;

      return;

    }

    const progress =
      Math.min(
        1,
        (now-start)/duration
      );

    drawScene(
      scene,
      canvas,
      progress
    );

    if(progress < 1){

      requestAnimationFrame(
        frame
      );

    }else{

      previewRunning =
        false;

    }

  }

  requestAnimationFrame(
    frame
  );

}


/* =========================================================
   ALL PREVIEW
========================================================= */

async function previewAll(){

  if(!scenes.length){

    alert(
      "Önce sahne oluştur."
    );

    return;

  }

  previewRunning =
    true;

  previewStop =
    false;

  const canvas =
    $("mainCanvas");

  const size =
    getCanvasSize();

  canvas.width =
    size.width;

  canvas.height =
    size.height;


  for(
    let i=0;
    i<scenes.length;
    i++
  ){

    if(
      !previewRunning ||
      previewStop
    )
      break;

    const scene =
      scenes[i];

    const start =
      performance.now();

    const duration =
      Math.max(
        1,
        Number(
          scene.duration || 4
        )
      )*1000;


    await new Promise(
      resolve=>{

        function frame(now){

          if(
            !previewRunning ||
            previewStop
          ){

            resolve();
            return;

          }

          const progress =
            Math.min(
              1,
              (now-start)/duration
            );

          drawScene(
            scene,
            canvas,
            progress
          );

          if(progress < 1){

            requestAnimationFrame(
              frame
            );

          }else{

            resolve();

          }

        }

        requestAnimationFrame(
          frame
        );

      }
    );

  }

  previewRunning =
    false;

}


/* =========================================================
   RENDER VIDEO
========================================================= */

async function renderVideo(){

  if(renderRunning){

    alert(
      "Render zaten çalışıyor."
    );

    return;

  }

  if(!scenes.length){

    alert(
      "Önce sahneleri oluştur."
    );

    return;

  }

  renderRunning =
    true;

  try{

    const canvas =
      $("mainCanvas");

    const size =
      getCanvasSize();

    canvas.width =
      size.width;

    canvas.height =
      size.height;

    const fps =
      Number(
        $("fps").value
      );


    const stream =
      canvas.captureStream(
        fps
      );


    let audioContext =
      null;

    let destination =
      null;

    try{

      audioContext =
        new(
          window.AudioContext ||
          window.webkitAudioContext
        )();

      destination =
        audioContext
        .createMediaStreamDestination();

      destination
        .stream
        .getAudioTracks()
        .forEach(
          track =>
            stream.addTrack(
              track
            )
        );

    }catch(error){

      console.warn(
        error
      );

    }


    let mime = "";

    if(
      MediaRecorder.isTypeSupported(
        "video/webm;codecs=vp9,opus"
      )
    ){

      mime =
        "video/webm;codecs=vp9,opus";

    }
    else if(
      MediaRecorder.isTypeSupported(
        "video/webm;codecs=vp8,opus"
      )
    ){

      mime =
        "video/webm;codecs=vp8,opus";

    }
    else{

      mime =
        "video/webm";

    }


    const chunks = [];

    const recorder =
      new MediaRecorder(
        stream,
        {
          mimeType:mime
        }
      );


    recorder.ondataavailable =
      e=>{

        if(
          e.data &&
          e.data.size
        ){

          chunks.push(
            e.data
          );

        }

      };


    const stopped =
      new Promise(
        resolve=>{

          recorder.onstop =
            resolve;

        }
      );


    recorder.start(250);


    ttsMessage(
      "🎬 Render başlıyor..."
    );


    for(
      let i=0;
      i<scenes.length;
      i++
    ){

      const scene =
        scenes[i];

      const duration =
        Math.max(
          1,
          Number(
            scene.duration || 4
          )
        );

      ttsMessage(
        "🎬 Render: Sahne " +
        (i+1) +
        "/" +
        scenes.length
      );


      let audioElement =
        null;

      let sourceNode =
        null;


      if(
        scene.audioURL &&
        destination &&
        audioContext
      ){

        try{

          audioElement =
            new Audio(
              scene.audioURL
            );

          audioElement.preload =
            "auto";

          sourceNode =
            audioContext
            .createMediaElementSource(
              audioElement
            );

          sourceNode.connect(
            destination
          );

          sourceNode.connect(
            audioContext.destination
          );

          await audioElement.play();

        }catch(error){

          console.warn(
            "Ses oynatma hatası:",
            error
          );

        }

      }


      const start =
        performance.now();


      await new Promise(
        resolve=>{

          function frame(now){

            const elapsed =
              (now-start)/1000;

            const progress =
              Math.min(
                1,
                elapsed/duration
              );

            drawScene(
              scene,
              canvas,
              progress
            );

            if(elapsed < duration){

              requestAnimationFrame(
                frame
              );

            }else{

              resolve();

            }

          }

          requestAnimationFrame(
            frame
          );

        }
      );


      if(audioElement){

        try{
          audioElement.pause();
        }catch(e){}

      }

      if(sourceNode){

        try{
          sourceNode.disconnect();
        }catch(e){}

      }

    }


    recorder.stop();

    await stopped;


    if(audioContext){

      try{
        await audioContext.close();
      }catch(e){}

    }


    const blob =
      new Blob(
        chunks,
        {
          type:
            mime ||
            "video/webm"
        }
      );


    const url =
      URL.createObjectURL(
        blob
      );


    ttsMessage(
      "✅ Video hazır — " +
      (blob.size/1024/1024).toFixed(2) +
      " MB"
    );


    const old =
      document.getElementById(
        "downloadVideo"
      );

    if(old)
      old.remove();


    const box =
      document.createElement(
        "div"
      );

    box.id =
      "downloadVideo";

    box.className =
      "box";

    box.innerHTML = `

      <div class="box-title">
        🎉 VİDEO HAZIR
      </div>

      <video
        controls
        style="width:100%;border-radius:10px"
        src="${url}">
      </video>

      <br><br>

      <a
        href="${url}"
        download="GeldStory_V48.1.webm">

        <button class="green">
          💾 WEBM VİDEOYU İNDİR
        </button>

      </a>

    `;


    $("renderStatus")
      .parentElement
      .appendChild(
        box
      );


  }catch(error){

    console.error(error);

    ttsMessage(
      "❌ Render hatası: " +
      error.message
    );

  }finally{

    renderRunning =
      false;

  }

}
