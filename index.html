<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mina Video AI V45.1 — GeldStory Studio</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#0b0f14;
  color:#eef2f7;
  font-family:Arial,Helvetica,sans-serif;
}
header{
  padding:18px;
  background:#111823;
  border-bottom:1px solid #263242;
  position:sticky;
  top:0;
  z-index:10;
}
h1{margin:0;font-size:23px}
h2{font-size:18px;margin:0 0 12px}
h3{font-size:16px;margin:0 0 10px}
.container{
  max-width:1250px;
  margin:auto;
  padding:18px;
}
.card{
  background:#111823;
  border:1px solid #263242;
  border-radius:14px;
  padding:16px;
  margin-bottom:16px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}
.grid2{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}
label{
  display:block;
  font-size:13px;
  color:#aeb9c8;
  margin-bottom:5px;
}
input,textarea,select{
  width:100%;
  background:#0a0e14;
  border:1px solid #334154;
  color:#fff;
  border-radius:9px;
  padding:10px;
  outline:none;
}
textarea{
  min-height:105px;
  resize:vertical;
}
input:focus,textarea:focus,select:focus{
  border-color:#7287a5;
}
button{
  border:0;
  border-radius:9px;
  padding:10px 13px;
  background:#253449;
  color:#fff;
  cursor:pointer;
  font-weight:bold;
  margin:3px;
}
button:hover{background:#344963}
button.primary{background:#315b8a}
button.success{background:#246b4c}
button.danger{background:#7b3030}
button.gold{background:#735b25}
button.small{
  padding:7px 9px;
  font-size:12px;
}
.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  align-items:center;
}
.status{
  margin-top:10px;
  padding:10px;
  border-radius:9px;
  background:#0a0e14;
  color:#b9c7d8;
  font-size:13px;
}
.stats{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:10px;
}
.stat{
  background:#0a0e14;
  border:1px solid #263242;
  padding:8px 12px;
  border-radius:8px;
  font-size:12px;
}
.scene{
  border:1px solid #2d3949;
  border-radius:14px;
  padding:14px;
  margin-top:14px;
  background:#0e141d;
}
.scene.selected{
  border-color:#668fbd;
  box-shadow:0 0 0 1px #668fbd inset;
}
.scene-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
}
.scene-number{
  font-weight:bold;
  color:#b9d8ff;
}
.scene-actions{
  display:flex;
  flex-wrap:wrap;
}
.prompt-box{
  border:1px solid #38485d;
  background:#090d13;
  border-radius:10px;
  padding:12px;
  margin-top:10px;
}
.prompt-title{
  font-size:13px;
  color:#c9d7e7;
  font-weight:bold;
  margin-bottom:7px;
}
.prompt-box textarea{
  min-height:115px;
}
.prompt-buttons{
  display:flex;
  flex-wrap:wrap;
  margin-top:6px;
}
.media-row{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
.media-box{
  border:1px dashed #344154;
  border-radius:10px;
  padding:10px;
}
.badge{
  display:inline-block;
  padding:4px 7px;
  border-radius:6px;
  background:#172333;
  color:#bdd3ec;
  font-size:11px;
}
audio{
  width:100%;
  margin-top:8px;
}
video.preview{
  width:100%;
  max-height:260px;
  background:#000;
  border-radius:8px;
  margin-top:8px;
}
#previewCanvas{
  width:100%;
  max-height:500px;
  background:#000;
  border-radius:10px;
}
.empty{
  text-align:center;
  padding:35px;
  color:#8997a8;
}
.hidden{display:none!important}
hr{
  border:0;
  border-top:1px solid #273342;
  margin:18px 0;
}
@media(max-width:900px){
  .grid,.media-row{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:600px){
  .grid,.grid2,.media-row{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
  <div class="container" style="padding:0">
    <h1>🎬 Mina Video AI V45.1 — GeldStory Studio</h1>
    <div style="font-size:12px;color:#8f9cad;margin-top:5px">
      Sahne tabanlı video • Seslendirme • Otomatik Görsel Prompt • Motion Prompt
    </div>
  </div>
</header>

<div class="container">

  <!-- PROJE -->
  <div class="card">
    <h2>⚙️ Proje Ayarları</h2>

    <div class="grid">

      <div>
        <label>Video Başlığı</label>
        <input id="projectTitle" value="GeldStory">
      </div>

      <div>
        <label>Format</label>
        <select id="format">
          <option value="16:9">16:9 YouTube</option>
          <option value="9:16">9:16 Shorts</option>
          <option value="1:1">1:1 Kare</option>
        </select>
      </div>

      <div>
        <label>FPS</label>
        <select id="fps">
          <option value="24">24 FPS</option>
          <option value="30" selected>30 FPS</option>
        </select>
      </div>

      <div>
        <label>Kalite</label>
        <select id="bitrate">
          <option value="2500000">2.5 Mbps</option>
          <option value="4000000" selected>4 Mbps</option>
          <option value="6000000">6 Mbps</option>
          <option value="8000000">8 Mbps</option>
        </select>
      </div>

    </div>
  </div>


  <!-- HİKAYE -->
  <div class="card">
    <h2>📝 Hikâye</h2>

    <textarea id="story" placeholder="Almanca hikâyeni buraya yapıştır..."></textarea>

    <div class="toolbar" style="margin-top:8px">
      <button class="primary" onclick="splitStory()">
        ✂️ Hikâyeyi Sahnelere Böl
      </button>

      <button onclick="addScene()">
        ➕ Sahne Ekle
      </button>

      <button class="gold" onclick="generateAllPrompts()">
        ✨ TÜM SAHNE PROMPTLARINI OLUŞTUR
      </button>

      <button onclick="clearScenes()">
        🗑️ Temizle
      </button>
    </div>

    <div id="storyStatus" class="status">
      Hikâyeni gir ve sahnelere böl.
    </div>
  </div>


  <!-- SES -->
  <div class="card">
    <h2>🎙️ Seslendirme</h2>

    <div class="grid2">

      <div>
        <label>Almanca Ses</label>
        <select id="voiceSelect"></select>
      </div>

      <div>
        <label>Konuşma Hızı</label>
        <input id="speechRate" type="range" min="0.6" max="1.3" step="0.05" value="1">
        <div id="rateValue" class="badge">1.00</div>
      </div>

    </div>

    <div class="toolbar" style="margin-top:10px">

      <button class="primary" onclick="speakSelectedScene()">
        ▶️ Seçili Sahneyi Seslendir
      </button>

      <button class="danger" onclick="stopSpeaking()">
        ⏹️ Durdur
      </button>

      <button class="success" onclick="recordSelectedSceneVoice()">
        🔴 Seslendir ve Kaydet
      </button>

    </div>

    <div id="audioStatus" class="status">
      Ses sistemi hazır.
    </div>
  </div>


  <!-- SAHNELER -->
  <div class="card">
    <h2>🎞️ Sahne Yönetimi</h2>

    <div id="stats" class="stats"></div>

    <div id="scenes"></div>
  </div>


  <!-- ÖNİZLEME -->
  <div class="card">
    <h2>🎥 Video Önizleme / Render</h2>

    <canvas id="previewCanvas" width="1280" height="720"></canvas>

    <div class="toolbar" style="margin-top:10px">

      <button class="primary" onclick="renderFinal()">
        🎬 FİNAL VİDEOYU OLUŞTUR
      </button>

      <button class="danger" onclick="stopRender()">
        ⛔ Render Durdur
      </button>

      <button onclick="playMasterAudio()">
        🔊 Master Sesi Test Et
      </button>

    </div>

    <div id="renderStatus" class="status">
      Render hazır.
    </div>

    <div id="downloadArea" style="margin-top:10px"></div>
  </div>


  <!-- PROJE -->
  <div class="card">
    <h2>💾 Proje</h2>

    <div class="toolbar">

      <button onclick="saveProject()">
        💾 Projeyi Kaydet
      </button>

      <button onclick="loadProject()">
        📂 Projeyi Yükle
      </button>

      <button onclick="downloadJSON()">
        📄 JSON İndir
      </button>

    </div>
  </div>

</div>


<script>

/* =========================================================
   GLOBAL
========================================================= */

let scenes = [];
let selectedSceneIndex = 0;

let voices = [];

let audioContext = null;
let masterAudioBuffer = null;
let masterAudioBlob = null;
let masterAudioURL = null;

let renderRecorder = null;
let renderChunks = [];
let renderCancelled = false;

let currentSpeech = null;


/* =========================================================
   YARDIMCI
========================================================= */

function escapeHTML(str){
  return String(str || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function formatTime(sec){

  sec = Number(sec || 0);

  if(!isFinite(sec)) sec = 0;

  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);

  return String(m).padStart(2,"0") + ":" +
         String(s).padStart(2,"0");
}

function status(msg){
  document.getElementById("storyStatus").textContent = msg;
}

function audioStatus(msg){
  document.getElementById("audioStatus").textContent = msg;
}

function renderStatus(msg){
  document.getElementById("renderStatus").textContent = msg;
}


/* =========================================================
   VOICES
========================================================= */

function loadVoices(){

  voices = speechSynthesis.getVoices() || [];

  const select = document.getElementById("voiceSelect");

  select.innerHTML = "";

  const german = voices.filter(v =>
    /^de([-_]|$)/i.test(v.lang)
  );

  const list = german.length ? german : voices;

  list.forEach((voice,index)=>{

    const option = document.createElement("option");

    option.value = voice.name;
    option.textContent =
      voice.name + " — " + voice.lang;

    select.appendChild(option);

  });

}

speechSynthesis.onvoiceschanged = loadVoices;
setTimeout(loadVoices,500);


/* =========================================================
   SAHNE OLUŞTUR
========================================================= */

function createScene(text=""){

  return {

    title:"",
    narration:text || "",
    subtitle:text || "",

    visualPrompt:"",
    motionPrompt:"",

    imagePrompt:"",
    videoPrompt:"",

    imageFile:null,
    imageURL:"",

    videoFile:null,
    videoURL:"",

    audioFile:null,
    audioURL:"",
    duration:0

  };

}


/* =========================================================
   SAHNE EKLE
========================================================= */

function addScene(){

  scenes.push(createScene(""));

  selectedSceneIndex = scenes.length - 1;

  renderScenes();

  status("Yeni sahne eklendi.");

}


/* =========================================================
   SAHNE SEÇ
========================================================= */

function selectScene(index){

  selectedSceneIndex = index;

  renderScenes();

}


/* =========================================================
   SAHNE SİL
========================================================= */

function removeScene(index){

  if(!confirm("Bu sahne silinsin mi?")) return;

  if(scenes[index].imageURL)
    URL.revokeObjectURL(scenes[index].imageURL);

  if(scenes[index].videoURL)
    URL.revokeObjectURL(scenes[index].videoURL);

  if(scenes[index].audioURL)
    URL.revokeObjectURL(scenes[index].audioURL);

  scenes.splice(index,1);

  if(selectedSceneIndex >= scenes.length)
    selectedSceneIndex = Math.max(0,scenes.length-1);

  renderScenes();

}


/* =========================================================
   SAHNE TAŞI
========================================================= */

function moveScene(index,direction){

  const target = index + direction;

  if(target < 0 || target >= scenes.length) return;

  const temp = scenes[index];

  scenes[index] = scenes[target];
  scenes[target] = temp;

  selectedSceneIndex = target;

  renderScenes();

}


/* =========================================================
   HİKAYEYİ BÖL
========================================================= */

function splitStory(){

  const story = document.getElementById("story").value.trim();

  if(!story){

    alert("Önce hikâyeyi yaz veya yapıştır.");

    return;
  }

  /*
    Öncelik:
    boş satırlar
    ardından cümleler
  */

  let parts = story
    .split(/\n\s*\n+/)
    .map(x=>x.trim())
    .filter(Boolean);

  if(parts.length <= 1){

    parts = story
      .split(/(?<=[.!?])\s+/)
      .map(x=>x.trim())
      .filter(Boolean);

  }

  scenes = parts.map(text=>createScene(text));

  selectedSceneIndex = 0;

  generateAllPrompts(false);

  renderScenes();

  status(
    scenes.length +
    " sahne oluşturuldu ve sahne promptları hazırlandı."
  );

}


/* =========================================================
   PROMPT MOTORU
========================================================= */

function buildVisualPrompt(scene,index){

  const story = scene.narration || "";
  const title = scene.title || `Scene ${index+1}`;

  return `
Cinematic realistic documentary scene for a German success story.

Scene: ${index+1}
Title: ${title}

Story context:
${story}

Create a highly realistic cinematic image that visually represents the exact moment described in the story.

Visual requirements:
- photorealistic
- cinematic documentary photography
- realistic human anatomy
- natural facial expressions
- authentic environment
- realistic clothing for the correct time period
- realistic lighting
- detailed background
- natural skin texture
- believable objects and locations
- professional film composition
- subtle depth of field
- realistic shadows
- emotionally meaningful composition
- premium YouTube documentary quality
- no text
- no subtitles
- no logos
- no watermark
- no distorted hands
- no extra fingers
- no duplicate people
- no cartoon style
- no fantasy elements

Camera:
cinematic composition, medium shot or wide shot depending on the scene, natural perspective, 35mm documentary photography, shallow depth of field when appropriate.

Aspect ratio: ${document.getElementById("format").value}
`.trim();

}


function buildMotionPrompt(scene,index){

  const story = scene.narration || "";

  return `
Create a realistic cinematic video scene based on this story moment:

${story}

Motion direction:
- natural human movement
- realistic body movement
- subtle facial expressions
- natural blinking
- realistic breathing
- natural hand movement
- environmental movement
- realistic cloth movement
- subtle camera movement
- slow cinematic push-in or tracking movement when appropriate
- documentary filmmaking style
- physically realistic motion
- stable character identity
- realistic lighting
- realistic shadows
- no sudden camera shake
- no artificial morphing
- no face distortion
- no extra limbs
- no duplicated people
- no text
- no subtitles
- no watermark

Camera should move naturally and slowly while preserving the composition and identity of the characters.

The scene should feel like a professionally filmed real documentary rather than an AI-generated animation.
`.trim();

}


/* =========================================================
   SADECE PROMPT OLUŞTUR
========================================================= */

function generateScenePrompts(index,rerender=true){

  const scene = scenes[index];

  if(!scene) return;

  scene.visualPrompt = buildVisualPrompt(scene,index);

  scene.motionPrompt = buildMotionPrompt(scene,index);

  /*
    Eski isimlendirme alanlarını da dolduruyoruz.
    Böylece eski kod mantığıyla da uyumlu.
  */

  scene.imagePrompt = scene.visualPrompt;
  scene.videoPrompt = scene.motionPrompt;

  if(rerender)
    renderScenes();

}


/* =========================================================
   TÜM PROMPTLAR
========================================================= */

function generateAllPrompts(show=true){

  scenes.forEach((scene,index)=>{

    scene.visualPrompt =
      buildVisualPrompt(scene,index);

    scene.motionPrompt =
      buildMotionPrompt(scene,index);

    scene.imagePrompt =
      scene.visualPrompt;

    scene.videoPrompt =
      scene.motionPrompt;

  });

  if(show)
    status(
      scenes.length +
      " sahne için profesyonel görsel ve motion prompt oluşturuldu."
    );

  renderScenes();

}


/* =========================================================
   PROMPT KOPYALA
========================================================= */

async function copyPrompt(index,type){

  const scene = scenes[index];

  const text =
    type === "visual"
      ? scene.visualPrompt
      : scene.motionPrompt;

  if(!text) return;

  try{

    await navigator.clipboard.writeText(text);

    status(
      (type==="visual" ? "Görsel" : "Video") +
      " promptu panoya kopyalandı."
    );

  }catch(e){

    prompt(
      "Promptu kopyalayın:",
      text
    );

  }

}


/* =========================================================
   SAHNE ALANLARINI GÜNCELLE
========================================================= */

function updateScene(index,key,value){

  if(!scenes[index]) return;

  scenes[index][key] = value;

}


/* =========================================================
   SAHNELERİ RENDER
========================================================= */

function renderScenes(){

  const container =
    document.getElementById("scenes");

  if(!scenes.length){

    container.innerHTML =
      `<div class="empty">
        Henüz sahne yok.<br>
        Hikâyeyi sahnelere böl veya yeni sahne ekle.
      </div>`;

    updateStats();

    return;
  }

  container.innerHTML = "";

  scenes.forEach((scene,index)=>{

    const div = document.createElement("div");

    div.className =
      "scene " +
      (index===selectedSceneIndex ? "selected" : "");

    div.onclick = () => {
      selectedSceneIndex = index;
    };

    div.innerHTML = `

      <div class="scene-head">

        <div>
          <span class="scene-number">
            🎬 SAHNE ${index+1}
          </span>

          <span class="badge">
            ${scene.duration
              ? formatTime(scene.duration)
              : "Ses yok"}
          </span>
        </div>

        <div class="scene-actions">

          <button
            class="small"
            onclick="event.stopPropagation();selectScene(${index})">
            Seç
          </button>

          <button
            class="small"
            onclick="event.stopPropagation();moveScene(${index},-1)">
            ↑
          </button>

          <button
            class="small"
            onclick="event.stopPropagation();moveScene(${index},1)">
            ↓
          </button>

          <button
            class="small danger"
            onclick="event.stopPropagation();removeScene(${index})">
            Sil
          </button>

        </div>

      </div>


      <div class="grid2">

        <div>

          <label>Sahne Başlığı</label>

          <input
            value="${escapeHTML(scene.title)}"
            onchange="updateScene(${index},'title',this.value)">

        </div>

        <div>

          <label>Sahne Süresi</label>

          <div class="status">
            ${
              scene.duration
                ? "🎙️ Ses süresi: " +
                  formatTime(scene.duration)
                : "Seslendirme kaydedilmedi."
            }
          </div>

        </div>

      </div>


      <div style="margin-top:10px">

        <label>🇩🇪 Almanca Seslendirme Metni</label>

        <textarea
          onchange="updateScene(${index},'narration',this.value)"
        >${escapeHTML(scene.narration)}</textarea>

      </div>


      <div style="margin-top:10px">

        <label>💬 Altyazı</label>

        <textarea
          onchange="updateScene(${index},'subtitle',this.value)"
        >${escapeHTML(scene.subtitle)}</textarea>

      </div>


      <!-- GÖRSEL PROMPT -->

      <div class="prompt-box">

        <div class="prompt-title">
          🖼️ GÖRSEL ÜRETİM PROMPTU
        </div>

        <textarea
          id="visualPrompt_${index}"
          onchange="updateScene(${index},'visualPrompt',this.value);scenes[${index}].imagePrompt=this.value"
          placeholder="Görsel promptu..."
        >${escapeHTML(scene.visualPrompt)}</textarea>

        <div class="prompt-buttons">

          <button
            class="gold small"
            onclick="event.stopPropagation();generateScenePrompts(${index})">
            ✨ Prompt Oluştur
          </button>

          <button
            class="small"
            onclick="event.stopPropagation();copyPrompt(${index},'visual')">
            📋 Görsel Promptu Kopyala
          </button>

        </div>

      </div>


      <!-- VIDEO PROMPT -->

      <div class="prompt-box">

        <div class="prompt-title">
          🎥 VİDEO / MOTION PROMPTU
        </div>

        <textarea
          id="motionPrompt_${index}"
          onchange="updateScene(${index},'motionPrompt',this.value);scenes[${index}].videoPrompt=this.value"
          placeholder="Video hareket promptu..."
        >${escapeHTML(scene.motionPrompt)}</textarea>

        <div class="prompt-buttons">

          <button
            class="gold small"
            onclick="event.stopPropagation();generateScenePrompts(${index})">
            ✨ Motion Prompt Oluştur
          </button>

          <button
            class="small"
            onclick="event.stopPropagation();copyPrompt(${index},'motion')">
            📋 Video Promptu Kopyala
          </button>

        </div>

      </div>


      <!-- MEDYA -->

      <div class="media-row" style="margin-top:12px">

        <div class="media-box">

          <label>🖼️ Görsel Yükle</label>

          <input
            type="file"
            accept="image/*"
            onchange="handleImage(${index},this.files[0])">

          ${
            scene.imageURL
            ? `<img
                 src="${scene.imageURL}"
                 style="width:100%;margin-top:8px;border-radius:8px;max-height:200px;object-fit:cover"
               >`
            : ""
          }

        </div>


        <div class="media-box">

          <label>🎥 Gerçek Video Yükle</label>

          <input
            type="file"
            accept="video/*"
            onchange="handleVideo(${index},this.files[0])">

          ${
            scene.videoURL
            ? `<video
                 class="preview"
                 src="${scene.videoURL}"
                 controls>
               </video>`
            : ""
          }

        </div>


        <div class="media-box">

          <label>🎙️ Ses Dosyası</label>

          <input
            type="file"
            accept="audio/*"
            onchange="handleAudio(${index},this.files[0])">

          ${
            scene.audioURL
            ? `<audio
                 controls
                 src="${scene.audioURL}">
               </audio>`
            : `<div class="status">Ses yok</div>`
          }

        </div>

      </div>

    `;

    container.appendChild(div);

  });

  updateStats();

}


/* =========================================================
   İSTATİSTİK
========================================================= */

function updateStats(){

  const total =
    scenes.reduce(
      (sum,s)=>sum + Number(s.duration||0),
      0
    );

  const withAudio =
    scenes.filter(s=>s.audioFile).length;

  document.getElementById("stats").innerHTML = `

    <div class="stat">
      🎬 Sahne: <b>${scenes.length}</b>
    </div>

    <div class="stat">

/* =========================================================

========================================================= */

async function recordSelectedSceneVoice(){

  const scene = scenes[selectedSceneIndex];

  if(!scene){

    alert("Önce bir sahne seç.");

    return;
  }

  const text =
    scene.narration.trim();

  if(!text){

    alert("Bu sahnede seslendirilecek metin yok.");

    return;
  }

  if(!navigator.mediaDevices ||
     !navigator.mediaDevices.getDisplayMedia){

    alert(
      "Tarayıcınız sekme sesini kaydetmeyi desteklemiyor."
    );

    return;
  }

  try{

    audioStatus(
      "🔴 Chrome paylaşım penceresi açılıyor..."
    );

    /*
      Kullanıcı:
      BU SEKME
      ve
      SEKME SESİNİ PAYLAŞ
      seçmelidir.
    */

    const stream =
      await navigator.mediaDevices.getDisplayMedia({
        video:true,
        audio:true
      });

    const audioTracks =
      stream.getAudioTracks();

    if(!audioTracks.length){

      stream.getTracks()
        .forEach(t=>t.stop());

      alert(
        "Sekme sesi alınamadı.\n\n" +
        "Chrome penceresinde:\n" +
        "1. Bu sekme\n" +
        "2. Sekme sesini paylaş\n" +
        "seçeneklerini aç."
      );

      audioStatus(
        "❌ Sekme ses izi bulunamadı."
      );

      return;
    }

    const audioOnly =
      new MediaStream(audioTracks);

    let mime =
      "audio/webm;codecs=opus";

    if(!MediaRecorder.isTypeSupported(mime))
      mime = "audio/webm";

    const recorder =
      new MediaRecorder(
        audioOnly,
        {mimeType:mime}
      );

    const chunks = [];

    recorder.ondataavailable = e=>{

      if(e.data && e.data.size)
        chunks.push(e.data);

    };

    recorder.onerror = e=>{

      audioStatus(
        "❌ Kayıt hatası."
      );

    };

    recorder.onstop = async ()=>{

      const blob =
        new Blob(
          chunks,
          {type:mime}
        );

      const file =
        new File(
          [blob],
          `Mina_Sahne_${selectedSceneIndex+1}.webm`,
          {type:mime}
        );

      if(scene.audioURL)
        URL.revokeObjectURL(scene.audioURL);

      scene.audioFile = file;

      scene.audioURL =
        URL.createObjectURL(blob);

      const audio =
        new Audio(scene.audioURL);

      audio.addEventListener(
        "loadedmetadata",
        ()=>{

          scene.duration =
            audio.duration || 0;

          audioStatus(
            "✅ Ses kaydedildi. Süre: " +
            formatTime(scene.duration)
          );

          renderScenes();

        },
        {once:true}
      );

    };

    recorder.start(100);

    audioStatus(
      "🔴 KAYIT DEVAM EDİYOR..."
    );

    setTimeout(()=>{

      const voiceName =
        document.getElementById("voiceSelect").value;

      const voice =
        voices.find(v=>v.name===voiceName);

      const utterance =
        new SpeechSynthesisUtterance(text);

      if(voice)
        utterance.voice = voice;

      utterance.lang =
        voice?.lang || "de-DE";

      utterance.rate =
        Number(
          document.getElementById("speechRate").value
        );

      utterance.pitch = 1;

      utterance.onend = ()=>{

        setTimeout(()=>{

          try{
            recorder.stop();
          }catch(e){}

          stream.getTracks()
            .forEach(t=>t.stop());

        },300);

      };

      utterance.onerror = ()=>{

        try{
          recorder.stop();
        }catch(e){}

        stream.getTracks()
          .forEach(t=>t.stop());

      };

      speechSynthesis.cancel();

      currentSpeech = utterance;

      speechSynthesis.speak(utterance);

    },700);

  }catch(error){

    audioStatus(
      "❌ Kayıt iptal edildi veya izin verilmedi."
    );

    console.error(error);

  }

}


/* =========================================================
   AUDIO CONTEXT
========================================================= */

async function getAudioContext(){

  if(!audioContext){

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }

  if(audioContext.state==="suspended")
    await audioContext.resume();

  return audioContext;

}


/* =========================================================
   MASTER AUDIO
========================================================= */

async function createMasterAudio(){

  const audioScenes =
    scenes.filter(
      s=>s.audioFile && s.duration>0
    );

  if(!audioScenes.length){

    throw new Error(
      "Ses dosyası bulunan sahne yok."
    );

  }

  const ctx =
    await getAudioContext();

  const buffers = [];

  for(const scene of audioScenes){

    const arrayBuffer =
      await scene.audioFile.arrayBuffer();

    const buffer =
      await ctx.decodeAudioData(
        arrayBuffer.slice(0)
      );

    buffers.push(buffer);

  }

  const sampleRate =
    buffers[0].sampleRate;

  let totalLength = 0;

  buffers.forEach(
    b=>totalLength += b.length
  );

  const channels = 2;

  const master =
    ctx.createBuffer(
      channels,
      totalLength,
      sampleRate
    );

  let offset = 0;

  buffers.forEach(buffer=>{

    const left =
      master.getChannelData(0);

    const right =
      master.getChannelData(1);

    const sourceLeft =
      buffer.getChannelData(0);

    const sourceRight =
      buffer.numberOfChannels > 1
      ? buffer.getChannelData(1)
      : sourceLeft;

    for(
      let i=0;
      i<buffer.length;
      i++
    ){

      left[offset+i] =
        sourceLeft[i] || 0;

      right[offset+i] =
        sourceRight[i] || 0;

    }

    offset += buffer.length;

  });

  masterAudioBuffer = master;

  masterAudioBlob =
    audioBufferToWav(master);

  if(masterAudioURL)
    URL.revokeObjectURL(masterAudioURL);

  masterAudioURL =
    URL.createObjectURL(masterAudioBlob);

  return master;

}


/* =========================================================
   WAV
========================================================= */

function audioBufferToWav(buffer){

  const channels = 2;
  const sampleRate = buffer.sampleRate;
  const length = buffer.length;

  const dataLength =
    length * channels * 2;

  const arrayBuffer =
    new ArrayBuffer(44 + dataLength);

  const view =
    new DataView(arrayBuffer);

  function writeString(offset,string){

    for(let i=0;i<string.length;i++)
      view.setUint8(
        offset+i,
        string.charCodeAt(i)
      );

  }

  writeString(0,"RIFF");

  view.setUint32(
    4,
    36+dataLength,
    true
  );

  writeString(8,"WAVE");
  writeString(12,"fmt ");

  view.setUint32(16,16,true);
  view.setUint16(20,1,true);
  view.setUint16(22,channels,true);

  view.setUint32(
    24,
    sampleRate,
    true
  );

  view.setUint32(
    28,
    sampleRate*channels*2,
    true
  );

  view.setUint16(
    32,
    channels*2,
    true
  );

  view.setUint16(34,16,true);

  writeString(36,"data");

  view.setUint32(
    40,
    dataLength,
    true
  );

  const left =
    buffer.getChannelData(0);

  const right =
    buffer.getChannelData(1);

  let offset = 44;

  for(let i=0;i<length;i++){

    let l =
      Math.max(
        -1,
        Math.min(1,left[i])
      );

    let r =
      Math.max(
        -1,
        Math.min(1,right[i])
      );

    view.setInt16(
      offset,
      l<0 ? l*0x8000 : l*0x7fff,
      true
    );

    offset += 2;

    view.setInt16(
      offset,
      r<0 ? r*0x8000 : r*0x7fff,
      true
    );

    offset += 2;

  }

  return new Blob(
    [arrayBuffer],
    {type:"audio/wav"}
  );

}

function getCanvasSize(){

  if(format==="9:16")

/* =========================================================
   CANVAS ÇİZ
========================================================= */

async function drawScene(
  ctx,
  scene,
  canvas,
  progress
){

  ctx.fillStyle="#05070a";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  if(scene.videoFile){

    if(!scene._videoElement){

      const video =
        document.createElement("video");

      video.src =
        scene.videoURL;

      video.muted = true;
      video.playsInline = true;

      await video.play().catch(()=>{});

      scene._videoElement = video;

    }

    const video =
      scene._videoElement;

    if(video.readyState>=2){

      const vw=video.videoWidth;
      const vh=video.videoHeight;

      const scale =
        Math.max(
          canvas.width/vw,
          canvas.height/vh
        );

      const w=vw*scale;
      const h=vh*scale;

      const x=(canvas.width-w)/2;
      const y=(canvas.height-h)/2;

      try{

        ctx.drawImage(
          video,
          x,y,w,h
        );

      }catch(e){}

    }

  }else if(scene.imageFile){

    if(!scene._imageElement){

      const img =
        new Image();

      img.src =
        scene.imageURL;

      await new Promise(resolve=>{
        img.onload=resolve;
        img.onerror=resolve;
      });

      scene._imageElement = img;

    }

    const img =
      scene._imageElement;

    if(img.complete){

      const scale =
        Math.max(
          canvas.width/img.width,
          canvas.height/img.height
        );

      const baseW =
        img.width*scale;

      const baseH =
        img.height*scale;

      const zoom =
        1.0 + progress*0.08;

      const w =
        baseW*zoom;

      const h =
        baseH*zoom;

      const x =
        (canvas.width-w)/2;

      const y =
        (canvas.height-h)/2;

      ctx.drawImage(
        img,
        x,y,w,h
      );

    }

  }else{

    const g =
      ctx.createLinearGradient(
        0,0,
        canvas.width,
        canvas.height
      );

    g.addColorStop(0,"#0b1018");
    g.addColorStop(1,"#182333");

    ctx.fillStyle=g;

    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

  }

}


/* =========================================================
   ALTYAZI
========================================================= */

function drawSubtitle(
  ctx,
  canvas,
  text
){

  if(!text) return;

  const maxWidth =
    canvas.width * 0.82;

  const fontSize =
    Math.max(
      24,
      Math.floor(canvas.width*0.028)
    );

  ctx.font =
    `bold ${fontSize}px Arial`;

  ctx.textAlign="center";
  ctx.textBaseline="middle";

  const words =
    text.split(/\s+/);

  const lines=[];
  let line="";

  words.forEach(word=>{

    const test =
      line
      ? line+" "+word
      : word;

    if(
      ctx.measureText(test).width >
      maxWidth
    ){

      if(line)
        lines.push(line);

      line=word;

    }else{

      line=test;

    }

  });

  if(line)
    lines.push(line);

  const lineHeight =
    fontSize*1.3;

  const total =
    lines.length*lineHeight;

  const startY =
    canvas.height*0.84 -
    total/2;

  ctx.save();

  ctx.fillStyle="rgba(0,0,0,.68)";

  const boxHeight =
    total + fontSize;

  ctx.fillRect(
    canvas.width*0.08,
    startY-fontSize*0.55,
    canvas.width*0.84,
    boxHeight
  );

  ctx.fillStyle="#fff";

  lines.forEach((l,i)=>{

    ctx.fillText(
      l,
      canvas.width/2,
      startY +
      i*lineHeight +
      lineHeight/2
    );

  });

  ctx.restore();

}


/* =========================================================
   AUDIO STREAM
========================================================= */

async function createAudioStream(){

  const ctx =
    await getAudioContext();

  if(!masterAudioBuffer)
    await createMasterAudio();

  const destination =
    ctx.createMediaStreamDestination();

  const source =
    ctx.createBufferSource();

  source.buffer =
    masterAudioBuffer;

  source.connect(destination);

  return {
    ctx,
    source,
    destination
  };

}


/* =========================================================
   FİNAL RENDER
========================================================= */

async function renderFinal(){

  if(!scenes.length){

    alert("Önce sahne oluştur.");

    return;
  }

  try{

    renderCancelled=false;

    document
      .getElementById("downloadArea")
      .innerHTML="";

    renderStatus(
      "⏳ Master ses hazırlanıyor..."
    );

    await createMasterAudio();

    const size =
      getCanvasSize();

    const canvas =
      document.getElementById("previewCanvas");

    canvas.width=size.width;
    canvas.height=size.height;

    const ctx =
      canvas.getContext("2d");

    const fps =
      Number(
        document.getElementById("fps").value
      );

    const bitrate =
      Number(
        document.getElementById("bitrate").value
      );

    const videoStream =
      canvas.captureStream(fps);

    const audioData =
      await createAudioStream();

    const finalStream =
      new MediaStream();

    videoStream
      .getVideoTracks()
      .forEach(track=>{
        finalStream.addTrack(track);
      });

    audioData
      .destination
      .stream
      .getAudioTracks()
      .forEach(track=>{
        finalStream.addTrack(track);
      });

    const mimeTypes=[
      "video/webm;codecs=vp8,opus",
      "video/webm;codecs=vp9,opus",
      "video/webm"
    ];

    let mime="video/webm";

    for(const m of mimeTypes){

      if(MediaRecorder.isTypeSupported(m)){

        mime=m;
        break;

      }

    }

    renderChunks=[];

    renderRecorder =
      new MediaRecorder(
        finalStream,
        {
          mimeType:mime,
          videoBitsPerSecond:bitrate,
          audioBitsPerSecond:128000
        }
      );

    renderRecorder.ondataavailable=e=>{

      if(e.data && e.data.size)
        renderChunks.push(e.data);

    };

    renderRecorder.onstop=()=>{

      const blob =
        new Blob(
          renderChunks,
          {type:mime}
        );

      const url =
        URL.createObjectURL(blob);

      const a =
        document.createElement("a");

      a.href=url;

      a.download =
        (
          document.getElementById(
            "projectTitle"
          ).value || "GeldStory"
        )
        .replace(/[^\w\-]+/g,"_")
        +
        "_V45_1.webm";

      a.textContent =
        "⬇️ FİNAL VİDEOYU İNDİR";

      a.style.display="inline-block";
      a.style.padding="12px 16px";
      a.style.background="#246b4c";
      a.style.color="#fff";
      a.style.borderRadius="9px";
      a.style.textDecoration="none";
      a.style.fontWeight="bold";

      document
        .getElementById("downloadArea")
        .appendChild(a);

      renderStatus(
        "✅ Video tamamlandı. Ses + görüntü hazır."
      );

    };

    renderRecorder.start(250);

    /*
      Audio başlat
    */

    audioData.source.start(0);

    let elapsed=0;

    const totalDuration =
      scenes.reduce(
        (sum,s)=>sum+Number(s.duration||0),
        0
      );

    const startTime =
      performance.now();

    async function frame(){

      if(renderCancelled){

        try{
          renderRecorder.stop();
        }catch(e){}

        return;
      }

      const now =
        performance.now();

      elapsed =
        (now-startTime)/1000;

      let sceneStart=0;
      let activeScene=null;
      let localProgress=0;

      for(const scene of scenes){

        const duration =
          Number(scene.duration||0);

        if(
          elapsed >= sceneStart &&
          elapsed < sceneStart+duration
        ){

          activeScene=scene;

          localProgress =
            duration
              ? (elapsed-sceneStart)/duration
              : 0;

          break;

        }

        sceneStart += duration;

      }

      if(!activeScene){

        if(elapsed >= totalDuration){

          try{
            renderRecorder.stop();
          }catch(e){}

          return;

        }

        requestAnimationFrame(frame);

        return;
      }

      const index =
        scenes.indexOf(activeScene);

      await drawScene(
        ctx,
        activeScene,
        canvas,
        localProgress
      );

      drawSubtitle(
        ctx,
        canvas,
        activeScene.subtitle ||
        activeScene.narration
      );

      renderStatus(
        "🎬 Render: Sahne " +
        (index+1) +
        "/" +
        scenes.length +
        " • " +
        formatTime(elapsed) +
        " / " +
        formatTime(totalDuration)
      );

      requestAnimationFrame(frame);

    }

    frame();

  }catch(error){

    console.error(error);

    renderStatus(
      "❌ Render hatası: " +
      error.message
    );

    alert(
      "Render hatası:\n\n" +
      error.message
    );

  }

}

          s.imagePrompt || "",

        videoPrompt:
          s.videoPrompt || "",

        duration:
          Number(s.duration||0)

      }));

    selectedSceneIndex=0;

    renderScenes();

    status(
      "📂 Proje yüklendi. Medya dosyaları yeniden seçilmelidir."
    );

  }catch(e){

    alert(
      "Proje yüklenemedi."
    );

  }

}


/* =========================================================
   JSON
========================================================= */

function downloadJSON(){

  const data={

    version:"45.1",

    projectTitle:
      document.getElementById("projectTitle").value,

    format:
      document.getElementById("format").value,

    fps:
      document.getElementById("fps").value,

    scenes:
      scenes.map((scene,index)=>({

        scene:index+1,

        title:scene.title,

        narration:scene.narration,

        subtitle:scene.subtitle,

        duration:scene.duration,

        visualPrompt:
          scene.visualPrompt,

        motionPrompt:
          scene.motionPrompt

      }))

  };

  const blob =
    new Blob(
      [JSON.stringify(data,null,2)],
      {type:"application/json"}
    );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href=url;

  a.download="GeldStory_V45_1_Project.json";

  a.click();

  setTimeout(
    ()=>URL.revokeObjectURL(url),
    1000
  );

}
