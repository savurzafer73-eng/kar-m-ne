<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mina Video AI V45.2 — GeldStory Studio</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#0b0d12;
  color:#f2f4f8;
  font-family:Arial,Helvetica,sans-serif;
}
header{
  padding:18px;
  background:linear-gradient(135deg,#111827,#080a0f);
  border-bottom:1px solid #242938;
}
h1{margin:0 0 6px;font-size:25px}
.sub{color:#9ca3af;font-size:13px}
.container{max-width:1250px;margin:auto;padding:16px}
.card{
  background:#11151d;
  border:1px solid #252b38;
  border-radius:14px;
  padding:16px;
  margin-bottom:15px;
}
h2{
  font-size:17px;
  margin:0 0 14px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}
.field{display:flex;flex-direction:column;gap:6px}
label{
  color:#aeb6c5;
  font-size:12px;
}
input,textarea,select{
  width:100%;
  background:#090c11;
  border:1px solid #303746;
  color:#fff;
  border-radius:9px;
  padding:10px;
  outline:none;
}
textarea{min-height:100px;resize:vertical}
button{
  border:0;
  border-radius:9px;
  padding:10px 14px;
  background:#242b39;
  color:#fff;
  cursor:pointer;
  font-weight:bold;
}
button:hover{filter:brightness(1.15)}
.primary{background:#2563eb}
.green{background:#15803d}
.red{background:#b91c1c}
.orange{background:#c2410c}
.small{
  padding:7px 9px;
  font-size:12px;
}
.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.scene{
  background:#0d1118;
  border:1px solid #293141;
  border-radius:14px;
  padding:15px;
  margin-bottom:14px;
}
.sceneHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}
.sceneNo{
  font-weight:bold;
  font-size:16px;
}
.badge{
  background:#202838;
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
}
.sceneGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.full{grid-column:1/-1}
.actions{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:10px;
}
.preview{
  position:relative;
  margin-top:12px;
  border-radius:12px;
  overflow:hidden;
  background:#000;
  min-height:180px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.preview img,.preview video{
  max-width:100%;
  max-height:320px;
  display:block;
}
.duration{
  font-size:12px;
  color:#67e8f9;
  margin-top:5px;
}
.prompt{
  min-height:115px;
}
.status{
  padding:12px;
  border-radius:10px;
  background:#090c11;
  border:1px solid #2b3342;
  white-space:pre-wrap;
  font-size:13px;
}
.progressBox{
  margin-top:12px;
  display:none;
}
.progressOuter{
  height:12px;
  background:#252a35;
  border-radius:20px;
  overflow:hidden;
}
.progressInner{
  height:100%;
  width:0%;
  background:#2563eb;
}
#finalVideo{
  width:100%;
  max-height:600px;
  background:#000;
  border-radius:12px;
  margin-top:12px;
}
.hidden{display:none!important}
@media(max-width:800px){
  .grid,.sceneGrid{grid-template-columns:1fr}
  .full{grid-column:auto}
}
</style>
</head>

<body>

<header>
  <h1>🎬 Mina Video AI V45.2 — GeldStory Studio</h1>
  <div class="sub">
    Sınırsız sahne • Ses süresine göre zamanlama • Prompt • Seslendirme • WebM Render
  </div>
</header>

<div class="container">

<!-- PROJE -->
<div class="card">
<h2>⚙️ Proje Ayarları</h2>

<div class="grid">

<div class="field">
<label>Proje adı</label>
<input id="projectName" value="GeldStory Video">
</div>

<div class="field">
<label>Format</label>
<select id="format">
<option value="16:9">16:9 YouTube</option>
<option value="9:16">9:16 Shorts</option>
<option value="1:1">1:1</option>
</select>
</div>

<div class="field">
<label>FPS</label>
<select id="fps">
<option value="24">24 FPS</option>
<option value="30" selected>30 FPS</option>
</select>
</div>

<div class="field">
<label>Video kalitesi</label>
<select id="bitrate">
<option value="2500000">Standart</option>
<option value="4000000" selected>Yüksek</option>
<option value="6000000">Çok yüksek</option>
</select>
</div>

</div>
</div>

<!-- HİKAYE -->
<div class="card">
<h2>📖 Hikâye</h2>

<textarea id="story" placeholder="Almanca hikâyeni buraya yapıştır..."></textarea>

<div class="toolbar" style="margin-top:10px">
<button class="primary" onclick="splitStory()">✂️ Hikâyeyi Sahnelere Böl</button>
<button onclick="generateAllPrompts()">✨ Tüm Promptları Oluştur</button>
<button onclick="addScene()">➕ Sahne Ekle</button>
</div>
</div>

<!-- SES -->
<div class="card">
<h2>🎙️ Seslendirme</h2>

<div class="grid">

<div class="field">
<label>Almanca ses</label>
<select id="voiceSelect"></select>
</div>

<div class="field">
<label>Konuşma hızı</label>
<input id="rate" type="number" min="0.6" max="1.3" step="0.05" value="0.95">
</div>

</div>

<div class="toolbar" style="margin-top:10px">
<button class="primary" onclick="speakSelected()">▶️ Seçili Sahneyi Seslendir</button>
<button class="red" onclick="stopSpeech()">⏹️ Durdur</button>
<button class="orange" onclick="recordSelected()">🔴 Seslendirmeyi Kaydet</button>
</div>

<div class="status" id="voiceStatus" style="margin-top:10px">
Hazır.
</div>
</div>

<!-- SAHNELER -->
<div class="card">
<h2>🎞️ Sahneler</h2>
<div id="scenes"></div>
</div>

<!-- RENDER -->
<div class="card">
<h2>🎬 Video Render</h2>

<div class="toolbar">
<button class="green" onclick="renderFinal()">🎬 VİDEOYU RENDER ET</button>
<button onclick="stopRender()">⛔ Renderı Durdur</button>
<button onclick="testAudio()">🔊 Ses Testi</button>
</div>

<div class="progressBox" id="progressBox">
<div id="renderText" style="margin-bottom:8px">
Hazırlanıyor...
</div>
<div class="progressOuter">
<div class="progressInner" id="progressInner"></div>
</div>
</div>

<div class="status" id="renderStatus" style="margin-top:12px">
Render bekliyor.
</div>

<video id="finalVideo" controls class="hidden"></video>

<div class="toolbar" style="margin-top:10px">
<a id="downloadVideo" class="hidden" download="GeldStory_Final.webm">
<button class="green">⬇️ Videoyu İndir</button>
</a>
</div>
</div>

<!-- PROJE -->
<div class="card">
<h2>💾 Proje Yönetimi</h2>

<div class="toolbar">
<button onclick="saveProject()">💾 Projeyi Kaydet</button>
<button onclick="loadProject()">📂 Projeyi Yükle</button>
<button onclick="downloadJSON()">📄 JSON İndir</button>
</div>
</div>

</div>

<script>

let scenes=[];
let selectedScene=0;

let speaking=false;
let renderCancelled=false;
let renderRecorder=null;

let voices=[];

const $=id=>document.getElementById(id);

/* =========================================================
   FORMAT
========================================================= */

function getCanvasSize(){

  const f=$("format").value;

  if(f==="9:16"){
    return {w:720,h:1280};
  }

  if(f==="1:1"){
    return {w:1080,h:1080};
  }

  return {w:1280,h:720};
}

/* =========================================================
   TIME
========================================================= */

function formatTime(sec){

  if(!Number.isFinite(sec) || sec<0) sec=0;

  sec=Math.round(sec);

  const h=Math.floor(sec/3600);
  const m=Math.floor((sec%3600)/60);
  const s=sec%60;

  if(h>0){
    return String(h).padStart(2,"0")+":"+
           String(m).padStart(2,"0")+":"+
           String(s).padStart(2,"0");
  }

  return String(m).padStart(2,"0")+":"+
         String(s).padStart(2,"0");
}

function getSceneDuration(scene){

  if(!scene) return 0;

  return Number(scene.duration)||0;
}

function getTotalDuration(){

  let total=0;

  for(const scene of scenes){

    const d=getSceneDuration(scene);

    if(Number.isFinite(d) && d>0){
      total+=d;
    }
  }

  return total;
}

/* =========================================================
   VOICES
========================================================= */

function loadVoices(){

  voices=speechSynthesis.getVoices();

  const select=$("voiceSelect");

  select.innerHTML="";

  const german=voices.filter(v=>{
    const lang=(v.lang||"").toLowerCase();
    return lang.startsWith("de");
  });

  const list=german.length?german:voices;

  list.forEach((v,i)=>{

    const opt=document.createElement("option");

    opt.value=voices.indexOf(v);

    opt.textContent=v.name+" — "+v.lang;

    select.appendChild(opt);
  });

  if(!list.length){

    const opt=document.createElement("option");
    opt.textContent="Tarayıcı sesi bulunamadı";
    select.appendChild(opt);
  }
}

speechSynthesis.onvoiceschanged=loadVoices;
loadVoices();

/* =========================================================
   STORY SPLIT
========================================================= */

function splitStory(){

  const text=$("story").value.trim();

  if(!text){
    alert("Önce hikâyeyi yaz.");
    return;
  }

  const parts=text
    .split(/\n+/)
    .map(x=>x.trim())
    .filter(Boolean);

  scenes=[];

  parts.forEach((text,i)=>{

    scenes.push({
      title:"Sahne "+(i+1),
      narration:text,
      subtitle:text,
      visualPrompt:"",
      motionPrompt:"",
      imageFile:null,
      imageURL:"",
      videoFile:null,
      videoURL:"",
      audioFile:null,
      audioURL:"",
      duration:0
    });

  });

  generateAllPrompts(false);
  renderScenes();

  setStatus(
    "voiceStatus",
    scenes.length+
    " sahne oluşturuldu.\n"+
    "Şimdi sahneleri seslendirebilirsin."
  );
}

/* =========================================================
   SCENE
========================================================= */

function addScene(){

  scenes.push({
    title:"Sahne "+(scenes.length+1),
    narration:"",
    subtitle:"",
    visualPrompt:"",
    motionPrompt:"",
    imageFile:null,
    imageURL:"",
    videoFile:null,
    videoURL:"",
    audioFile:null,
    audioURL:"",
    duration:0
  });

  renderScenes();
}

function deleteScene(i){

  if(!confirm("Bu sahne silinsin mi?")) return;

  const s=scenes[i];

  if(s.imageURL && s.imageURL.startsWith("blob:")){
    URL.revokeObjectURL(s.imageURL);
  }

  if(s.videoURL && s.videoURL.startsWith("blob:")){
    URL.revokeObjectURL(s.videoURL);
  }

  if(s.audioURL && s.audioURL.startsWith("blob:")){
    URL.revokeObjectURL(s.audioURL);
  }

  scenes.splice(i,1);

  if(selectedScene>=scenes.length){
    selectedScene=Math.max(0,scenes.length-1);
  }

  renderScenes();
}

function moveScene(i,dir){

  const n=i+dir;

  if(n<0 || n>=scenes.length) return;

  const temp=scenes[i];

  scenes[i]=scenes[n];
  scenes[n]=temp;

  renderScenes();
}

function updateScene(i,key,value){

  if(!scenes[i]) return;

  scenes[i][key]=value;
}

/* =========================================================
   PROMPTS
========================================================= */

function buildVisualPrompt(scene,index){

  const text=scene.narration||scene.subtitle||"";

  return `
Cinematic realistic documentary scene for a German-language business success story.

Scene ${index+1}:
${text}

Show the exact situation described in the narration.
Photorealistic people, authentic environment, realistic facial expressions,
natural human anatomy, realistic clothing, realistic objects,
professional documentary cinematography, cinematic composition,
natural lighting, realistic shadows, subtle depth of field,
high detail, believable real-world atmosphere.

The scene must visually tell the story without using text.

No subtitles, no captions, no logos, no watermark,
no distorted faces, no extra fingers, no deformed hands,
no unrealistic anatomy, no cartoon style.
`.trim();
}

function buildMotionPrompt(scene,index){

  const text=scene.narration||scene.subtitle||"";

  return `
Realistic cinematic image-to-video motion for scene ${index+1}.

Scene:
${text}

Natural human movement, realistic blinking, breathing,
subtle hand and body movement, natural environmental movement,
realistic cloth and hair movement when appropriate.

Slow professional documentary camera movement,
subtle push-in or tracking movement,
stable cinematic camera,
realistic physical motion.

Preserve identity, face, clothing and environment.
No morphing, no melting, no distorted anatomy,
no extra limbs, no sudden camera jumps,
no text, no subtitles, no watermark.
`.trim();
}

function generateScenePrompts(i){

  if(!scenes[i]) return;

  if(!scenes[i].visualPrompt){
    scenes[i].visualPrompt=buildVisualPrompt(scenes[i],i);
  }

  if(!scenes[i].motionPrompt){
    scenes[i].motionPrompt=buildMotionPrompt(scenes[i],i);
  }

  renderScenes();
}

function generateAllPrompts(force=true){

  scenes.forEach((s,i)=>{

    if(force || !s.visualPrompt){
      s.visualPrompt=buildVisualPrompt(s,i);
    }

    if(force || !s.motionPrompt){
      s.motionPrompt=buildMotionPrompt(s,i);
    }

  });

  renderScenes();
}

/* =========================================================
   COPY
========================================================= */

async function copyText(text){

  try{

    await navigator.clipboard.writeText(text);

    alert("Prompt kopyalandı.");

  }catch(e){

    prompt("Prompt:",text);
  }
}

/* =========================================================
   FILES
========================================================= */

function attachImage(i,input){

  const file=input.files[0];

  if(!file) return;

  scenes[i].imageFile=file;

  if(scenes[i].imageURL){
    try{URL.revokeObjectURL(scenes[i].imageURL)}catch(e){}
  }

  scenes[i].imageURL=URL.createObjectURL(file);

  renderScenes();
}

function attachVideo(i,input){

  const file=input.files[0];

  if(!file) return;

  scenes[i].videoFile=file;

  if(scenes[i].videoURL){
    try{URL.revokeObjectURL(scenes[i].videoURL)}catch(e){}
  }

  scenes[i].videoURL=URL.createObjectURL(file);

  renderScenes();
}

function attachAudio(i,input){

  const file=input.files[0];

  if(!file) return;

  scenes[i].audioFile=file;

  if(scenes[i].audioURL){
    try{URL.revokeObjectURL(scenes[i].audioURL)}catch(e){}
  }

  scenes[i].audioURL=URL.createObjectURL(file);

  const audio=new Audio();

  audio.preload="metadata";

  audio.onloadedmetadata=()=>{

    scenes[i].duration=Number(audio.duration)||0;

    renderScenes();

    updateTotalInfo();
  };

  audio.src=scenes[i].audioURL;
}

/* =========================================================
   SCENE RENDER
========================================================= */

function renderScenes(){

  const box=$("scenes");

  box.innerHTML="";

  if(!scenes.length){

    box.innerHTML=
      '<div class="status">Henüz sahne yok.</div>';

    updateTotalInfo();

    return;
  }

  scenes.forEach((s,i)=>{

    const div=document.createElement("div");

    div.className="scene";

    div.innerHTML=`

      <div class="sceneHead">

        <div class="sceneNo">
          🎬 Sahne ${i+1}
        </div>

        <div class="badge">
          ${formatTime(s.duration)}
        </div>

      </div>

      <div class="sceneGrid">

        <div class="field">
          <label>Başlık</label>
          <input value="${escapeAttr(s.title||"")}"
            onchange="updateScene(${i},'title',this.value)">
        </div>

        <div class="field">
          <label>Sahne süresi</label>
          <input value="${formatTime(s.duration)}" readonly>
        </div>

        <div class="field full">
          <label>Almanca anlatım</label>
          <textarea
            onchange="updateScene(${i},'narration',this.value)"
          >${escapeHtml(s.narration||"")}</textarea>
        </div>

        <div class="field full">
          <label>Altyazı</label>
          <textarea
            onchange="updateScene(${i},'subtitle',this.value)"
          >${escapeHtml(s.subtitle||"")}</textarea>
        </div>

        <div class="field full">
          <label>🖼️ Görsel Promptu</label>

          <textarea class="prompt"
            onchange="updateScene(${i},'visualPrompt',this.value)"
          >${escapeHtml(s.visualPrompt||"")}</textarea>

          <div class="actions">
            <button class="small"
              onclick="generateScenePrompts(${i})">
              ✨ Oluştur
            </button>

            <button class="small"
              onclick="copyText(scenes[${i}].visualPrompt)">
              📋 Kopyala
            </button>
          </div>
        </div>

        <div class="field full">
          <label>🎥 Video / Motion Promptu</label>

          <textarea class="prompt"
            onchange="updateScene(${i},'motionPrompt',this.value)"
          >${escapeHtml(s.motionPrompt||"")}</textarea>

          <div class="actions">
            <button class="small"
              onclick="scenes[${i}].motionPrompt=buildMotionPrompt(scenes[${i}],${i});renderScenes()">
              ✨ Oluştur
            </button>

            <button class="small"
              onclick="copyText(scenes[${i}].motionPrompt)">
              📋 Kopyala
            </button>
          </div>
        </div>

        <div class="field">
          <label>🖼️ Görsel yükle</label>
          <input type="file"
            accept="image/*"
            onchange="attachImage(${i},this)">
        </div>

        <div class="field">
          <label>🎞️ Gerçek video yükle</label>
          <input type="file"
            accept="video/*"
            onchange="attachVideo(${i},this)">
        </div>

        <div class="field full">
          <label>🔊 Ses dosyası yükle — MP3/WAV/M4A/WebM</label>
          <input type="file"
            accept="audio/*"
            onchange="attachAudio(${i},this)">
        </div>

      </div>

      <div class="duration">
        🔊 Ses süresi: ${formatTime(s.duration)}
      </div>

      <div class="actions">

        <button class="small primary"
          onclick="selectedScene=${i};speakSelected()">
          ▶️ Seslendir
        </button>

        <button class="small orange"
          onclick="selectedScene=${i};recordSelected()">
          🔴 Kaydet
        </button>

        <button class="small"
          onclick="selectedScene=${i}">
          🎯 Seç
        </button>

        <button class="small"
          onclick="moveScene(${i},-1)">
          ⬆️
        </button>

        <button class="small"
          onclick="moveScene(${i},1)">
          ⬇️
        </button>

        <button class="small red"
          onclick="deleteScene(${i})">
          🗑️ Sil
        </button>

      </div>

      <div class="preview">

        ${
          s.videoURL
          ?
          `<video src="${s.videoURL}" controls></video>`
          :
          s.imageURL
          ?
          `<img src="${s.imageURL}">`
          :
          `<span style="color:#777">Görsel/video yok</span>`
        }

      </div>
    `;

    box.appendChild(div);
  });

  updateTotalInfo();
}

/* =========================================================
   TOTAL INFO
========================================================= */

function updateTotalInfo(){

  const total=getTotalDuration();

  $("renderStatus").textContent=
    "Hazır.\n"+
    "Sahne sayısı: "+scenes.length+"\n"+
    "Toplam ses süresi: "+formatTime(total);
}

/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(str){

  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}

function escapeAttr(str){

  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}

/* =========================================================
   SPEECH
========================================================= */

function speakSelected(){

  if(!scenes.length){

    alert("Önce sahne oluştur.");
    return;
  }

  const s=scenes[selectedScene];

  if(!s){
    alert("Sahne bulunamadı.");
    return;
  }

  const text=s.narration||s.subtitle;

  if(!text){

    alert("Bu sahnede seslendirilecek metin yok.");
    return;
  }

  speechSynthesis.cancel();

  const utter=new SpeechSynthesisUtterance(text);

  const index=Number($("voiceSelect").value);

  if(voices[index]){
    utter.voice=voices[index];
  }

  utter.lang="de-DE";
  utter.rate=Number($("rate").value)||0.95;
  utter.pitch=1;

  utter.onstart=()=>{

    speaking=true;

    $("voiceStatus").textContent=
      "🎙️ Sahne "+(selectedScene+1)+" seslendiriliyor...";
  };

  utter.onend=()=>{

    speaking=false;

    $("voiceStatus").textContent=
      "✅ Seslendirme tamamlandı.\n"+
      "Kaydetmek için 'Seslendirmeyi Kaydet' düğmesini kullan.";
  };

  utter.onerror=e=>{

    speaking=false;

    $("voiceStatus").textContent=
      "❌ Seslendirme hatası: "+e.error;
  };

  speechSynthesis.speak(utter);
}

function stopSpeech(){

  speechSynthesis.cancel();

  speaking=false;

  $("voiceStatus").textContent="⏹️ Seslendirme durduruldu.";
}

/* =========================================================
   RECORD SPEECH
========================================================= */

async function recordSelected(){

  if(!scenes.length){

    alert("Önce sahne oluştur.");
    return;
  }

  const scene=scenes[selectedScene];

  if(!scene){
    alert("Sahne bulunamadı.");
    return;
  }

  const text=scene.narration||scene.subtitle;

  if(!text){

    alert("Bu sahnede seslendirilecek metin yok.");
    return;
  }

  if(!navigator.mediaDevices ||
     !navigator.mediaDevices.getDisplayMedia){

    alert(
      "Tarayıcınız sekme sesi kaydını desteklemiyor.\n\n"+
      "Chrome güncel sürüm veya HTTPS/localhost kullanmayı deneyin."
    );

    return;
  }

  try{

    $("voiceStatus").textContent=
      "🔴 Kayıt başlatılıyor...\n"+
      "Paylaşım ekranında 'Bu sekme' ve 'Sekme sesini paylaş' seç.";

    const stream=
      await navigator.mediaDevices.getDisplayMedia({
        video:true,
        audio:true
      });

    const audioTracks=
      stream.getAudioTracks();

    if(!audioTracks.length){

      stream.getTracks().forEach(t=>t.stop());

      alert(
        "Sekme sesi alınamadı.\n\n"+
        "Paylaşım ekranında mutlaka:\n"+
        "• Bu sekme\n"+
        "• Sekme sesini paylaş\n"+
        "seçeneklerini aç."
      );

      return;
    }

    const audioStream=
      new MediaStream(audioTracks);

    const chunks=[];

    let mime="audio/webm;codecs=opus";

    if(!MediaRecorder.isTypeSupported(mime)){
      mime="audio/webm";
    }

    const recorder=
      new MediaRecorder(audioStream,{mimeType:mime});

    recorder.ondataavailable=e=>{

      if(e.data && e.data.size){
        chunks.push(e.data);
      }
    };

    recorder.onstop=()=>{

      const blob=
        new Blob(chunks,{type:mime});

      const file=
        new File(
          [blob],
          "Mina_Sahne_"+(selectedScene+1)+".webm",
          {type:mime}
        );

      scene.audioFile=file;

      if(scene.audioURL){
        try{URL.revokeObjectURL(scene.audioURL)}catch(e){}
      }

      scene.audioURL=
        URL.createObjectURL(file);

      const audio=new Audio();

      audio.preload="metadata";

      audio.onloadedmetadata=()=>{

        scene.duration=
          Number(audio.duration)||0;

        renderScenes();

        $("voiceStatus").textContent=
          "✅ Sahne "+(selectedScene+1)+
          " kaydedildi.\n"+
          "Süre: "+formatTime(scene.duration);
      };

      audio.src=scene.audioURL;

      stream.getTracks().forEach(t=>t.stop());
    };

    recorder.start();

    $("voiceStatus").textContent=
      "🔴 Sahne "+(selectedScene+1)+
      " seslendiriliyor ve kaydediliyor...";

    const utter=
      new SpeechSynthesisUtterance(text);

    const vi=Number($("voiceSelect").value);

    if(voices[vi]){
      utter.voice=voices[vi];
    }

    utter.lang="de-DE";
    utter.rate=Number($("rate").value)||0.95;
    utter.pitch=1;

    utter.onend=()=>{

      setTimeout(()=>{

        if(recorder.state!=="inactive"){
          recorder.stop();
        }

      },500);
    };

    utter.onerror=()=>{

      if(recorder.state!=="inactive"){
        recorder.stop();
      }
    };

    speechSynthesis.cancel();

    speechSynthesis.speak(utter);

  }catch(err){

    console.error(err);

    $("voiceStatus").textContent=
      "❌ Kayıt başlatılamadı:\n"+
      err.message;
  }
}

/* =========================================================
   AUDIO BUFFER
========================================================= */

async function decodeAudioFile(ctx,file){

  const arr=
    await file.arrayBuffer();

  const copy=
    arr.slice(0);

  return await ctx.decodeAudioData(copy);
}

/* =========================================================
   MASTER AUDIO
========================================================= */

async function createMasterAudio(ctx){

  const audioScenes=
    scenes.filter(s=>
      s.audioFile &&
      s.duration>0
    );

  if(!audioScenes.length){
    return null;
  }

  let sampleRate=
    ctx.sampleRate;

  const buffers=[];

  for(const s of audioScenes){

    const buffer=
      await decodeAudioFile(ctx,s.audioFile);

    buffers.push({
      scene:s,
      buffer
    });
  }

  let totalFrames=0;

  for(const item of buffers){

    totalFrames+=
      Math.ceil(
        item.scene.duration*sampleRate
      );
  }

  const channels=2;

  const master=
    ctx.createBuffer(
      channels,
      Math.max(1,totalFrames),
      sampleRate
    );

  let offset=0;

  for(const item of buffers){

    const b=item.buffer;

    const frames=
      Math.min(
        b.length,
        master.length-offset
      );

    for(let ch=0;ch<channels;ch++){

      const src=
        b.getChannelData(
          Math.min(ch,b.numberOfChannels-1)
        );

      const dst=
        master.getChannelData(ch);

      dst.set(
        src.subarray(0,frames),
        offset
      );
    }

    offset+=frames;
  }

  return {
    buffer:master,
    duration:master.duration
  };
}

/* =========================================================
   DRAW
========================================================= */

function drawImageCover(ctx,img,w,h){

  const iw=img.videoWidth||img.naturalWidth||img.width;
  const ih=img.videoHeight||img.naturalHeight||img.height;

  if(!iw || !ih) return;

  const scale=Math.max(w/iw,h/ih);

  const dw=iw*scale;
  const dh=ih*scale;

  const x=(w-dw)/2;
  const y=(h-dh)/2;

  ctx.drawImage(img,x,y,dw,dh);
}

function drawScene(ctx,scene,w,h,progress){

  ctx.fillStyle="#05070a";
  ctx.fillRect(0,0,w,h);

  if(scene.videoURL){

    const video=scene._renderVideo;

    if(video){

      if(video.readyState>=2){

        try{
          drawImageCover(ctx,video,w,h);
        }catch(e){}
      }
    }

  }else if(scene.imageURL){

    const img=scene._renderImage;

    if(img && img.complete){

      const iw=img.naturalWidth;
      const ih=img.naturalHeight;

      if(iw && ih){

        const scale=
          Math.max(w/iw,h/ih)*
          (1+progress*0.05);

        const dw=iw*scale;
        const dh=ih*scale;

        const x=
          (w-dw)/2 -
          progress*20;

        const y=
          (h-dh)/2;

        ctx.drawImage(
          img,
          x,y,dw,dh
        );
      }

    }

  }

  /* karartma */

  ctx.fillStyle="rgba(0,0,0,.18)";
  ctx.fillRect(0,0,w,h);

  /* subtitle */

  const subtitle=
    scene.subtitle||"";

  if(subtitle){

    const maxWidth=w*0.82;

    const fontSize=
      Math.max(22,Math.round(w*0.025));

    ctx.font=
      "bold "+fontSize+"px Arial";

    ctx.textAlign="center";
    ctx.textBaseline="middle";

    const words=
      subtitle.split(/\s+/);

    const lines=[];
    let line="";

    for(const word of words){

      const test=
        line?line+" "+word:word;

      if(ctx.measureText(test).width>maxWidth){

        if(line) lines.push(line);

        line=word;

      }else{

        line=test;
      }
    }

    if(line) lines.push(line);

    const lineH=fontSize*1.35;

    const totalH=
      lines.length*lineH;

    const baseY=
      h-totalH-55;

    ctx.fillStyle="rgba(0,0,0,.65)";

    const boxH=totalH+30;

    ctx.fillRect(
      w*.08,
      baseY-15,
      w*.84,
      boxH
    );

    ctx.fillStyle="#fff";

    lines.forEach((line,i)=>{

      ctx.fillText(
        line,
        w/2,
        baseY+i*lineH+lineH/2
      );

    });
  }
}

/* =========================================================
   RENDER
========================================================= */

async function renderFinal(){

  if(renderRecorder){

    alert("Zaten render yapılıyor.");
    return;
  }

  /* EN ÖNEMLİ DÜZELTME:
     Render başlamadan önce süreleri yeniden hesapla.
  */

  await refreshAllAudioDurations();

  const totalDuration=
    getTotalDuration();

  if(totalDuration<=0){

    alert(
      "Render yapılamıyor.\n\n"+
      "Hiçbir sahnede kullanılabilir ses süresi yok."
    );

    return;
  }

  const validScenes=
    scenes.filter(s=>
      s.duration>0 &&
      s.audioFile
    );

  if(!validScenes.length){

    alert(
      "Ses dosyası bulunan sahne yok."
    );

    return;
  }

  renderCancelled=false;

  $("progressBox").style.display="block";
  $("downloadVideo").classList.add("hidden");
  $("finalVideo").classList.add("hidden");

  $("renderStatus").textContent=
    "Render hazırlanıyor...\n"+
    "Toplam süre: "+formatTime(totalDuration);

  const size=getCanvasSize();

  const canvas=document.createElement("canvas");

  canvas.width=size.w;
  canvas.height=size.h;

  const ctx=canvas.getContext("2d");

  const fps=
    Number($("fps").value)||30;

  const videoStream=
    canvas.captureStream(fps);

  /* AUDIO */

  const audioCtx=
    new (window.AudioContext||
         window.webkitAudioContext)();

  if(audioCtx.state==="suspended"){
    await audioCtx.resume();
  }

  const master=
    await createMasterAudio(audioCtx);

  if(!master){

    alert("Master ses oluşturulamadı.");
    return;
  }

  const destination=
    audioCtx.createMediaStreamDestination();

  const source=
    audioCtx.createBufferSource();

  source.buffer=master.buffer;

  source.connect(destination);

  const combined=
    new MediaStream();

  videoStream.getVideoTracks().forEach(t=>{
    combined.addTrack(t);
  });

  destination.stream.getAudioTracks().forEach(t=>{
    combined.addTrack(t);
  });

  /* MIME */

  let mime="video/webm;codecs=vp8,opus";

  if(!MediaRecorder.isTypeSupported(mime)){
    mime="video/webm";
  }

  if(!MediaRecorder.isTypeSupported(mime)){

    alert("Tarayıcı WebM kayıt formatını desteklemiyor.");
    return;
  }

  const chunks=[];

  renderRecorder=
    new MediaRecorder(
      combined,
      {
        mimeType:mime,
        videoBitsPerSecond:
          Number($("bitrate").value)||4000000
      }
    );

  renderRecorder.ondataavailable=e=>{

    if(e.data && e.data.size){
      chunks.push(e.data);
    }
  };

  renderRecorder.onerror=e=>{

    $("renderStatus").textContent=
      "❌ Render hatası.";
  };

  renderRecorder.onstop=async()=>{

    renderRecorder=null;

    const blob=
      new Blob(
        chunks,
        {type:mime}
      );

    const url=
      URL.createObjectURL(blob);

    $("finalVideo").src=url;

    $("finalVideo").classList.remove("hidden");

    const dl=$("downloadVideo");

    dl.href=url;

    dl.download=
      ($("projectName").value||"GeldStory")+
      "_Final.webm";

    dl.classList.remove("hidden");

    $("renderStatus").textContent=
      "✅ Render tamamlandı.\n"+
      "Toplam süre: "+
      formatTime(totalDuration)+
      "\nDosya boyutu: "+
      (blob.size/1024/1024).toFixed(2)+
      " MB";

    $("progressInner").style.width="100%";

    try{
      audioCtx.close();
    }catch(e){}

  };

  /* Görselleri yükle */

  for(const s of scenes){

    if(s.imageURL){

      const img=new Image();

      img.src=s.imageURL;

      try{
        await img.decode();
      }catch(e){}

      s._renderImage=img;
    }

    if(s.videoURL){

      const video=document.createElement("video");

      video.src=s.videoURL;

      video.muted=true;
      video.playsInline=true;
      video.preload="auto";

      try{
        await video.play();
      }catch(e){}

      s._renderVideo=video;
    }
  }

  renderRecorder.start(250);

  /* SESİ BAŞLAT */

  source.start(0);

  const renderStart=
    performance.now();

  let sceneIndex=0;

  let sceneStart=0;

  let lastTime=performance.now();

  function frame(){

    if(renderCancelled){

      try{
        renderRecorder.stop();
      }catch(e){}

      combined.getTracks().forEach(t=>t.stop());

      return;
    }

    const now=
      performance.now();

    const elapsed=
      (now-renderStart)/1000;

    /* Sahne seç */

    while(
      sceneIndex<scenes.length-1 &&
      elapsed>=sceneStart+
      getSceneDuration(scenes[sceneIndex])
    ){

      sceneStart+=
        getSceneDuration(
          scenes[sceneIndex]
        );

      sceneIndex++;
    }

    const current=
      scenes[sceneIndex];

    const sceneDuration=
      getSceneDuration(current);

    const local=
      elapsed-sceneStart;

    const progress=
      sceneDuration>0
      ?
      Math.min(
        1,
        Math.max(
          0,
          local/sceneDuration
        )
      )
      :0;

    drawScene(
      ctx,
      current,
      size.w,
      size.h,
      progress
    );

    /* ilerleme */

    const percent=
      Math.min(
        100,
        (elapsed/totalDuration)*100
      );

    $("progressInner").style.width=
      percent.toFixed(2)+"%";

    $("renderText").textContent=
      "🎬 Render: Sahne "+
      (sceneIndex+1)+
      "/"+
      scenes.length+
      " • "+
      formatTime(elapsed)+
      " / "+
      formatTime(totalDuration);

    $("renderStatus").textContent=
      "🎬 Render devam ediyor...\n"+
      "Sahne: "+
      (sceneIndex+1)+
      "/"+
      scenes.length+
      "\nGeçen: "+
      formatTime(elapsed)+
      "\nToplam: "+
      formatTime(totalDuration);

    if(elapsed>=totalDuration){

      drawScene(
        ctx,
        scenes[scenes.length-1],
        size.w,
        size.h,
        1
      );

      setTimeout(()=>{

        try{
          renderRecorder.stop();
        }catch(e){}

        combined.getTracks().forEach(t=>{

          try{t.stop()}catch(e){}

        });

      },200);

      return;
    }

    lastTime=now;

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
}

/* =========================================================
   REFRESH AUDIO DURATIONS
========================================================= */

async function refreshAllAudioDurations(){

  const promises=[];

  scenes.forEach((scene,i)=>{

    if(!scene.audioFile && !scene.audioURL){
      return;
    }

    promises.push(
      new Promise(resolve=>{

        const audio=new Audio();

        audio.preload="metadata";

        audio.onloadedmetadata=()=>{

          if(Number.isFinite(audio.duration) &&
             audio.duration>0){

            scenes[i].duration=
              audio.duration;
          }

          resolve();
        };

        audio.onerror=()=>resolve();

        audio.src=
          scene.audioURL ||
          URL.createObjectURL(scene.audioFile);

      })
    );
  });

  await Promise.all(promises);

  renderScenes();
}

/* =========================================================
   STOP RENDER
========================================================= */

function stopRender(){

  renderCancelled=true;

  if(renderRecorder){

    try{
      renderRecorder.stop();
    }catch(e){}

  }

  $("renderStatus").textContent=
    "⛔ Render durduruldu.";

  $("progressBox").style.display="none";
}
