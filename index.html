<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kârım Ne?</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;
    padding: 20px;
}

.container {
    max-width: 500px;
    margin: auto;
}

.card {
    background: white;
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

h1 {
    text-align: center;
    margin-top: 0;
    color: #333;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 25px;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 6px;
    font-weight: bold;
    color: #333;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: #667eea;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #5568d9;
}

.result {
    margin-top: 25px;
    padding: 20px;
    border-radius: 15px;
    background: #f5f5f5;
}

.result p {
    display: flex;
    justify-content: space-between;
    margin: 10px 0;
}

.net {
    font-size: 24px;
    font-weight: bold;
    margin-top: 15px !important;
    padding-top: 15px;
    border-top: 2px solid #ddd;
}

.positive {
    color: green;
}

.negative {
    color: red;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>💰 Kârım Ne?</h1>

<div class="subtitle">
Ürünün gerçek kârını saniyeler içinde hesapla
</div>

<label>Alış Fiyatı (₺)</label>
<input type="number" id="alis" placeholder="Örn: 500">

<label>Satış Fiyatı (₺)</label>
<input type="number" id="satis" placeholder="Örn: 900">

<label>Komisyon (%)</label>
<input type="number" id="komisyon" placeholder="Örn: 10">

<label>Kargo (₺)</label>
<input type="number" id="kargo" placeholder="Örn: 50">

<label>Diğer Giderler (₺)</label>
<input type="number" id="diger" placeholder="Örn: 20">

<label>Satış Adedi</label>
<input type="number" id="adet" value="1" min="1">

<button onclick="hesapla()">🧮 Kârımı Hesapla</button>

<div class="result" id="sonuc">

<p>
<span>Komisyon:</span>
<strong id="komisyonSonuc">0 ₺</strong>
</p>

<p>
<span>Toplam gider:</span>
<strong id="giderSonuc">0 ₺</strong>
</p>

<p>
<span>Tek ürün kârı:</span>
<strong id="tekKar">0 ₺</strong>
</p>

<p>
<span>Kâr oranı:</span>
<strong id="karOrani">%0</strong>
</p>

<p class="net">
<span>Toplam kâr:</span>
<strong id="toplamKar">0 ₺</strong>
</p>

</div>

</div>
</div>

<script>

function hesapla() {

    let alis = Number(document.getElementById("alis").value) || 0;
    let satis = Number(document.getElementById("satis").value) || 0;
    let komisyon = Number(document.getElementById("komisyon").value) || 0;
    let kargo = Number(document.getElementById("kargo").value) || 0;
    let diger = Number(document.getElementById("diger").value) || 0;
    let adet = Number(document.getElementById("adet").value) || 1;

    let komisyonTutari = satis * komisyon / 100;

    let toplamGider = alis + komisyonTutari + kargo + diger;

    let tekKar = satis - toplamGider;

    let karOrani = alis > 0 ? (tekKar / alis) * 100 : 0;

    let toplamKar = tekKar * adet;

    document.getElementById("komisyonSonuc").innerText =
        komisyonTutari.toFixed(2) + " ₺";

    document.getElementById("giderSonuc").innerText =
        toplamGider.toFixed(2) + " ₺";

    document.getElementById("tekKar").innerText =
        tekKar.toFixed(2) + " ₺";

    document.getElementById("karOrani").innerText =
        "%" + karOrani.toFixed(2);

    document.getElementById("toplamKar").innerText =
        toplamKar.toFixed(2) + " ₺";

    let toplamKarElement = document.getElementById("toplamKar");

    if (toplamKar >= 0) {
        toplamKarElement.className = "positive";
    } else {
        toplamKarElement.className = "negative";
    }
}

</script>

</body>
</html>
