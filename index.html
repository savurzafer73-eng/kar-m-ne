<script>

/* =========================================================
   BATAK ROYALE
   TEK DOSYA SÜRÜMÜ
   ========================================================= */


/* ---------- CONSTANTS ---------- */

const SUITS = ["♠","♥","♦","♣"];

const SUIT_ORDER = {
    "♠":0,
    "♥":1,
    "♦":2,
    "♣":3
};

const RANKS = [
    {name:"2",value:2},
    {name:"3",value:3},
    {name:"4",value:4},
    {name:"5",value:5},
    {name:"6",value:6},
    {name:"7",value:7},
    {name:"8",value:8},
    {name:"9",value:9},
    {name:"10",value:10},
    {name:"J",value:11},
    {name:"Q",value:12},
    {name:"K",value:13},
    {name:"A",value:14}
];

const NAMES = [
    "SEN",
    "RAKİP 1",
    "PARTNER",
    "RAKİP 2"
];


/* ---------- STATE ---------- */

let S = {
    team:false,
    round:1,

    deck:[],
    hands:[[],[],[],[]],

    bidder:0,
    bidStep:0,
    currentBid:0,

    trump:null,

    turn:0,
    leadSuit:null,

    trick:[],

    tricks:[0,0,0,0],

    scoreA:0,
    scoreB:0,

    playing:false,
    paused:false
};

let soundOn = true;
let audioCtx = null;


/* ---------- AUDIO ---------- */

function beep(freq=500,duration=.07,type="sine"){

    if(!soundOn) return;

    try{

        if(!audioCtx){
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = type;
        osc.frequency.value = freq;

        gain.gain.setValueAtTime(.0001,audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(.08,audioCtx.currentTime+.01);
        gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime+duration+.02);

    }catch(e){}
}


function toggleSound(){

    soundOn = !soundOn;

    document.getElementById("soundText").textContent =
        soundOn ? "AÇIK" : "KAPALI";

    if(soundOn) beep(700,.08);

}


/* ---------- HELPERS ---------- */

function compareCards(a,b){

    if(a.suit !== b.suit){
        return SUIT_ORDER[a.suit] - SUIT_ORDER[b.suit];
    }

    return b.value - a.value;
}


function cardName(c){
    return c.name + c.suit;
}


function makeDeck(){

    const deck = [];

    for(const suit of SUITS){

        for(const r of RANKS){

            deck.push({
                suit:suit,
                name:r.name,
                value:r.value
            });

        }

    }

    return deck;
}


function shuffle(deck){

    for(let i=deck.length-1;i>0;i--){

        const j=Math.floor(Math.random()*(i+1));

        const temp=deck[i];
        deck[i]=deck[j];
        deck[j]=temp;

    }

    return deck;
}


function sleep(ms){
    return new Promise(resolve=>setTimeout(resolve,ms));
}


/* ---------- MENU ---------- */

function startGame(team){

    beep(600,.08);

    S = {
        team:team,
        round:1,

        deck:[],
        hands:[[],[],[],[]],

        bidder:0,
        bidStep:0,
        currentBid:0,

        trump:null,

        turn:0,
        leadSuit:null,

        trick:[],

        tricks:[0,0,0,0],

        scoreA:0,
        scoreB:0,

        playing:false,
        paused:false
    };

    document.getElementById("menu").style.display="none";
    document.getElementById("game").style.display="block";

    startRound();

}


function backMenu(){

    document.getElementById("pauseOverlay").classList.remove("show");
    document.getElementById("resultOverlay").classList.remove("show");
    document.getElementById("bidOverlay").classList.remove("show");
    document.getElementById("trumpOverlay").classList.remove("show");

    document.getElementById("game").style.display="none";
    document.getElementById("menu").style.display="flex";

}


/* ---------- ROUND ---------- */

function startRound(){

    S.deck=shuffle(makeDeck());

    S.hands=[[],[],[],[]];

    for(let i=0;i<52;i++){

        S.hands[i%4].push(S.deck[i]);

    }

    for(let p=0;p<4;p++){
        S.hands[p].sort(compareCards);
    }

    S.bidder=(S.round-1)%4;
    S.bidStep=0;
    S.currentBid=0;

    S.trump=null;
    S.turn=0;
    S.leadSuit=null;
    S.trick=[];
    S.tricks=[0,0,0,0];
    S.playing=false;

    clearPlayedCards();

    updateTop();

    renderHands();

    document.getElementById("resultOverlay").classList.remove("show");
    document.getElementById("trumpOverlay").classList.remove("show");

    startAuction();

}


/* ---------- RENDER HANDS ---------- */

function createCardElement(card,player,index){

    const el=document.createElement("div");

    el.className="card";

    if(card.suit==="♥" || card.suit==="♦"){
        el.classList.add("red");
    }

    el.innerHTML=
        '<div class="corner">'+
            card.name+
            '<br>'+
            card.suit+
        '</div>'+
        '<div class="bigSuit">'+card.suit+'</div>';

    if(
        player===0 &&
        S.playing &&
        canPlayCard(0,index)
    ){
        el.classList.add("playable");

        el.onclick=function(){
            playCard(0,index);
        };
    }

    if(
        player===2 &&
        S.team &&
        S.playing &&
        S.turn===2 &&
        canPlayCard(2,index)
    ){
        el.classList.add("playable");

        el.onclick=function(){
            playCard(2,index);
        };
    }

    return el;
}


function renderHands(){

    const p1=document.getElementById("playerRow1");
    const p2=document.getElementById("playerRow2");

    const t1=document.getElementById("partnerRow1");
    const t2=document.getElementById("partnerRow2");

    p1.innerHTML="";
    p2.innerHTML="";
    t1.innerHTML="";
    t2.innerHTML="";

    const player=S.hands[0];

    player.forEach((card,i)=>{

        const el=createCardElement(card,0,i);

        if(i<6) p1.appendChild(el);
        else p2.appendChild(el);

    });


    if(S.team){

        const partner=S.hands[2];

        partner.forEach((card,i)=>{

            const el=createCardElement(card,2,i);

            if(i<6) t1.appendChild(el);
            else t2.appendChild(el);

        });

    }

}


/* ---------- TOP UI ---------- */

function updateTop(){

    document.getElementById("roundText").textContent=S.round;

    document.getElementById("trumpText").textContent=
        S.trump || "—";

    document.getElementById("scoreText").textContent=
        S.scoreA+" - "+S.scoreB;

}


/* ---------- AUCTION ---------- */

function startAuction(){

    document.getElementById("bidOverlay").classList.add("show");

    updateBidUI();

}


function updateBidUI(){

    const name=NAMES[S.bidder];

    document.getElementById("bidTurnName").textContent=
        name+" ihalede";

    if(S.bidder===0){

        enableBidButtons(true);

    }else{

        enableBidButtons(false);

        setTimeout(aiBid,650);

    }

}


function enableBidButtons(enabled){

    document.querySelectorAll(".bidBtn").forEach(btn=>{
        btn.disabled=!enabled;
        btn.style.opacity=enabled ? "1" : ".45";
    });

}


function playerBid(value){

    if(S.bidder!==0) return;

    beep(value===0 ? 260 : 650,.08);

    processBid(0,value);

}


function aiBid(){

    if(S.bidder===0) return;

    const hand=S.hands[S.bidder];

    let strength=0;

    for(const c of hand){

        if(c.value>=13) strength++;

        if(c.value===14) strength++;

    }

    let bid=0;

    if(strength>=7) bid=8;
    else if(strength>=5) bid=7;
    else if(strength>=3) bid=6;
    else bid=0;

    if(bid>0 && bid<=S.currentBid){
        bid=0;
    }

    processBid(S.bidder,bid);

}


function processBid(player,bid){

    if(bid>0){

        if(bid<=S.currentBid){

            toast("Daha yüksek ihale vermelisin");
            return;

        }

        S.currentBid=bid;
        S.bidder=player;

        toast(
            NAMES[player]+" "+bid+" aldı"
        );

    }

    S.bidStep++;

    if(S.bidStep>=4){

        finishAuction();
        return;

    }

    let next=(player+1)%4;

    S.bidder=next;

    updateBidUI();

}


function finishAuction(){

    document.getElementById("bidOverlay").classList.remove("show");

    if(S.currentBid===0){

        S.bidder=0;
        S.currentBid=5;

        toast("Herkes pas geçti — ihale sana 5");

        setTimeout(()=>{
            openTrumpFor(0);
        },700);

        return;
    }

    toast(
        NAMES[S.bidder]+" ihaleyi "+S.currentBid+" ile aldı"
    );

    setTimeout(()=>{

        openTrumpFor(S.bidder);

    },800);

}


/* ---------- TRUMP ---------- */

function openTrumpFor(player){

    if(player===0){

        document.getElementById("trumpOverlay").classList.add("show");

    }else{

        aiTrump(player);

    }

}


function chooseTrump(suit){

    S.trump=suit;

    document.getElementById("trumpOverlay").classList.remove("show");

    beep(800,.1);

    toast("Koz: "+suit);

    startPlay();

}


function aiTrump(player){

    const counts={
        "♠":0,
        "♥":0,
        "♦":0,
        "♣":0
    };

    for(const c of S.hands[player]){
        counts[c.suit]++;
    }

    let best=SUITS[0];

    for(const suit of SUITS){

        if(counts[suit]>counts[best]){
            best=suit;
        }

    }

    S.trump=best;

    toast(
        NAMES[player]+" koz seçti: "+best
    );

    setTimeout(startPlay,800);

}


/* ---------- PLAY START ---------- */

function startPlay(){

    S.playing=true;

    S.turn=S.bidder;

    S.trick=[];
    S.leadSuit=null;

    updateTop();

    renderHands();

    setTimeout(nextTurn,500);

}


/* ---------- VALID CARD ---------- */

function canPlayCard(player,index){

    if(!S.playing) return false;

    if(S.turn!==player) return false;

    const hand=S.hands[player];

    if(index<0 || index>=hand.length) return false;

    if(!S.leadSuit) return true;

    const card=hand[index];

    const hasLead=hand.some(c=>c.suit===S.leadSuit);

    if(hasLead){
        return card.suit===S.leadSuit;
    }

    return true;

}


/* ---------- NEXT TURN ---------- */

function nextTurn(){

    if(!S.playing) return;

    if(S.paused) return;

    if(S.trick.length>=4) return;

    const p=S.turn;

    /* USER */

    if(p===0){

        renderHands();

        return;

    }

    /* PARTNER IN TEAM MODE */

    if(p===2 && S.team){

        renderHands();

        toast("PARTNER KARTINI SEN OYNA");

        return;

    }

    /* AI */

    setTimeout(()=>{

        const index=chooseAICard(p);

        playCard(p,index);

    },650);

}


/* ---------- AI CARD ---------- */

function chooseAICard(player){

    const hand=S.hands[player];

    const valid=[];

    for(let i=0;i<hand.length;i++){

        if(canPlayCard(player,i)){
            valid.push(i);
        }

    }

    if(valid.length===0) return 0;

    /* Basit ama kontrollü AI */

    if(!S.leadSuit){

        let best=valid[0];

        for(const i of valid){

            if(hand[i].value>hand[best].value){
                best=i;
            }

        }

        return best;
    }

    /* Önce kozla kazanma denemesi */

    let winning=[];

    for(const i of valid){

        if(cardBeats(hand[i],currentWinningCard())){
            winning.push(i);
        }

    }

    if(winning.length){

        let best=winning[0];

        for(const i of winning){

            if(hand[i].value<hand[best].value){
                best=i;
            }

        }

        return best;
    }

    /* Kazanamıyorsa en düşük kart */

    let low=valid[0];

    for(const i of valid){

        if(hand[i].value<hand[low].value){
            low=i;
        }

    }

    return low;

}


function currentWinningCard(){

    if(S.trick.length===0) return null;

    let best=S.trick[0];

    for(let i=1;i<S.trick.length;i++){

        if(cardBeats(S.trick[i].card,best.card)){
            best=S.trick[i];
        }

    }

    return best.card;
}


function cardBeats(a,b){

    if(!b) return true;

    if(a.suit===b.suit){
        return a.value>b.value;
    }

    if(a.suit===S.trump && b.suit!==S.trump){
        return true;
    }

    if(a.suit!==S.trump && b.suit===S.trump){
        return false;
    }

    if(a.suit===S.leadSuit && b.suit!==S.leadSuit){
        return true;
    }

    return false;

}


/* ---------- PLAY CARD ---------- */

async function playCard(player,index){

    if(!canPlayCard(player,index)){

        if(player===0 || (player===2 && S.team)){
            toast("Bu kartı oynayamazsın");
            beep(180,.06);
        }

        return;

    }

    const card=S.hands[player][index];

    if(!S.leadSuit){
        S.leadSuit=card.suit;
    }

    S.hands[player].splice(index,1);

    S.trick.push({
        player:player,
        card:card
    });

    renderHands();

    showPlayedCard(player,card);

    beep(520 + player*80,.07);

    toast(
        NAMES[player]+" → "+cardName(card)
    );

    S.turn=(player+1)%4;

    if(S.trick.length===4){

        await sleep(700);

        resolveTrick();

        return;

    }

    await sleep(400);

    nextTurn();

}


/* ---------- CENTER CARD ---------- */

function showPlayedCard(player,card){

    const el=document.getElementById("played"+player);

    el.className="played";

    if(card.suit==="♥" || card.suit==="♦"){
        el.classList.add("red");
    }

    el.classList.add("p"+player);

    el.innerHTML=
        '<span class="rank">'+
        card.name+
        card.suit+
        '</span>'+
        '<span>'+card.suit+'</span>';

    /* restart animation */

    void el.offsetWidth;

    el.classList.add("show");

}


/* ---------- TRICK WINNER ---------- */

function resolveTrick(){

    let winner=S.trick[0];

    for(let i=1;i<S.trick.length;i++){

        if(cardBeats(
            S.trick[i].card,
            winner.card
        )){
            winner=S.trick[i];
        }

    }

    const wp=winner.player;

    S.tricks[wp]++;

    document.getElementById("trickName").textContent=
        NAMES[wp]+" ELİ ALDI";

    document.getElementById("trickName").classList.add("show");

    document.getElementById("table");

    document.querySelector(".table").classList.add("winFlash");

    beep(900,.14);

    setTimeout(()=>{

        document.querySelector(".table").classList.remove("winFlash");

        moveCardsToWinner(wp);

    },600);

}


/* ---------- WINNER ANIMATION ---------- */

function moveCardsToWinner(player){

    const directionClass=
        player===0 ? "p0" :
        player===1 ? "p1" :
        player===2 ? "p2" :
        "p3";

    document.querySelectorAll(".played").forEach(el=>{

        if(!el.classList.contains("show")) return;

        el.style.transition=
            "all .5s cubic-bezier(.2,.8,.2,1)";

        if(player===0){
            el.style.transform="translateY(95px) scale(.35)";
        }
        else if(player===1){
            el.style.transform="translateX(100px) scale(.35)";
        }
        else if(player===2){
            el.style.transform="translateY(-95px) scale(.35)";
        }
        else{
            el.style.transform="translateX(-100px) scale(.35)";
        }

        el.style.opacity="0";

    });

    setTimeout(()=>{

        clearPlayedCards();

        document.getElementById("trickName")
            .classList.remove("show");

        if(S.trick.length===4){

            S.trick=[];

        }

        S.leadSuit=null;

        if(
            S.hands[0].length===0 &&
            S.hands[1].length===0 &&
            S.hands[2].length===0 &&
            S.hands[3].length===0
        ){

            finishRound();
            return;

        }

        /* Kazanan bir sonraki eli başlatır */

        S.turn=player;

        renderHands();

        setTimeout(nextTurn,350);

    },550);

}


/* ---------- CLEAR CENTER ---------- */

function clearPlayedCards(){

    for(let i=0;i<4;i++){

        const el=document.getElementById("played"+i);

        el.className="played p"+i;
        el.innerHTML="";
        el.style="";
    }

}


/* ---------- ROUND RESULT ---------- */

function finishRound(){

    S.playing=false;

    let teamA;
    let teamB;

    if(S.team){

        teamA=S.tricks[0]+S.tricks[2];
        teamB=S.tricks[1]+S.tricks[3];

    }else{

        teamA=S.tricks[0];
        teamB=S.tricks[1]+S.tricks[2]+S.tricks[3];

    }

    if(S.team){

        S.scoreA += teamA;
        S.scoreB += teamB;

    }else{

        S.scoreA += teamA;
        S.scoreB += teamB;

    }

    updateTop();

    let title="EL BİTTİ";

    if(teamA>teamB){
        title="🏆 SENİN TAKIMIN KAZANDI";
    }
    else if(teamB>teamA){
        title="RAKİPLER KAZANDI";
    }
    else{
        title="BERABERE";
    }

    document.getElementById("resultTitle").textContent=title;

    document.getElementById("resultBig").textContent=
        teamA>teamB ? "🏆" : teamB>teamA ? "😈" : "🤝";

    document.getElementById("resultScore").textContent=
        "Senin takım: "+teamA+
        " el  •  Rakip: "+teamB+" el";

    document.getElementById("resultOverlay")
        .classList.add("show");

}


/* ---------- NEW ROUND ---------- */

function newRound(){

    S.round++;

    document.getElementById("resultOverlay")
        .classList.remove("show");

    startRound();

}


/* ---------- PAUSE ---------- */

function pauseGame(){

    if(S.paused){

        S.paused=false;

        document.getElementById("pauseOverlay")
            .classList.remove("show");

        nextTurn();

    }else{

        S.paused=true;

        document.getElementById("pauseOverlay")
            .classList.add("show");

    }

}


/* ---------- TOAST ---------- */

let toastTimer=null;

function toast(text){

    const el=document.getElementById("toast");

    el.textContent=text;
    el.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer=setTimeout(()=>{

        el.classList.remove("show");

    },1100);

}


/* ---------- INIT ---------- */

document.addEventListener("visibilitychange",function(){

    if(document.hidden && S.playing && !S.paused){

        S.paused=true;

    }

});


</script>
