<script>

/* =========================================================
   MINA VIDEO AI V45.4
   CORE
========================================================= */

const $ = id => document.getElementById(id);

let scenes = [];
let stopRequested = false;
let renderBlob = null;
let currentVideoURL = null;


/* =========================================================
   DEMO STORY
========================================================= */

$("demoStory").onclick = () => {

 $("story").value =
 `Harland Sanders war bereits 65 Jahre alt, als viele Menschen dachten, dass seine Karriere vorbei war.
 Doch Sanders gab nicht auf.
 Er hatte jahrelang in kleinen Restaurants gearbeitet und sein berühmtes Hühnchenrezept entwickelt.
 Als er seine Stelle verlor, begann er erneut.
 Er fuhr von Restaurant zu Restaurant und bot sein Rezept an.
 Viele Menschen lehnten ihn ab.
 Doch eines Tages sagte ein Restaurantbesitzer ja.
 Sein Rezept wurde immer bekannter.
 Sanders gründete schließlich Kentucky Fried Chicken.
 Was wie ein Ende aussah, wurde zu einem neuen Anfang.
 Seine Geschichte zeigt, dass Erfolg manchmal später kommt, als man erwartet.`;

};


/* =========================================================
   STORY SPLITTER
========================================================= */

function splitStory(text,count){

 let clean=text
  .replace(/\s+/g," ")
  .trim();

 if(!clean)return [];

 let sentences=clean.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [clean];

 sentences=sentences
  .map(x=>x.trim())
  .filter(x=>x.length>3);

 let result=[];

 if(sentences.length<=count){

  result=sentences.slice();

  while(result.length<count){

   let longestIndex=0;

   for(let i=1;i<result.length;i++){

    if(result[i].length>result[longestIndex].length)
     longestIndex=i;
   }

   let s=result[longestIndex];
   let words=s.split(" ");

   if(words.length<8)break;

   let mid=Math.floor(words.length/2);

   result.splice(
    longestIndex,
    1,
    words.slice(0,mid).join(" ")+".",
    words.slice(mid).join(" ")
   );

  }

 }else{

  let chunk=Math.ceil(sentences.length/count);

  for(let i=0;i<count;i++){

   let part=sentences.slice(
    i*chunk,
    (i+1)*chunk
   );

   if(part.length)
    result.push(part.join(" "));

  }

 }

 while(result.length<count && result.length>0){

  result.push(result[result.length-1]);

 }

 return result.slice(0,count);
}


/* =========================================================
   COLOR FROM TEXT
========================================================= */

function hashText(text){

 let h=0;

 for(let i=0;i<text.length;i++)
  h=((h<<5)-h)+text.charCodeAt(i)|0;

 return Math.abs(h);
}


/* =========================================================
   SCENE CREATION
========================================================= */

$("makeScenes").onclick=()=>{

 let text=$("story").value.trim();

 if(!text){

  $("status").textContent="Önce hikâyeni gir.";
  return;
 }

 let count=parseInt($("sceneCount").value);

 let parts=splitStory(text,count);

 scenes=parts.map((text,index)=>({

  id:index+1,

  text,

  image:null,

  imageURL:null,

  audio:null,

  audioURL:null,

  audioDuration:0,

  duration:5,

  animation:$("animation").value,

  seed:hashText(text+index)

 }));

 renderSceneEditor();

 $("status").textContent=
  scenes.length+" sahne oluşturuldu.";

};


/* =========================================================
   SCENE EDITOR
========================================================= */

function renderSceneEditor(){

 const box=$("scenes");

 box.innerHTML="";

 scenes.forEach((scene,index)=>{

  let div=document.createElement("div");

  div.className="scene";

  div.innerHTML=`

   <div class="sceneHead">

    <strong>SAHNE ${index+1}</strong>

    <span class="badge">
     ${scene.duration.toFixed(1)} sn
    </span>

   </div>

   <div class="sceneGrid">

    <div>

     <div class="preview">
      <canvas id="preview_${index}"></canvas>
     </div>

     <div style="margin-top:8px">

      <label class="small">
       🖼️ Görsel
      </label>

      <input
       class="file"
       type="file"
       accept="image/*"
       data-image="${index}"
      >

     </div>

     <div style="margin-top:8px">

      <label class="small">
       🔊 Ses
      </label>

      <input
       class="file"
       type="file"
       accept="audio/*"
       data-audio="${index}"
      >

     </div>

    </div>

    <div>

     <label class="small">
      🎙️ Sahne metni
     </label>

     <textarea
      data-text="${index}"
     >${escapeHTML(scene.text)}</textarea>

     <div class="controls">

      <div>
       <label class="small">Animasyon</label>

       <select data-animation="${index}">

        <option value="cinematic">Sinematik</option>
        <option value="zoom">Zoom</option>
        <option value="pan">Pan</option>
        <option value="drift">Drift</option>

       </select>

      </div>

      <div>

       <label class="small">
        Süre (ses yoksa)
       </label>

       <input
        type="number"
        min="1"
        max="60"
        step=".5"
        value="${scene.duration}"
        data-duration="${index}"
       >

      </div>

     </div>

     <div class="small" id="audioInfo_${index}" style="margin-top:8px">
      Ses yüklenmedi
     </div>

    </div>

   </div>
  `;

  box.appendChild(div);

  setTimeout(()=>{
   drawPreview(index);
  },0);

 });


 document.querySelectorAll("[data-image]").forEach(input=>{

  input.onchange=e=>{

   const index=parseInt(e.target.dataset.image);
   const file=e.target.files[0];

   if(!file)return;

   const url=URL.createObjectURL(file);

   scenes[index].image=file;
   scenes[index].imageURL=url;

   drawPreview(index);

  };

 });


 document.querySelectorAll("[data-audio]").forEach(input=>{

  input.onchange=e=>{

   const index=parseInt(e.target.dataset.audio);
   const file=e.target.files[0];

   if(!file)return;

   const url=URL.createObjectURL(file);

   scenes[index].audio=file;
   scenes[index].audioURL=url;

   const audio=new Audio();

   audio.src=url;

   audio.onloadedmetadata=()=>{

    scenes[index].audioDuration=audio.duration;

    scenes[index].duration=
     Math.max(0.5,audio.duration);

    const input=document.querySelector(
     `[data-duration="${index}"]`
    );

    if(input)
     input.value=scenes[index].duration;

    const info=$("audioInfo_"+index);

    if(info)
     info.textContent=
      "🔊 Ses: "+
      audio.duration.toFixed(2)+
      " saniye";

    const badge=document.querySelectorAll(".badge")[index];

    if(badge)
     badge.textContent=
      scenes[index].duration.toFixed(1)+" sn";

   };

  };

 });


 document.querySelectorAll("[data-text]").forEach(input=>{

  input.oninput=e=>{

   let index=parseInt(e.target.dataset.text);

   scenes[index].text=e.target.value;

  };

 });


 document.querySelectorAll("[data-animation]").forEach(input=>{

  input.onchange=e=>{

   let index=parseInt(e.target.dataset.animation);

   scenes[index].animation=e.target.value;

  };

 });


 document.querySelectorAll("[data-duration]").forEach(input=>{

  input.onchange=e=>{

   let index=parseInt(e.target.dataset.duration);

   scenes[index].duration=
    Math.max(1,parseFloat(e.target.value)||5);

  };

 });

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(str){

 return str
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;");

}


/* =========================================================
   CANVAS SIZE
========================================================= */

function getSize(){

 const ratio=$("ratio").value;

 if(ratio==="9:16")
  return {w:720,h:1280};

 if(ratio==="1:1")
  return {w:1080,h:1080};

 return {w:1280,h:720};

}


/* =========================================================
   IMAGE LOAD
========================================================= */

function loadImage(url){

 return new Promise((resolve,reject)=>{

  const img=new Image();

  img.onload=()=>resolve(img);

  img.onerror=reject;

  img.src=url;

 });

}


/* =========================================================
   CINEMATIC BACKGROUND
========================================================= */

function drawBackground(ctx,w,h,scene,t){

 const seed=scene.seed;

 const hue=(seed%360+360)%360;

 let g=ctx.createLinearGradient(
  0,0,
  w,h
 );

 g.addColorStop(
  0,
  `hsl(${hue},30%,10%)`
 );

 g.addColorStop(
  1,
  `hsl(${(hue+70)%360},35%,18%)`
 );

 ctx.fillStyle=g;
 ctx.fillRect(0,0,w,h);

 /*
   Sinematik ışıklar
 */

 for(let i=0;i<5;i++){

  let x=
   (Math.sin(t*.00025*(i+1)+seed)*.5+.5)*w;

  let y=
   (Math.cos(t*.00018*(i+2)+seed)*.5+.5)*h;

  let r=
   120+
   80*Math.sin(t*.0005+i);

  let rg=ctx.createRadialGradient(
   x,y,0,
   x,y,r
  );

  rg.addColorStop(
   0,
   `hsla(${(hue+i*40)%360},70%,60%,.12)`
  );

  rg.addColorStop(
   1,
   `hsla(${hue},70%,40%,0)`
  );

  ctx.fillStyle=rg;
  ctx.fillRect(0,0,w,h);

 }

}


/* =========================================================
   COVER IMAGE
========================================================= */

function drawImageCover(ctx,img,w,h,zoom,offsetX,offsetY){

 const iw=img.width;
 const ih=img.height;

 const scale=
  Math.max(w/iw,h/ih)*zoom;

 const dw=iw*scale;
 const dh=ih*scale;

 const x=
  (w-dw)/2+
  offsetX;

 const y=
  (h-dh)/2+
  offsetY;

 ctx.drawImage(
  img,
  x,
  y,
  dw,
  dh
 );

}


/* =========================================================
   TEXT OVERLAY
========================================================= */

function wrapText(ctx,text,maxWidth){

 const words=text.split(/\s+/);
 let lines=[];
 let line="";

 words.forEach(word=>{

  const test=
   line ? line+" "+word : word;

  if(ctx.measureText(test).width>maxWidth){

   if(line)
    lines.push(line);

   line=word;

  }else{

   line=test;

  }

 });

 if(line)
  lines.push(line);

 return lines;

}


function drawSubtitle(ctx,text,w,h){

 if(!text)return;

 ctx.save();

 const maxWidth=w*.78;

 ctx.font=
  "bold "+
  Math.max(22,w*.025)+
  "px Arial";

 ctx.textAlign="center";
 ctx.textBaseline="middle";

 const lines=wrapText(
  ctx,
  text,
  maxWidth
 );

 const lineHeight=
  Math.max(28,w*.032);

 const totalHeight=
  lines.length*lineHeight;

 const boxHeight=
  totalHeight+30;

 ctx.fillStyle="rgba(0,0,0,.68)";

 roundRect(
  ctx,
  w/2-maxWidth/2-20,
  h*.78-boxHeight/2,
  maxWidth+40,
  boxHeight,
  14
 );

 ctx.fill();

 ctx.fillStyle="#fff";

 lines.forEach((line,i)=>{

  ctx.fillText(
   line,
   w/2,
   h*.78-
   totalHeight/2+
   i*lineHeight+
   lineHeight/2
  );

 });

 ctx.restore();

}


/* =========================================================
   ROUND RECT
========================================================= */

function roundRect(ctx,x,y,w,h,r){

 ctx.beginPath();

 ctx.moveTo(x+r,y);

 ctx.arcTo(
  x+w,y,
  x+w,y+h,
  r
 );

 ctx.arcTo(
  x+w,y+h,
  x,y+h,
  r
 );

 ctx.arcTo(
  x,y+h,
  x,y,
  r
 );

 ctx.arcTo(
  x,y,
  x+w,y,
  r
 );

 ctx.closePath();

}


/* =========================================================
   DRAW SCENE FRAME
========================================================= */

async function drawSceneFrame(
 ctx,w,h,scene,progress,img
){

 const now=
  performance.now();

 drawBackground(
  ctx,
  w,
  h,
  scene,
  now
 );

 let zoom=1;
 let ox=0;
 let oy=0;

 const p=progress;

 let mode=scene.animation;

 if(mode==="random"){

  const modes=[
   "zoom",
   "pan",
   "drift",
   "cinematic"
  ];

  mode=
   modes[
    Math.floor(scene.seed%modes.length)
   ];

 }


 if(mode==="zoom"){

  zoom=
   1+
   p*.12;

 }

 else if(mode==="pan"){

  zoom=1.08;

  ox=
   (p-.5)*w*.08;

 }

 else if(mode==="drift"){

  zoom=1.05;

  ox=
   Math.sin(p*Math.PI*2)*w*.035;

  oy=
   Math.cos(p*Math.PI*2)*h*.025;

 }

 else{

  zoom=
   1.02+
   Math.sin(p*Math.PI)*.08;

  ox=
   Math.sin(p*Math.PI*2)*w*.025;

 }


 if(img){

  ctx.save();

  /*
   Sinematik karartma
  */

  drawImageCover(
   ctx,
   img,
   w,
   h,
   zoom,
   ox,
   oy
  );

  const gradient=
   ctx.createLinearGradient(
    0,0,0,h
   );

  gradient.addColorStop(
   0,
   "rgba(0,0,0,.10)"
  );

  gradient.addColorStop(
   .55,
   "rgba(0,0,0,.05)"
  );

  gradient.addColorStop(
   1,
   "rgba(0,0,0,.55)"
  );

  ctx.fillStyle=gradient;

  ctx.fillRect(0,0,w,h);

  ctx.restore();

 }


 /*
  Sahne numarası
 */

 ctx.save();

 ctx.fillStyle="rgba(0,0,0,.45)";

 roundRect(
  ctx,
  25,
  25,
  105,
  42,
  12
 );

 ctx.fill();

 ctx.fillStyle="#fff";

 ctx.font="bold 18px Arial";

 ctx.fillText(
  "SCENE "+scene.id,
  42,
  52
 );

 ctx.restore();


 /*
  Altyazı
 */

 drawSubtitle(
  ctx,
  scene.text,
  w,
  h
 );

}


/* =========================================================
   PREVIEW
========================================================= */

async function drawPreview(index){

 if(!scenes[index])return;

 const canvas=
  $("preview_"+index);

 if(!canvas)return;

 const size=getSize();

 canvas.width=size.w;
 canvas.height=size.h;

 const ctx=canvas.getContext("2d");

 let img=null;

 if(scenes[index].imageURL){

  try{

   img=
    await loadImage(
     scenes[index].imageURL
    );

  }catch(e){}

 }

 let start=performance.now();

 function loop(){

  if(!document.body.contains(canvas))
   return;

  let elapsed=
   (performance.now()-start)/1000;

  let duration=
   scenes[index].duration;

  let p=
   (elapsed%duration)/duration;

  drawSceneFrame(
   ctx,
   canvas.width,
   canvas.height,
   scenes[index],
   p,
   img
  );

  requestAnimationFrame(loop);

 }

 loop();

}


/* =========================================================
   AUDIO DECODER
========================================================= */

async function decodeAudio(file,ctx){

 const buffer=
  await file.arrayBuffer();

 return await ctx.decodeAudioData(
  buffer.slice(0)
 );

}


/* =========================================================
   RENDER
========================================================= */

$("renderBtn").onclick=
 async()=>{

  if(!scenes.length){

   $("renderStatus").textContent=
    "Önce sahneleri oluştur.";

   return;

  }

  stopRequested=false;

  try{

   await renderVideo();

  }catch(err){

   console.error(err);

   $("renderStatus").textContent=
    "Render hatası: "+err.message;

  }

 };


/* =========================================================
   MAIN VIDEO RENDER
========================================================= */

async function renderVideo(){

 const size=getSize();

 const canvas=document.createElement("canvas");

 canvas.width=size.w;
 canvas.height=size.h;

 const ctx=
  canvas.getContext("2d",{
   alpha:false
  });


 /*
  Video stream
 */

 const videoStream=
  canvas.captureStream(30);


 /*
  Audio context
 */

 const audioCtx=
  new (
   window.AudioContext||
   window.webkitAudioContext
  )();


 const destination=
  audioCtx.createMediaStreamDestination();


 /*
  Her sahnenin seslerini decode et
 */

 const decodedAudios=[];

 for(let i=0;i<scenes.length;i++){

  if(stopRequested)break;

  if(scenes[i].audio){

   try{

    const buffer=
     await decodeAudio(
      scenes[i].audio,
      audioCtx
     );

    decodedAudios[i]=buffer;

    scenes[i].duration=
     buffer.duration;

   }catch(e){

    console.warn(
     "Ses çözülemedi",
     e
    );

   }

  }

 }


 /*
  Stream birleştirme
 */

 const combined=
  new MediaStream();

 videoStream
  .getVideoTracks()
  .forEach(t=>
   combined.addTrack(t)
  );

 destination
  .stream
  .getAudioTracks()
  .forEach(t=>
   combined.addTrack(t)
  );


 /*
  WebM codec seç
 */

 let mime="";

 const codecs=[
  "video/webm;codecs=vp9,opus",
  "video/webm;codecs=vp8,opus",
  "video/webm"
 ];

 for(const c of codecs){

  if(
   MediaRecorder.isTypeSupported(c)
  ){

   mime=c;
   break;

  }

 }

 if(!mime)
  throw new Error(
   "Tarayıcı WebM kayıt desteği vermiyor."
  );


 const recorder=
  new MediaRecorder(
   combined,
   {
    mimeType:mime,
    videoBitsPerSecond:6000000,
    audioBitsPerSecond:128000
   }
  );


 const chunks=[];

 recorder.ondataavailable=e=>{

  if(e.data.size>0)
   chunks.push(e.data);

 };


 const stopped=
  new Promise(resolve=>{

   recorder.onstop=resolve;

  });


 recorder.start(250);


 /*
  Render sahneleri
 */

 let totalDuration=
  scenes.reduce(
   (sum,s)=>
    sum+
    Math.max(
     1,
     s.duration||5
    ),
   0
  );


 let elapsedTotal=0;


 for(let i=0;i<scenes.length;i++){

  if(stopRequested)
   break;

  const scene=scenes[i];

  let duration=
   Math.max(
    1,
    scene.duration||5
   );


  /*
   Görsel
  */

  let img=null;

  if(scene.imageURL){

   try{

    img=
     await loadImage(
      scene.imageURL
    );

   }catch(e){

    img=null;

   }

  }


  /*
   Audio source
  */

  let source=null;

  if(decodedAudios[i]){

   source=
    audioCtx.createBufferSource();

   source.buffer=
    decodedAudios[i];

   source.connect(destination);

   source.start();

  }


  /*
   Render frame loop
  */

  const start=
   performance.now();

  while(true){

   if(stopRequested)
    break;

   const now=
    performance.now();

   const localElapsed=
    (now-start)/1000;

   let p=
    localElapsed/duration;

   if(p>1)p=1;

   await drawSceneFrame(
    ctx,
    size.w,
    size.h,
    scene,
    p,
    img
   );

   /*
    progress
   */

   const overall=
    (
     elapsedTotal+
     Math.min(
      duration,
      localElapsed
     )
    )/
    totalDuration;

   $("progressBar").style.width=
    Math.round(overall*100)+"%";

   $("renderStatus").textContent=
    `🎬 Sahne ${i+1}/${scenes.length} • `+
    `${localElapsed.toFixed(1)} / `+
    `${duration.toFixed(1)} sn`;

   if(localElapsed>=duration)
    break;

   await new Promise(
    r=>requestAnimationFrame(r)
   );

  }


  /*
   Bir sonraki sahneye geçmeden önce
   audio source kapanır.
  */

  if(source){

   try{
    source.stop();
   }catch(e){}

  }

  elapsedTotal+=duration;

 }


 if(recorder.state!=="inactive")
  recorder.stop();

 await stopped;

 audioCtx.close();


 /*
  Video oluştur
 */

 renderBlob=
  new Blob(
   chunks,
   {
    type:mime
   }
  );


 if(currentVideoURL)
  URL.revokeObjectURL(
   currentVideoURL
  );

 currentVideoURL=
  URL.createObjectURL(
   renderBlob
  );

 $("video").src=
  currentVideoURL;

 $("downloadBtn")
  .classList
  .remove("hidden");


 $("downloadBtn").onclick=()=>{

  const a=
   document.createElement("a");

  a.href=currentVideoURL;

  a.download=
   "Mina-Video-AI-V45.4.webm";

  document.body.appendChild(a);

  a.click();

  a.remove();

 };


 $("progressBar").style.width=
  "100%";

 $("renderStatus").textContent=
  stopRequested
   ? "⛔ Render durduruldu."
   : "✅ Video hazır!";


}


/* =========================================================
   STOP
========================================================= */

$("stopBtn").onclick=()=>{

 stopRequested=true;

 $("renderStatus").textContent=
  "⛔ Render durduruluyor...";

};


/* =========================================================
   PREVIEW WHOLE VIDEO
========================================================= */

$("previewBtn").onclick=()=>{

 if(!scenes.length){

  $("renderStatus").textContent=
   "Önce sahneleri oluştur.";

  return;

 }

 const size=getSize();

 const canvas=
  document.createElement("canvas");

 canvas.width=size.w;
 canvas.height=size.h;

 const ctx=
  canvas.getContext("2d");


 let index=0;
 let start=performance.now();

 let imgPromise=
  scenes[0].imageURL
   ? loadImage(
      scenes[0].imageURL
     ).catch(()=>null)
   : Promise.resolve(null);


 async function loop(){

  if(index>=scenes.length)
   index=0;

  const scene=
   scenes[index];

  const img=
   await imgPromise;

  const elapsed=
   (performance.now()-start)/1000;

  let p=
   elapsed/scene.duration;

  if(p>=1){

   index++;

   start=performance.now();

   imgPromise=
    scenes[index]&&
    scenes[index].imageURL
     ? loadImage(
        scenes[index].imageURL
       ).catch(()=>null)
     : Promise.resolve(null);

  }else{

   await drawSceneFrame(
    ctx,
    size.w,
    size.h,
    scene,
    p,
    img
   );

  }

  requestAnimationFrame(loop);

 }

 loop();

 /*
  Canvas'ı geçici olarak video önizlemesine
  çevirmiyoruz; sahne kartları zaten canlı.
 */

 $("renderStatus").textContent=
  "▶️ Sahne animasyonları önizleme modunda.";

};


/* =========================================================
   INITIAL
========================================================= */

$("status").textContent=
 "Mina Video AI V45.4 hazır.";

</script>

</body>
</html>
