<script>

"use strict";


/* =====================================================
   GLOBAL
===================================================== */

var scenes = [];

var logoURL = "";

var stopped = false;

var currentAudio = null;

var activeRecorder = null;

var activeDisplayStream = null;


/* =====================================================
   YARDIMCI
===================================================== */

function $(id){

    return document.getElementById(id);

}


function status(text,type){

    var el = $("status");

    el.className = "status";

    if(type){
        el.classList.add(type);
    }

    el.textContent = text;

}


function wait(ms){

    return new Promise(function(resolve){

        setTimeout(resolve,ms);

    });

}


/* =====================================================
   METİN BÖLME
===================================================== */

function splitStory(text,count){

    text = String(text || "")
        .replace(/\r/g," ")
        .replace(/\n+/g," ")
        .replace(/\s+/g," ")
        .trim();


    if(!text){

        return [];

    }


    var sentences =
        text.match(/[^.!?]+[.!?]+|[^.!?]+$/g);


    if(!sentences){

        sentences = [text];

    }


    var result = [];

    var total = sentences.length;

    var per =
        Math.ceil(total / count);


    for(
        var i=0;
        i<count;
        i++
    ){

        var part =
            sentences.slice(
                i * per,
                (i + 1) * per
            );


        if(part.length){

            result.push(
                part.join(" ").trim()
            );

        }

    }


    /*
      Eğer cümle sayısı sahne sayısından azsa
      uzun metinleri böl.
    */

    while(result.length < count){

        var longest = 0;

        for(
            var x=1;
            x<result.length;
            x++
        ){

            if(
                result[x].length >
                result[longest].length
            ){

                longest = x;

            }

        }


        var words =
            result[longest].split(" ");


        if(words.length < 4){

            break;

        }


        var middle =
            Math.ceil(words.length / 2);


        var a =
            words.slice(0,middle).join(" ");

        var b =
            words.slice(middle).join(" ");


        result.splice(
            longest,
            1,
            a,
            b
        );

    }


    return result.slice(0,count);

}


/* =====================================================
   GÖRSEL PROMPT
===================================================== */

function createPrompt(text,index){

    return [

        "Cinematic documentary photography.",

        "Photorealistic.",

        "Ultra detailed.",

        "Realistic human face.",

        "Natural skin texture.",

        "Authentic business documentary.",

        "Professional cinematography.",

        "35mm lens.",

        "Shallow depth of field.",

        "Natural dramatic lighting.",

        "Realistic historical environment.",

        "Subtle film grain.",

        "High-end Netflix documentary visual style.",

        "No text.",

        "No subtitles.",

        "No watermark.",

        "Scene "+(index+1)+":",

        text

    ].join(" ");

}


/* =====================================================
   SAHNELERİ OLUŞTUR
===================================================== */

function createScenes(){

    try{

        stopAll(false);

        var count =
            parseInt(
                $("sceneCount").value,
                10
            );


        var parts =
            splitStory(
                $("story").value,
                count
            );


        if(!parts.length){

            status(
                "❌ Hikâye boş.",
                "err"
            );

            return;

        }


        scenes = [];


        for(
            var i=0;
            i<parts.length;
            i++
        ){

            scenes.push({

                id:i,

                text:parts[i],

                prompt:
                    createPrompt(
                        parts[i],
                        i
                    ),

                imageURL:"",

                audioBlob:null,

                audioURL:"",

                audioDuration:0,

                audioElement:null

            });

        }


        renderSceneCards();


        status(
            "✅ "+scenes.length+
            " sahne oluşturuldu.\n\n"+
            "Her sahnenin kendi görseli ve kendi gerçek ses kaydı olacak.",
            "ok"
        );


    }catch(error){

        console.error(error);

        status(
            "❌ SAHNE OLUŞTURMA HATASI:\n"+
            error.message,
            "err"
        );

    }

}


/* =====================================================
   SAHNE KARTI
===================================================== */

    */

    /*
      SOL
    */

    var left =

    var textArea =
        document.createElement("textarea");

    textArea.className =

    textArea.id =

    textArea.value =
        scene.text;


    textArea.addEventListener(
        "input",
        function(){

            scene.text =
                textArea.value;

        }
    );


    left.appendChild(textLabel);

    left.appendChild(textArea);


    var promptLabel =
        document.createElement("label");

    promptLabel.style.marginTop =
        "12px";

    promptLabel.textContent =
        "Görsel promptu";


    var promptArea =
        document.createElement("textarea");

    promptArea.className =
        "scene-prompt";

    promptArea.id =
        "scenePrompt_"+scene.id;

    promptArea.value =
        scene.prompt;


    promptArea.addEventListener(
        "input",
        function(){

            scene.prompt =
                promptArea.value;

        }
    );


    left.appendChild(promptLabel);

    left.appendChild(promptArea);


    /*
      SAĞ
    */

    var right =
        document.createElement("div");


    var imageBox =
        document.createElement("div");

    imageBox.className =
        "image-placeholder";

    imageBox.id =
        "imageBox_"+scene.id;

    imageBox.textContent =
        "🖼\n\nBu sahne için görsel yükle veya üret.";


    right.appendChild(imageBox);

      IMAGE FILE
    */

    var imageLabel =
        document.createElement("label");

    imageLabel.style.marginTop =
        "10px";

    imageLabel.textContent =

    var imageInput =
        document.createElement("input");

    imageInput.type =
        "file";

    imageInput.accept =
        "image/*";

        function(event){

      IMAGE GENERATE
    */

    audioInfo.id =

/* =====================================================
   KARTLARI ÇİZ
===================================================== */

function renderSceneCards(){

    var container =
        $("scenes");


    container.innerHTML = "";


    for(
        var i=0;
        i<scenes.length;
        i++
    ){

        container.appendChild(
            createSceneCard(
                scenes[i]
            )
        );

    }

}


/* =====================================================
   BADGE
===================================================== */

function setBadge(
    sceneId,
    text,
    type
){

    var badge =
        $("badge_"+sceneId);


    if(!badge){

        return;

    }


    badge.className =
        "badge";


    if(type === "ok"){

        badge.classList.add(
            "badge-ok"
        );

    }

    if(type === "warn"){

        badge.classList.add(
            "badge-warn"
        );

    }

    if(type === "err"){

        badge.classList.add(
            "badge-err"
        );

    }


    badge.textContent =
        text;

}


/* =====================================================
   GÖRSELİ GÖSTER
===================================================== */

function showSceneImage(scene){

    var box =
        $("imageBox_"+scene.id);


    if(!box){

        return;

    }


    box.innerHTML = "";


    var img =
        document.createElement("img");


    img.className =
        "scene-image";

    img.src =
        scene.imageURL;


    box.appendChild(
        img
    );

}


/* =====================================================
   POLLINATIONS GÖRSEL
===================================================== */

function generateImage(scene){

    var prompt =
        $("scenePrompt_"+scene.id).value.trim();


    scene.prompt =
        prompt;


    if(!prompt){

        status(
            "⚠️ Sahne "+(scene.id+1)+
            " promptu boş.",
            "warn"
        );

        return;

    }


    setBadge(
        scene.id,
        "Görsel üretiliyor...",
        "warn"
    );


    var format =
        $("format").value;


    var width = 1280;

    var height = 720;


    if(format === "9:16"){

        width = 720;

        height = 1280;

    }


    if(format === "1:1"){

        width = 1080;

        height = 1080;

    }


    var seed =
        Math.floor(
            Math.random()*9999999
        );


    var url =
        "https://image.pollinations.ai/prompt/"+
        encodeURIComponent(prompt)+
        "?width="+width+
        "&height="+height+
        "&seed="+seed+
        "&nologo=true";


    var img =
        new Image();


    img.crossOrigin =
        "anonymous";


    img.onload =
        function(){

            try{

                var canvas =
                    document.createElement(
                        "canvas"
                    );


                canvas.width =
                    width;

                canvas.height =
                    height;


                var ctx =
                    canvas.getContext(
                        "2d"
                    );


                ctx.drawImage(
                    img,
                    0,
                    0,
                    width,
                    height
                );


                canvas.toBlob(
                    function(blob){

                        if(!blob){

                            throw new Error(
                                "Görsel blob oluşturulamadı."
                            );

                        }


                        if(scene.imageURL){

                            URL.revokeObjectURL(
                                scene.imageURL
                            );

                        }


                        scene.imageURL =
                            URL.createObjectURL(
                                blob
                            );


                        showSceneImage(
                            scene
                        );


                        setBadge(
                            scene.id,
                            "Görsel hazır",
                            "ok"
                        );


                        status(
                            "✅ Sahne "+
                            (scene.id+1)+
                            " görseli hazır.",

/* =====================================================
   V31.5 GERÇEK SES KAYDI
===================================================== */

async function recordScene(scene){

    try{

        stopped = false;


        if(
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getDisplayMedia
        ){

            throw new Error(
                "Chrome bu bilgisayarda getDisplayMedia desteklemiyor."
            );

        }


        if(
            !("speechSynthesis" in window)
        ){

            throw new Error(
                "speechSynthesis desteklenmiyor."
            );

        }


        speechSynthesis.cancel();


        status(
            "🎙 SAHNE "+(scene.id+1)+
            " SES KAYDI\n\n"+
            "Chrome paylaşım penceresi açılacak.\n"+
            "Burada bir SEKME seç ve mümkünse SEKME SESİ seçeneğini aç.\n\n"+
            "Bu adım V31.5'teki gerçek ses kayıt sistemidir.",
            "warn"
        );


        /*
          Chrome paylaşım
        */

        var displayStream =
            await navigator.mediaDevices.getDisplayMedia({

                video:true,

                audio:true

            });


        activeDisplayStream =
            displayStream;


        /*
          Sadece ses track
        */

        var audioTracks =
            displayStream.getAudioTracks();


        if(
            !audioTracks ||
            !audioTracks.length
        ){

            displayStream
                .getTracks()
                .forEach(
                    function(track){

                        track.stop();

                    }
                );


            activeDisplayStream =
                null;


            throw new Error(
                "Ses kanalı seçilmedi. Chrome paylaşım ekranında SEKME SESİ / SİSTEM SESİ seç."
            );

        }


        var audioStream =
            new MediaStream(
                audioTracks
            );


        /*
          MediaRecorder
        */

        var mimeType = "";


        if(
            MediaRecorder.isTypeSupported(
                "audio/webm;codecs=opus"
            )
        ){

            mimeType =
                "audio/webm;codecs=opus";

        }else if(
            MediaRecorder.isTypeSupported(
                "audio/webm"
            )
        ){

            mimeType =
                "audio/webm";

        }


        var recorder;


        if(mimeType){

            recorder =
                new MediaRecorder(
                    audioStream,
                    {
                        mimeType:mimeType
                    }
                );

        }else{

            recorder =
                new MediaRecorder(
                    audioStream
                );

        }


        activeRecorder =
            recorder;


        var chunks = [];


        recorder.ondataavailable =
            function(event){

                if(
                    event.data &&
                    event.data.size > 0
                ){

                    chunks.push(
                        event.data
                    );

                }

            };


        var recorderPromise =
            new Promise(
                function(resolve,reject){

                    recorder.onerror =
                        function(){

                            reject(
                                new Error(
                                    "MediaRecorder hata verdi."
                                )
                            );

                        };


                    recorder.onstop =
                        function(){

                            var blob =
                                new Blob(
                                    chunks,
                                    {
                                        type:
                                            recorder.mimeType ||
                                            "audio/webm"
                                    }
                                );


                            resolve(blob);

                        };

                }
            );


        recorder.start(200);


        /*
          Konuşma
        */

        var utterance =
            new SpeechSynthesisUtterance(
                scene.text
            );


        utterance.lang =
            $("language").value;


        utterance.rate =
            parseFloat(
                $("speechRate").value
            ) || 1;


        utterance.onstart =
            function(){

                setBadge(
                    scene.id,
                    "🔴 Kaydediliyor",
                    "warn"
                );


                status(
                    "🔴 Sahne "+
                    (scene.id+1)+
                    " kaydediliyor...\n"+
                    "Konuşma bitince kayıt otomatik kapanacak.",
                    "ok"
                );

            };


        utterance.onerror =
            function(){

                try{

                    if(
                        recorder.state !==
                        "inactive"
                    ){

                        recorder.stop();

                    }

                }catch(e){}

            };


        utterance.onend =
            function(){

                setTimeout(
                    function(){

                        try{

                            if(
                                recorder.state !==
                                "inactive"
                            ){

                                recorder.stop();

                            }

                        }catch(e){}

                    },
                    400
                );

            };


        speechSynthesis.speak(
            utterance
        );


        /*
          Kayıt tamamlanana kadar bekle
        */

        var blob =
            await recorderPromise;


        /*
          Stream kapat
        */

        audioTracks.forEach(
            function(track){

                try{
                    track.stop();
                }catch(e){}

            }
        );


        displayStream
            .getTracks()
            .forEach(
                function(track){

                    try{
                        track.stop();
                    }catch(e){}

                }
            );


        activeRecorder =
            null;

        activeDisplayStream =
            null;


        if(
            !blob ||
            !blob.size
        ){

            throw new Error(
                "Boş ses kaydı oluştu."
            );

        }


        /*
          Sahneye gerçek ses bağla
        */

        if(scene.audioURL){

            URL.revokeObjectURL(
                scene.audioURL
            );

        }


        scene.audioBlob =
            blob;


        scene.audioURL =
            URL.createObjectURL(
                blob
            );


        /*
          Süreyi gerçek dosyadan al
        */

        var audio =
            document.createElement(
                "audio"
            );


        audio.preload =
            "metadata";


        await new Promise(
            function(resolve){

                audio.onloadedmetadata =
                    function(){

                        scene.audioDuration =
                            isFinite(
                                audio.duration
                            )
                            ? audio.duration
                            : 0;


                        resolve();

                    };


                audio.onerror =
                    function(){

                        resolve();

                    };


                audio.src =
                    scene.audioURL;


                audio.load();

            }
        );


        scene.audioElement =
            audio;


        updateAudioInfo(
            scene
        );


        setBadge(
            scene.id,
            "🎙 Ses kaydedildi",
            "ok"
        );


        status(
            "✅ Sahne "+
            (scene.id+1)+
            " gerçek ses olarak kaydedildi.\n"+
            "Gerçek süre: "+
            scene.audioDuration.toFixed(2)+
            " saniye.",
            "ok"
        );


    }catch(error){

        console.error(error);


        try{

            speechSynthesis.cancel();

        }catch(e){}


        if(activeRecorder){

            try{

                if(
                    activeRecorder.state !==
                    "inactive"
                ){

                    activeRecorder.stop();

                }

            }catch(e){}

        }


        if(activeDisplayStream){

            activeDisplayStream
                .getTracks()
                .forEach(
                    function(track){

                        try{
                            track.stop();
                        }catch(e){}

                    }
                );

        }


        activeRecorder =
            null;

        activeDisplayStream =
            null;


        setBadge(
            scene.id,
            "Ses hatası",
            "err"
        );


        status(
            "❌ SES KAYIT HATASI:\n"+
            error.message,
            "err"
        );

    }

}

    if(currentAudio){

        try{

            currentAudio.pause();

        }catch(e){}

        currentAudio =
            null;

    }


    if(activeRecorder){

        try{

            if(
                activeRecorder.state !==
                "inactive"
            ){

                activeRecorder.stop();

            }

        }catch(e){}

    }


    if(activeDisplayStream){

        activeDisplayStream
            .getTracks()
            .forEach(
                function(track){

                    try{
                        track.stop();
                    }catch(e){}

                }
            );

        null;


    if(showStatus !== false){

    setTimeout(
        function(){

                    )
                );

            }

                    );

                    reject(
                        new Error(

                    );

/* =====================================================
   AUDIO LOAD
===================================================== */

function prepareAudio(scene){

    return new Promise(
        function(resolve,reject){

            if(!scene.audioURL){

                reject(
                    new Error(
                        "Sahne "+
                        (scene.id+1)+
                        " ses dosyası yok."
                    )
                );

                return;

            }


            var audio =
                document.createElement(
                    "audio"
                );


            audio.preload =
                "auto";


            audio.onloadedmetadata =
                function(){

                    if(
                        isFinite(
                            audio.duration
                        )
                    ){

                        scene.audioDuration =
                            audio.duration;

                    }


                    resolve(
                        audio
                    );

                };


            audio.onerror =
                function(){

                    reject(
                        new Error(
                            "Sahne "+
                            (scene.id+1)+
                            " ses dosyası okunamadı."
                        )
                    );

                };


            audio.src =
                scene.audioURL;


            audio.load();

        }
    );

}


/* =====================================================
   TEXT WRAP
===================================================== */

function drawSubtitle(
    ctx,
    text,
    width,
    height
){

    var maxWidth =
        width - 100;


    var fontSize =
        Math.max(
            22,
            Math.round(
                width / 45
            )
        );


    ctx.font =
        "bold "+
        fontSize+
        "px Arial";


    var words =
        text.split(/\s+/);


    var lines = [];

    var line = "";


    for(
        var i=0;
        i<words.length;
        i++
    ){

        var test =
            line
            ? line+" "+words[i]
            : words[i];


        if(
            ctx.measureText(
                test
            ).width >
            maxWidth &&
            line
        ){

            lines.push(
                line
            );

            line =
                words[i];

        }else{

            line =
                test;

        }

    }


    if(line){

        lines.push(
            line
        );

    }


    if(lines.length > 3){

        lines =
            lines.slice(
                0,
                3
            );

    }


    var boxHeight =
        lines.length *
        (fontSize+10) +
        30;


    var y =
        height -
        boxHeight -
        30;


    ctx.fillStyle =
        "rgba(0,0,0,.67)";


    ctx.fillRect(
        30,
        y,
        width-60,
        boxHeight
    );


    ctx.fillStyle =
        "#ffffff";


    ctx.textAlign =
        "center";


    for(
        var j=0;
        j<lines.length;
        j++
    ){

        ctx.fillText(
            lines[j],
            width/2,
            y+
            28+
            j*(fontSize+10)
        );

    }

}


/* =====================================================
   VIDEO RENDER
===================================================== */

async function renderVideo(){

    if(!scenes.length){

        status(
            "⚠️ Önce sahneleri oluştur.",
            "warn"
        );

        return;

    }


    try{

        stopped = false;


        /*
          Kontrol
        */

        status(
            "🔎 Video için sahneler kontrol ediliyor...",
            "warn"
        );


        for(
            var c=0;
            c<scenes.length;
            c++
        ){

            if(!scenes[c].imageURL){

                throw new Error(
                    "Sahne "+
                    (c+1)+
                    " görseli eksik."
                );

            }


            if(!scenes[c].audioURL){

                throw new Error(
                    "Sahne "+
                    (c+1)+
                    " sesi eksik."
                );

            }

        }


        /*
          Boyut
        */

        var format =
            $("format").value;


        var W = 1280;

        var H = 720;


        if(format === "9:16"){

            W = 720;

            H = 1280;

        }


        if(format === "1:1"){

            W = 1080;

            H = 1080;

        }


        var canvas =
            $("renderCanvas");


        canvas.width =
            W;

        canvas.height =
            H;


        var ctx =
            canvas.getContext(
                "2d"
            );


        /*
          Video stream
        */

        var videoStream =
            canvas.captureStream(
                30
            );


        /*
          Web Audio
        */

        var AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


        if(!AudioContext){

            throw new Error(
                "Web Audio API desteklenmiyor."
            );

        }


        var audioContext =
            new AudioContext();


        var destination =
            audioContext
            .createMediaStreamDestination();


        var finalStream =
            new MediaStream();


        videoStream
            .getVideoTracks()
            .forEach(
                function(track){

                    finalStream.addTrack(
                        track
                    );

                }
            );


        destination.stream
            .getAudioTracks()
            .forEach(
                function(track){

                    finalStream.addTrack(
                        track
                    );

                }
            );


        /*
          Codec
        */

        var mimeType =
            "";


        if(
            MediaRecorder.isTypeSupported(
                "video/webm;codecs=vp9,opus"
            )
        ){

            mimeType =
                "video/webm;codecs=vp9,opus";

        }else if(
            MediaRecorder.isTypeSupported(
                "video/webm;codecs=vp8,opus"
            )
        ){

            mimeType =
                "video/webm;codecs=vp8,opus";

        }else{

            mimeType =
                "video/webm";

        }


        var recorder;


        try{

            recorder =
                new MediaRecorder(
                    finalStream,
                    {
                        mimeType:mimeType
                    }
                );

        }catch(e){

            recorder =
                new MediaRecorder(
                    finalStream
                );

        }


        var chunks = [];


        recorder.ondataavailable =
            function(event){

                if(
                    event.data &&
                    event.data.size
                ){

                    chunks.push(
                        event.data
                    );

                }

            };


        /*
          STOP PROMISE
          ÖNCE oluşturuluyor.
        */

        var renderFinished =
            new Promise(
                function(resolve){

                    recorder.onstop =
                        function(){

                            resolve(
                                new Blob(
                                    chunks,
                                    {
                                        type:
                                            recorder.mimeType ||
                                            "video/webm"
                                    }
                                )
                            );

                        };

                }
            );


        recorder.start(500);


        /*
          Logo
        */

        var logo = null;


        if(logoURL){

            logo =
                new Image();


            logo.src =
                logoURL;


            try{

                await new Promise(
                    function(resolve){

                        logo.onload =
                            resolve;

                        logo.onerror =
                            resolve;

                    }
                );

            }catch(e){}

        }


        /*
          SAHNELER
        */

        for(
            var s=0;
            s<scenes.length;
            s++
        ){

            if(stopped){

                break;

            }


            var scene =
                scenes[s];


            var image =
                await loadImage(
                    scene
                );


            var audio =
                await prepareAudio(
                    scene
                );


            var source =
                audioContext
                .createMediaElementSource(
                    audio
                );


            var gain =
                audioContext
                .createGain();


            gain.gain.value =
                1;


            source.connect(
                gain
            );


            gain.connect(
                destination
            );


            await audioContext.resume();


            var duration =
                scene.audioDuration ||
                audio.duration ||
                3;


            var start =
                performance.now();


            audio.currentTime =
                0;


            audio.play()
                .catch(
                    function(error){

                        console.warn(
                            "Audio play:",
                            error
                        );

                    }
                );


            status(
                "🎞 RENDER EDİLİYOR\n\n"+
                "Sahne "+
                (s+1)+
                " / "+
                scenes.length+
                "\n"+
                "Ses süresi: "+
                duration.toFixed(2)+
                " saniye",
                "ok"
            );


            while(
                performance.now() -
                start <
                duration*1000
            ){

                if(stopped){

                    break;

                }


                var elapsed =
                    (
                        performance.now() -
                        start
                    ) / 1000;


                var progress =
                    Math.min(
                        1,
                        elapsed /
                        duration
                    );


                /*
                  Sinematik zoom
                */

                var zoom =
                    1 +
                    0.045 *
                    progress;


                var iw =
                    image.naturalWidth ||
                    image.width;


                var ih =
                    image.naturalHeight ||
                    image.height;


                var scale =
                    Math.max(
                        W/iw,
                        H/ih
                    ) *
                    zoom;


                var dw =
                    iw*scale;


                var dh =
                    ih*scale;


                /*
                  Yavaş kamera hareketi
                */

                var panX =
                    (W-dw) *
                    progress *
                    .35;


                var panY =
                    (H-dh) *
                    progress *
                    .20;


                ctx.fillStyle =
                    "#000000";


                ctx.fillRect(
                    0,
                    0,
                    W,
                    H
                );


                ctx.drawImage(
                    image,
                    panX,
                    panY,
                    dw,
                    dh
                );


                /*
                  Logo
                */

                if(logo){

                    var logoWidth =
                        100;


                    var logoHeight =
                        logo.height *
                        (
                            logoWidth /
                            logo.width
                        );


                    ctx.drawImage(
                        logo,
                        W-logoWidth-25,
                        25,
                        logoWidth,
                        logoHeight
                    );

                }


                /*
                  Subtitle
                */

                drawSubtitle(
                    ctx,
                    scene.text,
                    W,
                    H
                );


                await new Promise(
                    function(resolve){

                        requestAnimationFrame(
                            resolve
                        );

                    }
                );

            }


            try{

                audio.pause();

            }catch(e){}


            try{

                source.disconnect();

            }catch(e){}


            try{

                gain.disconnect();

            }catch(e){}

        }


        /*
          Kayıt kapat
        */

        if(
            recorder.state !==
            "inactive"
        ){

            recorder.stop();

        }


        var finalBlob =
            await renderFinished;


        finalStream
            .getTracks()
            .forEach(
                function(track){

                    try{
                        track.stop();
                    }catch(e){}

                }
            );


        try{

            await audioContext.close();

        }catch(e){}


        if(stopped){

            status(
                "⏹ Video render durduruldu.",
                "warn"
            );

            return;

        }


        /*
          Son video
        */

        var url =
            URL.createObjectURL(
                finalBlob
            );


        var video =
            $("finalVideo");


        video.src =
            url;


        video.style.display =
            "block";


        var download =
            $("downloadVideo");


        download.href =
            url;


        download.style.display =
            "inline-block";


        status(
            "✅ VİDEO HAZIR!\n\n"+
            "Tüm sahneler işlendi.\n"+
            "Her sahnenin gerçek ses süresi kullanıldı.\n"+
            "Ses WebM dosyasına eklendi.",
            "ok"
        );


    }catch(error){

        console.error(error);


        status(
            "❌ VİDEO RENDER HATASI:\n"+
            error.message,
            "err"
        );

    }

}


/* =====================================================
   BUTONLAR
===================================================== */

$("createScenes")
.addEventListener(
    "click",
    createScenes
);


$("allRecord")
.addEventListener(
    "click",
    recordAll
);


$("renderVideo")
.addEventListener(
    "click",
    renderVideo
);


$("stopAll")
.addEventListener(
    "click",
    function(){

        stopAll();

    }
);


/* =====================================================
   BAŞLANGIÇ
===================================================== */

createScenes();


</script>
