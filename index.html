function aiPlay(actor){

function showRoundResult(myTricks,oppTricks,success,earned){$('modalBox').innerHTML=`<div class="mt">${success?'🏆 İHALE TUTTU':'💥 BATIŞ'}</div><div class="roundResult">${bidValue} istedin • ${myTricks} el aldın<br>${success?'Kazanç: +'+earned+' puan':'Ceza: '+earned+' puan'}</div><button class="startBtn" onclick="nextRound()">▶ SONRAKİ OYUN</button>`;$('modal').classList.add('show')}
function nextRound(){$('modal').classList.remove('show');start(mode,difficulty,false)}
function showMatchResult(myTricks,oppTricks,success,earned){const winner=myScore>oppScore? (mode==='esli'?playerShortName()+' + MERT':playerShortName()):myScore<oppScore?(mode==='esli'?'EMRE + AHMET':'RAKİPLER'):'BERABERE';$('modalBox').innerHTML=`<div class="mt">${winner==='BERABERE'?'🤝 BERABERE':'🏆 '+winner+' KAZANDI'}</div><div class="finalScore">${myScore} — ${oppScore}</div><div class="roundResult">${gamesToPlay} oyun tamamlandı.<br>Son oyunda ${myTricks} el aldın.</div><button class="startBtn" onclick="newMatchFromResult()">🔄 YENİ MAÇ</button><button class="ctrl" style="margin-top:9px;width:100%" onclick="backMenu();$('modal').classList.remove('show')">⌂ ANA MENÜ</button>`;$('modal').classList.add('show')}
function newMatchFromResult(){$('modal').classList.remove('show');gameNo=0;myScore=0;oppScore=0;start(mode,difficulty,true)}
function shakeHand(actor){const id=actor==='SEN'?'userHand':'partnerHand';const e=$(id);e.animate([{transform:'translateX(-50%)'},{transform:'translateX(calc(-50% - 6px))'},{transform:'translateX(calc(-50% + 6px))'},{transform:'translateX(-50%)'}],{duration:260})}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>e.classList.remove('show'),1800)}
updateProfileUI();
function toggleSound(){soundOn=!soundOn;localStorage.setItem('br_sound',soundOn?'on':'off');$('snd').textContent=soundOn?'Açık':'Kapalı';if(soundOn)paper('click')}
function paper(kind){
  if(!soundOn)return;
  try{
    audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
    const now=audioCtx.currentTime;
    const noise=(duration,volume,filterFreq)=>{
      const len=Math.max(1,Math.floor(audioCtx.sampleRate*duration));
      const buf=audioCtx.createBuffer(1,len,audioCtx.sampleRate);
      const data=buf.getChannelData(0);
      for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*(1-i/len);
      const src=audioCtx.createBufferSource(),filter=audioCtx.createBiquadFilter(),gain=audioCtx.createGain();
      src.buffer=buf;filter.type='bandpass';filter.frequency.value=filterFreq;filter.Q.value=.7;
      gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(volume,now+.006);gain.gain.exponentialRampToValueAtTime(.0001,now+duration);
      src.connect(filter).connect(gain).connect(audioCtx.destination);src.start(now);src.stop(now+duration+.01);
    };
    const thump=(freq,volume,dur)=>{
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(freq,now);o.frequency.exponentialRampToValueAtTime(freq*.48,now+dur);
      g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(volume,now+.004);g.gain.exponentialRampToValueAtTime(.0001,now+dur);
      o.connect(g).connect(audioCtx.destination);o.start(now);o.stop(now+dur+.01);
    };
    if(kind==='throw'){ noise(.095,.16,1800); thump(105,.075,.075); }
    else if(kind==='collect'){ noise(.13,.11,1350); thump(80,.045,.10); }
    else if(kind==='deal'){ noise(.28,.12,2300); setTimeout(()=>{if(soundOn)noise(.18,.08,1900)},75); }
    else { thump(190,.055,.07); }
  }catch(e){}
}
