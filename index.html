<script>

/* =========================================================
   MINA VIDEO AI V44.1
   SINIRSIZ SAHNE
   SES SÜRESİ = SAHNE SÜRESİ
========================================================= */

const STORAGE_KEY = "mina_video_ai_v44_1";

let scenes = [];
let sceneIdCounter = 1;

let renderRunning = false;
let renderAnimation = null;


/* =========================================================
   UTILITIES
========================================================= */

function uid(){
  return "scene_" + Date.now() + "_" + (sceneIdCounter++);
}


function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function formatTime(sec){

  sec = Number(sec) || 0;

  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = Math.floor(sec % 60);

  if(h > 0){
    return String(h).padStart(2,"0") + ":" +
           String(m).padStart(2,"0") + ":" +
           String(s).padStart(2,"0");
  }

  return String(m).padStart(2,"0") + ":" +
         String(s).padStart(2,"0");
}


function totalDuration(){

  return scenes.reduce((sum,s)=>{
    return sum + (Number(s.duration) || 0);
  },0);
}


function updateStats(){

  document.getElementById("sceneCount").textContent =
    scenes.length;

  document.getElementById("totalDuration").textContent =
    formatTime(totalDuration());

  document.getElementById("audioSceneCount").textContent =
    scenes.filter(s => s.audioData).length;

  document.getElementById("videoSceneCount").textContent =
    scenes.filter(s => s.videoData).length;
}


/* =========================================================
   ADD SCENE
========================================================= */

function createEmptyScene(){

  return {
    id:uid(),

    title:"Yeni Sahne",

    narration:"",

    subtitle:"",

    imagePrompt:"",

    videoPrompt:"",

    imageData:"",

    videoData:"",

    audioData:"",

    imageName:"",

    videoName:"",

    audioName:"",

    duration:0
  };
}


function addScene(data=null){

  const scene = data || createEmptyScene();

  scenes.push(scene);

  renderScenes();

  updateStats();

  setStatus(
    "Sahne " + scenes.length + " eklendi."
  );
}


/* =========================================================
   DELETE / MOVE
========================================================= */

function deleteScene(index){

  if(!confirm(
    "Bu sahneyi silmek istediğine emin misin?"
  )){
    return;
  }

  scenes.splice(index,1);

  renderScenes();
  updateStats();
}


function moveSceneUp(index){

  if(index <= 0) return;

  const temp = scenes[index - 1];

  scenes[index - 1] = scenes[index];

  scenes[index] = temp;

  renderScenes();
}


function moveSceneDown(index){

  if(index >= scenes.length - 1) return;

  const temp = scenes[index + 1];

  scenes[index + 1] = scenes[index];

  scenes[index] = temp;

  renderScenes();
}


/* =========================================================
   SCENE FIELD UPDATE
========================================================= */

function updateScene(index,key,value){

  if(!scenes[index]) return;

  scenes[index][key] = value;

  updateStats();
}


/* =========================================================
   RENDER SCENES UI
========================================================= */

function renderScenes(){

  const container =
    document.getElementById("scenes");

  container.innerHTML = "";

  scenes.forEach((scene,index)=>{

    const div = document.createElement("div");

    div.className = "scene";

    div.innerHTML = `

      <div class="scene-head">

        <div class="scene-title">
          🎬 ${index + 1}. 
          <span>${escapeHTML(scene.title || "Yeni Sahne")}</span>
        </div>

        <div class="scene-time">
          🎙️ ${formatTime(scene.duration)}
        </div>

        <div>

          <button
            class="btn-gray"
            onclick="moveSceneUp(${index})">
            ⬆️
          </button>

          <button
            class="btn-gray"
            onclick="moveSceneDown(${index})">
            ⬇️
          </button>

          <button
            class="btn-red"
            onclick="deleteScene(${index})">
            🗑️
          </button>

        </div>

      </div>


      <div class="scene-grid">

        <div>

          <div class="field">

            <label>Başlık</label>

            <input
              style="width:100%"
              value="${escapeHTML(scene.title)}"
              oninput="updateScene(${index},'title',this.value);refreshSceneHeader(${index})">

          </div>


          <div class="field">

            <label>Almanca Ses Metni</label>

            <textarea
              oninput="updateScene(${index},'narration',this.value)"
              placeholder="Almanca anlatım...">${escapeHTML(scene.narration)}</textarea>

          </div>


          <div class="field">

            <label>Altyazı</label>

            <textarea
              oninput="updateScene(${index},'subtitle',this.value)"
              placeholder="Altyazı metni...">${escapeHTML(scene.subtitle)}</textarea>

          </div>

        </div>


        <div>

          <div class="field">

            <label>🎨 Z-Image Görsel Promptu</label>

            <div class="prompt-box"
                 id="imgPrompt_${scene.id}">
              ${escapeHTML(scene.imagePrompt)}
            </div>

            <button
              onclick="copyText(scenes[${index}].imagePrompt)">
              📋 Promptu Kopyala
            </button>

          </div>


          <div class="field">

            <label>🎥 Image-to-Video Promptu</label>

            <div class="prompt-box">
              ${escapeHTML(scene.videoPrompt)}
            </div>

            <button
              onclick="copyText(scenes[${index}].videoPrompt)">
              📋 Promptu Kopyala
            </button>

          </div>

        </div>

      </div>


      <div class="media-grid">

        <div class="media-box">

          <strong>🖼️ Görsel</strong>

          <input
            type="file"
            accept="image/*"
            onchange="loadImage(${index},this.files[0])">

          <img
            id="img_${scene.id}"
            class="preview"
            ${scene.imageData ? 'style="display:block"' : ''}
            src="${scene.imageData || ''}">

          ${
            scene.imageName
            ? `<div class="small">📎 ${escapeHTML(scene.imageName)}</div>`
            : ""
          }

        </div>


        <div class="media-box">

          <strong>🎥 Gerçek Video Klip</strong>

          <input
            type="file"
            accept="video/*"
            onchange="loadVideo(${index},this.files[0])">

          <video
            id="vid_${scene.id}"
            class="preview"
            controls
            ${scene.videoData ? 'style="display:block"' : ''}
            src="${scene.videoData || ''}">
          </video>

          ${
            scene.videoName
            ? `<div class="small">📎 ${escapeHTML(scene.videoName)}</div>`
            : ""
          }

        </div>


        <div class="media-box">

          <strong>🎙️ Ses Dosyası</strong>

          <input
            type="file"
            accept="audio/*"
            onchange="loadAudio(${index},this.files[0])">

          <audio
            id="aud_${scene.id}"
            controls
            style="width:100%;margin-top:8px;display:${scene.audioData ? 'block':'none'}"
            src="${scene.audioData || ''}">
          </audio>

          <div
            id="audstatus_${scene.id}"
            class="audio-status">

            ${
              scene.audioData
              ? "✅ Ses süresi: " + formatTime(scene.duration)
              : "Henüz ses yüklenmedi."
            }

          </div>

        </div>

      </div>

    `;

    container.appendChild(div);

  });

  updateStats();
}


/* =========================================================
   REFRESH HEADER
========================================================= */

function refreshSceneHeader(index){

  renderScenes();

}


/* =========================================================
   IMAGE LOAD
========================================================= */

function loadImage(index,file){

  if(!file) return;

  const reader = new FileReader();

  reader.onload = e => {

    scenes[index].imageData = e.target.result;

    scenes[index].imageName = file.name;

    renderScenes();

    setStatus(
      `🖼️ ${index+1}. sahnenin görseli yüklendi.`
    );

  };

  reader.readAsDataURL(file);
}


/* =========================================================
   VIDEO LOAD
========================================================= */

function loadVideo(index,file){

  if(!file) return;

  const reader = new FileReader();

  reader.onload = e => {

    scenes[index].videoData = e.target.result;

    scenes[index].videoName = file.name;

    renderScenes();

    setStatus(
      `🎥 ${index+1}. sahnenin gerçek video klibi yüklendi.`
    );

  };

  reader.readAsDataURL(file);
}


/* =========================================================
   AUDIO LOAD
   SES SÜRESİ SAHNENİN SÜRESİNİ BELİRLER
========================================================= */

function loadAudio(index,file){

  if(!file) return;

  const reader = new FileReader();

  reader.onload = e => {

    const data = e.target.result;

    const audio = new Audio();

    audio.preload = "metadata";

    audio.src = data;

    audio.onloadedmetadata = () => {

      let duration = audio.duration;

      if(!Number.isFinite(duration) || duration <= 0){

        setStatus(
          "❌ Ses süresi okunamadı."
        );

        return;
      }

      scenes[index].audioData = data;

      scenes[index].audioName = file.name;

      /*
        ANA KURAL:

        SES SÜRESİ = SAHNE SÜRESİ
      */

      scenes[index].duration = duration;

      renderScenes();

      setStatus(
        `🎙️ Sahne ${index+1}\n` +
        `Ses süresi: ${duration.toFixed(2)} saniye\n` +
        `Sahne süresi otomatik olarak bu süreye ayarlandı.`
      );

    };

    audio.onerror = () => {

      setStatus(
        "❌ Ses dosyası okunamadı."
      );

    };

  };

  reader.readAsDataURL(file);
}


/* =========================================================
   COPY
========================================================= */

async function copyText(text){

  try{

    await navigator.clipboard.writeText(text || "");

    setStatus("📋 Kopyalandı.");

  }catch(e){

    setStatus("❌ Kopyalama başarısız.");

  }
}


/* =========================================================
   STATUS
========================================================= */

function setStatus(text){

  document.getElementById(
    "renderStatus"
  ).textContent = text;
}


/* =========================================================
   STORY SPLITTER
========================================================= */

function splitStory(){

  const text =
    document.getElementById("story").value.trim();

  if(!text){

    alert("Önce hikâyeyi yapıştır.");

    return;
  }

  /*
    Paragrafları önceliklendir.
    Yoksa cümleleri kullan.
  */

  let parts = text
    .split(/\n\s*\n/)
    .map(x=>x.trim())
    .filter(Boolean);

  if(parts.length < 2){

    parts = text
      .split(/(?<=[.!?])\s+/)
      .map(x=>x.trim())
      .filter(Boolean);

  }

  if(!parts.length){

    alert("Hikâye bölünemedi.");

    return;
  }

  scenes = [];

  parts.forEach((part,index)=>{

    scenes.push({

      id:uid(),

      title:"Sahne " + (index+1),

      narration:part,

      subtitle:part,

      imagePrompt:
        "Cinematic realistic historical reconstruction, " +
        "German success story documentary style, " +
        "professional photography, natural lighting, " +
        "realistic human emotions, detailed environment, " +
        "16:9",

      videoPrompt:
        "Realistic cinematic movement, natural human motion, " +
        "subtle camera movement, documentary style, " +
        "realistic lighting, continuous motion, no text, no logos",

      imageData:"",

      videoData:"",

      audioData:"",

      imageName:"",

      videoName:"",

      audioName:"",

      duration:0

    });

  });

  renderScenes();

  setStatus(
    `${parts.length} sahne oluşturuldu.\n` +
    `Süreler ses dosyaları yüklendikçe otomatik belirlenecek.`
  );

}

function getCanvasSize(){

  const format =
    document.getElementById("format").value;

  if(format === "9:16"){

    return {
      width:720,
      height:1280
    };

  }

  if(format === "1:1"){

    return {
      width:1080,
      height:1080
    };

  }

  return {
    width:1280,
    height:720
  };

}


/* =========================================================
   IMAGE CACHE
========================================================= */

const imageCache = new Map();
const videoCache = new Map();
const audioCache = new Map();


async function getImage(scene){

  if(!scene.imageData) return null;

  if(imageCache.has(scene.id)){

    return imageCache.get(scene.id);

  }

  const img = new Image();

  img.src = scene.imageData;

  await new Promise((resolve,reject)=>{

    img.onload = resolve;

    img.onerror = reject;

  });

  imageCache.set(scene.id,img);

  return img;

}


async function getVideo(scene){

  if(!scene.videoData) return null;

  if(videoCache.has(scene.id)){

    return videoCache.get(scene.id);

  }

  const video = document.createElement("video");

  video.src = scene.videoData;

  video.preload = "auto";

  video.muted = true;

  video.playsInline = true;

  await new Promise((resolve,reject)=>{

    video.onloadeddata = resolve;

    video.onerror = reject;

  });

  videoCache.set(scene.id,video);

  return video;

}


/* =========================================================
   AUDIO DECODE
========================================================= */

async function getAudioBuffer(scene,audioContext){

  if(!scene.audioData) return null;

  if(audioCache.has(scene.id)){

    return audioCache.get(scene.id);

  }

  try{

    const response =
      await fetch(scene.audioData);

    const arrayBuffer =
      await response.arrayBuffer();

    const buffer =
      await audioContext.decodeAudioData(
        arrayBuffer.slice(0)
      );

    audioCache.set(scene.id,buffer);

    return buffer;

  }catch(e){

    console.error(
      "Audio decode error:",
      e
    );

    return null;

  }

}


/* =========================================================
   DRAW COVER
========================================================= */

function drawCover(
  ctx,
  source,
  canvasWidth,
  canvasHeight
){

  if(!source) return;

  const sw =
    source.videoWidth ||
    source.naturalWidth ||
    source.width;

  const sh =
    source.videoHeight ||
    source.naturalHeight ||
    source.height;

  if(!sw || !sh) return;

  const scale =
    Math.max(
      canvasWidth / sw,
      canvasHeight / sh
    );

  const dw = sw * scale;

  const dh = sh * scale;

  const x =
    (canvasWidth - dw) / 2;

  const y =
    (canvasHeight - dh) / 2;

  ctx.drawImage(
    source,
    x,
    y,
    dw,
    dh
  );

}


/* =========================================================
   DRAW IMAGE WITH MOTION
========================================================= */

function drawAnimatedImage(
  ctx,
  img,
  w,
  h,
  progress
){

  if(!img) return;

  const sw =
    img.naturalWidth;

  const sh =
    img.naturalHeight;

  if(!sw || !sh) return;

  const baseScale =
    Math.max(w/sw,h/sh);

  const zoom =
    1.0 + (progress * 0.08);

  const scale =
    baseScale * zoom;

  const dw =
    sw * scale;

  const dh =
    sh * scale;

  const panX =
    (w-dw) *
    (0.5 + Math.sin(progress*Math.PI)*0.12);

  const panY =
    (h-dh) *
    (0.5 + Math.cos(progress*Math.PI)*0.08);

  ctx.drawImage(
    img,
    panX,
    panY,
    dw,
    dh
  );

}


/* =========================================================
   SUBTITLE
========================================================= */

function drawSubtitle(
  ctx,
  text,
  w,
  h
){

  if(!text) return;

  const maxWidth =
    w * 0.84;

  const fontSize =
    Math.max(
      22,
      Math.floor(w * 0.028)
    );

  ctx.font =
    `bold ${fontSize}px Arial`;

  ctx.textAlign = "center";

  ctx.textBaseline = "middle";

  const words =
    text.split(/\s+/);

  const lines = [];

  let line = "";

  words.forEach(word=>{

    const test =
      line ? line + " " + word : word;

    if(
      ctx.measureText(test).width >
      maxWidth &&
      line
    ){

      lines.push(line);

      line = word;

    }else{

      line = test;

    }

  });

  if(line){
    lines.push(line);
  }

  const lineHeight =
    fontSize * 1.25;

  const totalHeight =
    lines.length * lineHeight;

  const centerY =
    h - totalHeight - h*0.07;

  ctx.save();

  ctx.textAlign = "center";

  ctx.font =
    `bold ${fontSize}px Arial`;

  lines.forEach((l,i)=>{

    const y =
      centerY +
      i*lineHeight;

    const metrics =
      ctx.measureText(l);

    const padding = 12;

    ctx.fillStyle =
      "rgba(0,0,0,.72)";

    ctx.fillRect(
      w/2 -
      metrics.width/2 -
      padding,
      y-lineHeight/2,
      metrics.width+
      padding*2,
      lineHeight
    );

    ctx.strokeStyle =
      "rgba(0,0,0,.9)";

    ctx.lineWidth = 3;

    ctx.strokeText(
      l,
      w/2,
      y
    );

    ctx.fillStyle =
      "#ffffff";

    ctx.fillText(
      l,
      w/2,
      y
    );

  });

  ctx.restore();

}


/* =========================================================
   AUDIO GRAPH
========================================================= */

function buildAudioGraph(
  audioContext,
  destination,
  buffers
){

  const starts = [];

  let cursor = 0;

  buffers.forEach(item=>{

    if(!item.buffer){

      starts.push({
        start:cursor,
        duration:item.duration
      });

      cursor += item.duration;

      return;

    }

    const source =
      audioContext.createBufferSource();

    source.buffer =
      item.buffer;

    source.connect(
      destination
    );

    starts.push({
      source,
      start:cursor,
      duration:item.buffer.duration
    });

    cursor += item.buffer.duration;

  });

  return {
    starts,
    total:cursor
  };

}

    );

  }

}


/* =========================================================
   FINAL RENDER
========================================================= */

async function renderFinal(){

  if(renderRunning){

    alert("Render zaten devam ediyor.");

    return;

  }

  if(!scenes.length){

    alert("Önce en az bir sahne oluştur.");

    return;

  }

  const validScenes =
    scenes.filter(
      s => Number(s.duration) > 0
    );

  if(!validScenes.length){

    alert(
      "Önce sahnelere ses dosyası yüklemelisin.\n\n" +
      "Çünkü V44.1'de sahne süresini ses belirler."
    );

    return;

  }


  const size =
    getCanvasSize();

  const canvas =
    document.getElementById("renderCanvas");

  canvas.width =
    size.width;

  canvas.height =
    size.height;

  const ctx =
    canvas.getContext("2d");


  const fps =
    Number(
      document.getElementById("fps").value
    );


  const bitrate =
    Number(
      document.getElementById("quality").value
    );


  renderRunning = true;

  document.getElementById(
    "renderVideo"
  ).style.display = "none";


  const chunks = [];


  /* =====================================================
     CANVAS STREAM
  ===================================================== */

  const canvasStream =
    canvas.captureStream(fps);


  /* =====================================================
     AUDIO CONTEXT
  ===================================================== */

  let audioContext = null;

  let audioDestination = null;

  let audioBuffers = [];

  try{

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    audioDestination =
      audioContext.createMediaStreamDestination();

    for(
      const scene of validScenes
    ){

      const buffer =
        await getAudioBuffer(
          scene,
          audioContext
        );

      audioBuffers.push({

        buffer,

        duration:
          Number(scene.duration) || 0

      });

    }

  }catch(e){

    console.warn(
      "Audio setup failed:",
      e
    );

  }


  /* =====================================================
     MEDIA STREAM
  ===================================================== */

  const tracks = [
    ...canvasStream.getVideoTracks()
  ];


  if(
    audioDestination &&
    audioDestination.stream.getAudioTracks().length
  ){

    tracks.push(
      ...audioDestination.stream.getAudioTracks()
    );

  }


  const combinedStream =
    new MediaStream(tracks);


  let mimeType =
    "";


  const candidates = [

    "video/webm;codecs=vp9,opus",

    "video/webm;codecs=vp8,opus",

    "video/webm"

  ];


  for(
    const type of candidates
  ){

    if(
      MediaRecorder.isTypeSupported(type)
    ){

      mimeType = type;

      break;

    }

  }


  if(!mimeType){

    alert(
      "Bu tarayıcı WebM MediaRecorder desteklemiyor."
    );

    renderRunning = false;

    return;

  }


  const recorder =
    new MediaRecorder(
      combinedStream,
      {
        mimeType,
        videoBitsPerSecond:
          bitrate
      }
    );


  recorder.ondataavailable =
    e => {

      if(e.data && e.data.size){

        chunks.push(e.data);

      }

    };


  const recorderStopped =
    new Promise(resolve=>{

      recorder.onstop = resolve;

    });


  recorder.start(250);


  /* =====================================================
     START AUDIO
  ===================================================== */

  if(audioContext){

    try{

      await audioContext.resume();

      let timeCursor =
        audioContext.currentTime + 0.15;


      audioBuffers.forEach(item=>{

        if(!item.buffer){

          timeCursor +=
            item.duration;

          return;

        }


        const source =
          audioContext.createBufferSource();

        source.buffer =
          item.buffer;

        source.connect(
          audioDestination
        );


        source.start(
          timeCursor
        );


        timeCursor +=
          item.buffer.duration;

      });

    }catch(e){

      console.warn(
        "Audio playback scheduling failed:",
        e
      );

    }

  }


  /* =====================================================
     PREPARE VIDEO ELEMENTS
  ===================================================== */

  const media = [];

  for(
    const scene of validScenes
  ){

    let video = null;

    if(scene.videoData){

      try{

        video =
          await getVideo(scene);

      }catch(e){

        video = null;

      }

    }

    const image =
      await getImage(scene)
        .catch(()=>null);

    media.push({
      scene,
      video,
      image
    });

  }


  /* =====================================================
     TIMELINE
  ===================================================== */

  let sceneIndex = 0;

  let sceneStart = performance.now();

  let globalStart =
    performance.now();

  let sceneElapsed = 0;

  let currentVideo = null;


  function startSceneVideo(){

    const item =
      media[sceneIndex];

    if(!item || !item.video){

      currentVideo = null;

      return;

    }

    currentVideo =
      item.video;

    try{

      currentVideo.pause();

      currentVideo.currentTime = 0;

      currentVideo.muted = true;

      currentVideo.loop = true;

      const p =
        currentVideo.play();

      if(p && p.catch){

        p.catch(()=>{});

      }

    }catch(e){}

  }


  startSceneVideo();


  function drawFrame(){

    if(!renderRunning){

      return;

    }


    const now =
      performance.now();

    const scene =
      validScenes[sceneIndex];

    if(!scene){

      finishRender();

      return;

    }


    const duration =
      Number(scene.duration) || 0;


    sceneElapsed =
      (now - sceneStart) / 1000;


    /*
      SES SÜRESİ SAHNENİN SÜRESİDİR.
    */

    if(sceneElapsed >= duration){

      sceneIndex++;

      if(
        sceneIndex >= validScenes.length
      ){

        finishRender();

        return;

      }

      sceneStart = now;

      sceneElapsed = 0;

      startSceneVideo();

    }


    const item =
      media[sceneIndex];

    const progress =
      Math.min(
        1,
        sceneElapsed /
        Math.max(duration,0.001)
      );


    ctx.fillStyle = "#000";

    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    /* ===================================================
       GERÇEK VIDEO
    =================================================== */

    if(
      item &&
      item.video &&
      item.video.readyState >= 2
    ){

      try{

        drawCover(
          ctx,
          item.video,
          canvas.width,
          canvas.height
        );

      }catch(e){

        if(item.image){

          drawAnimatedImage(
            ctx,
            item.image,
            canvas.width,
            canvas.height,
            progress
          );

        }

      }

    }

    /* ===================================================
       GÖRSEL FALLBACK
    =================================================== */

    else if(
      item &&
      item.image
    ){

      drawAnimatedImage(
        ctx,
        item.image,
        canvas.width,
        canvas.height,
        progress
      );

    }

    /* ===================================================
       NO MEDIA
    =================================================== */

    else{

      const gradient =
        ctx.createLinearGradient(
          0,
          0,
          canvas.width,
          canvas.height
        );

      gradient.addColorStop(
        0,
        "#111827"
      );

      gradient.addColorStop(
        1,
        "#030712"
      );

      ctx.fillStyle =
        gradient;

      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

    }


    /* ===================================================
       SCENE NUMBER
    =================================================== */

    ctx.save();

    ctx.fillStyle =
      "rgba(0,0,0,.45)";

    ctx.fillRect(
      18,
      18,
      105,
      38
    );

    ctx.fillStyle =
      "#fff";

    ctx.font =
      "bold 18px Arial";

    ctx.textAlign =
      "left";

    ctx.textBaseline =
      "middle";

    ctx.fillText(
      `${sceneIndex+1} / ${validScenes.length}`,
      30,
      37
    );

    ctx.restore();


    /* ===================================================
       SUBTITLE
    =================================================== */

    drawSubtitle(
      ctx,
      scene.subtitle ||
      scene.narration ||
      "",
      canvas.width,
      canvas.height
    );


    /* ===================================================
       PROGRESS
    =================================================== */

    const total =
      validScenes.reduce(
        (sum,s)=>
          sum +
          (Number(s.duration)||0),
        0
      );


    const completed =
      validScenes
        .slice(0,sceneIndex)
        .reduce(
          (sum,s)=>
            sum +
            (Number(s.duration)||0),
          0
        );


    const overall =
      completed +
      sceneElapsed;


    const percent =
      total > 0
      ? Math.min(
          100,
          overall/total*100
        )
      : 0;


    document.getElementById(
      "progress"
    ).style.width =
      percent + "%";


    setStatus(
      `🎬 Render: ${percent.toFixed(1)}%\n` +
      `Sahne: ${sceneIndex+1}/${validScenes.length}\n` +
      `Sahne süresi: ${sceneElapsed.toFixed(1)} / ${duration.toFixed(1)} sn\n` +
      `Toplam: ${formatTime(overall)} / ${formatTime(total)}`
    );


    renderAnimation =
      requestAnimationFrame(
        drawFrame
      );

  }


  drawFrame();


  async function finishRender(){

    if(!renderRunning) return;

    renderRunning = false;


    if(renderAnimation){

      cancelAnimationFrame(
        renderAnimation
      );

      renderAnimation = null;

    }


    try{

      recorder.stop();

    }catch(e){}


    await recorderStopped;


    if(audioContext){

      try{

        await audioContext.close();

      }catch(e){}

    }


    const blob =
      new Blob(
        chunks,
        {
          type:mimeType
        }
      );


    const url =
      URL.createObjectURL(blob);


    const video =
      document.getElementById(
        "renderVideo"
      );


    video.src = url;

    video.style.display =
      "block";


    const link =
      document.getElementById(
        "downloadVideo"
      );


    link.href =
      url;

    link.style.display =
      "inline-block";


    link.download =
      "GeldStory_V44_1_" +
      new Date()
        .toISOString()
        .replace(/[:.]/g,"-") +
      ".webm";


    document.getElementById(
      "progress"
    ).style.width =
      "100%";


    setStatus(
      "✅ FINAL VİDEO HAZIR!\n\n" +
      "🎬 Sahne sayısı: " +
      validScenes.length +
      "\n" +
      "⏱️ Toplam süre: " +
      formatTime(totalDuration()) +
      "\n" +
      "🎙️ Sesler final videoya eklendi.\n" +
      "💬 Altyazılar videoya işlendi.\n" +
      "📦 Format: WebM"
    );

  }

}

   FORMAT / AUTO SAVE EVENTS
========================================================= */

document
  .getElementById("format")
  .addEventListener(
    "change",
    ()=>{
      setStatus(
        "📺 Format değiştirildi: " +
        document.getElementById("format").value
      );
    }
  );

renderScenes();

updateStats();

setStatus(

  "♾️ Sahne sınırı yok.\n" +
  "🎙️ Ses dosyasını yüklediğinde sesin gerçek süresi sahnenin süresi olur."
);
