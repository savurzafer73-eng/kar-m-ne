<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mina Video AI V36 — GeldStory Studio</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#080b10;
    color:#f1f5f9;
    font-family:Arial,Helvetica,sans-serif;
}

header{
    background:linear-gradient(135deg,#111827,#030712);
    border-bottom:1px solid #263244;
    padding:20px;
    position:sticky;
    top:0;
    z-index:100;
}

.header-inner{
    max-width:1200px;
    margin:auto;
}

h1{
    margin:0 0 6px;
    font-size:28px;
}

.subtitle{
    color:#94a3b8;
    font-size:14px;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.panel{
    background:#111827;
    border:1px solid #263244;
    border-radius:16px;
    padding:18px;
    margin-bottom:18px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
}

textarea{
    width:100%;
    min-height:230px;
    resize:vertical;
    background:#05070b;
    color:#e5e7eb;
    border:1px solid #334155;
    border-radius:12px;
    padding:14px;
    font-size:15px;
    line-height:1.6;
    outline:none;
}

textarea:focus{
    border-color:#64748b;
}

.controls{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-top:14px;
}

select,
input{
    width:100%;
    background:#05070b;
    color:#fff;
    border:1px solid #334155;
    border-radius:10px;
    padding:11px;
}

button{
    border:0;
    border-radius:10px;
    padding:12px 16px;
    cursor:pointer;
    font-weight:bold;
    color:white;
    background:#2563eb;
}

button:hover{
    filter:brightness(1.12);
}

button.secondary{
    background:#334155;
}

button.success{
    background:#059669;
}

button.warning{
    background:#d97706;
}

button.danger{
    background:#dc2626;
}

button:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.main-buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:15px;
}

.status{
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    background:#05070b;
    color:#94a3b8;
    min-height:42px;
}

.progress-wrap{
    margin-top:12px;
    height:10px;
    background:#020617;
    border-radius:20px;
    overflow:hidden;
    display:none;
}

.progress{
    height:100%;
    width:0%;
    background:#22c55e;
    transition:.2s;
}

.scene-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
}

.scene{
    background:#0b1220;
    border:1px solid #263244;
    border-radius:16px;
    overflow:hidden;
}

.scene-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 14px;
    background:#111827;
    border-bottom:1px solid #263244;
}

.scene-number{
    font-weight:bold;
}

.scene-status{
    font-size:12px;
    color:#94a3b8;
}

.scene-body{
    padding:14px;
}

.scene-image{
    width:100%;
    aspect-ratio:16/9;
    background:#020617;
    border-radius:10px;
    overflow:hidden;
    margin-bottom:12px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.scene-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.placeholder{
    color:#64748b;
    text-align:center;
    padding:20px;
}

.scene-text{
    width:100%;
    min-height:130px;
    margin-bottom:12px;
    font-size:14px;
}

.prompt-box{
    position:relative;
}

.prompt{
    width:100%;
    min-height:190px;
    background:#05070b;
    color:#cbd5e1;
    border:1px solid #334155;
    border-radius:10px;
    padding:12px;
    resize:vertical;
    font-size:13px;
    line-height:1.5;
}

.prompt-buttons{
    display:flex;
    gap:8px;
    margin-top:8px;
    flex-wrap:wrap;
}

.prompt-buttons button{
    padding:8px 11px;
    font-size:12px;
}

.scene-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:12px;
}

.scene-actions button{
    flex:1;
    min-width:120px;
}

.error{
    color:#fca5a5;
    background:#3f0d0d;
    border:1px solid #7f1d1d;
    padding:10px;
    border-radius:8px;
    margin-top:10px;
    font-size:13px;
}

.ok{
    color:#86efac;
}

.info{
    color:#93c5fd;
}

.empty{
    text-align:center;
    padding:50px 20px;
    color:#64748b;
    border:1px dashed #334155;
    border-radius:14px;
}

.small{
    color:#64748b;
    font-size:12px;
    margin-top:7px;
}

@media(max-width:800px){
    .controls{
        grid-template-columns:1fr 1fr;
    }

    .scene-grid{
        grid-template-columns:1fr;
    }
}

@media(max-width:500px){
    .controls{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header>
<div class="header-inner">
    <h1>🎬 Mina Video AI V36</h1>
    <div class="subtitle">
        GeldStory Studio — Sahne + Prompt + Görsel
    </div>
</div>
</header>

<div class="container">

<div class="panel">

    <label>📖 Almanca Hikâyeni Buraya Yapıştır</label>

    <textarea id="story" placeholder="Örneğin:

Im Jahr 1980 hatte ein junger Mann namens Thomas nur 50 Euro in seiner Tasche.
Er arbeitete jeden Tag in einem kleinen Laden.
Viele Menschen glaubten nicht an seine Idee.
Doch Thomas gab nicht auf...
"></textarea>

    <div class="controls">

        <div>
            <label>🎬 Sahne Sayısı</label>
            <select id="sceneCount">
                <option value="6">6 Sahne</option>
                <option value="8" selected>8 Sahne</option>
                <option value="10">10 Sahne</option>
                <option value="12">12 Sahne</option>
            </select>
        </div>

        <div>
            <label>📐 Format</label>
            <select id="format">
                <option value="16:9">16:9 YouTube</option>
                <option value="9:16">9:16 Shorts</option>
                <option value="1:1">1:1 Kare</option>
            </select>
        </div>

        <div>
            <label>🎨 Görsel Stil</label>
            <select id="style">
                <option value="cinematic documentary" selected>
                    Cinematic Documentary
                </option>
                <option value="realistic business documentary">
                    Business Documentary
                </option>
                <option value="dark cinematic documentary">
                    Dark Documentary
                </option>
                <option value="luxury cinematic">
                    Luxury Cinematic
                </option>
            </select>
        </div>

        <div>
            <label>🌍 Görsel Kalitesi</label>
            <select id="quality">
                <option value="highly detailed photorealistic" selected>
                    Photorealistic
                </option>
                <option value="ultra realistic cinematic">
                    Ultra Realistic
                </option>
                <option value="professional film still">
                    Film Still
                </option>
            </select>
        </div>

    </div>

    <div class="main-buttons">

        <button id="createBtn" onclick="createScenes()">
            🎬 SAHNELERİ OLUŞTUR
        </button>

        <button class="success" id="allImagesBtn"
                onclick="generateAllImages()" disabled>
            🖼️ TÜM GÖRSELLERİ ÜRET
        </button>

        <button class="secondary"
                onclick="clearAll()">
            🗑️ TEMİZLE
        </button>

    </div>

    <div id="status" class="status">
        Hazır. Önce Almanca hikâyeni yapıştır.
    </div>

    <div class="progress-wrap" id="progressWrap">
        <div class="progress" id="progress"></div>
    </div>

</div>


<div class="panel">

    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
        <div>
            <h2 style="margin:0">🎞️ SAHNELER</h2>
            <div class="small">
                Her sahnenin kendi metni ve kendi görsel prompt'u vardır.
            </div>
        </div>

        <div id="sceneInfo" class="small">
            0 sahne
        </div>
    </div>

    <div id="scenes" style="margin-top:18px;">
        <div class="empty">
            Henüz sahne oluşturulmadı.
        </div>
    </div>

</div>

</div>


<script>

let scenes = [];


/* =========================================================
   ELEMENTLER
========================================================= */

const storyEl = document.getElementById("story");
const sceneCountEl = document.getElementById("sceneCount");
const formatEl = document.getElementById("format");
const styleEl = document.getElementById("style");
const qualityEl = document.getElementById("quality");

const statusEl = document.getElementById("status");
const scenesEl = document.getElementById("scenes");
const sceneInfoEl = document.getElementById("sceneInfo");

const allImagesBtn = document.getElementById("allImagesBtn");

const progressWrap = document.getElementById("progressWrap");
const progressEl = document.getElementById("progress");


/* =========================================================
   DURUM
========================================================= */

function setStatus(text, type=""){
    statusEl.innerHTML = text;

    if(type === "error"){
        statusEl.style.color = "#fca5a5";
    }
    else if(type === "success"){
        statusEl.style.color = "#86efac";
    }
    else{
        statusEl.style.color = "#94a3b8";
    }
}


/* =========================================================
   FORMAT
========================================================= */

function getDimensions(){

    const f = formatEl.value;

    if(f === "9:16"){
        return {
            width:720,
            height:1280
        };
    }

    if(f === "1:1"){
        return {
            width:1024,
            height:1024
        };
    }

    return {
        width:1280,
        height:720
    };
}


/* =========================================================
   HİKÂYEYİ TEMİZLE
========================================================= */

function cleanStory(text){

    return text
        .replace(/\r/g,"")
        .replace(/[ \t]+/g," ")
        .replace(/\n{3,}/g,"\n\n")
        .trim();
}


/* =========================================================
   CÜMLELERE AYIR
========================================================= */

function splitSentences(text){

    return text
        .replace(/\n+/g," ")
        .split(/(?<=[.!?])\s+/)
        .map(x => x.trim())
        .filter(x => x.length > 0);

}


/* =========================================================
   KELİME PARÇALAMA
========================================================= */

function splitWords(text, count){

    const words = text
        .split(/\s+/)
        .filter(Boolean);

    const result = [];

    if(words.length === 0){
        return result;
    }

    const chunkSize = Math.ceil(words.length / count);

    for(let i=0;i<count;i++){

        const part = words.slice(
            i * chunkSize,
            (i + 1) * chunkSize
        );

        if(part.length){
            result.push(part.join(" "));
        }
    }

    return result;
}


/* =========================================================
   SAHNELERİ DAĞIT
========================================================= */

function divideStory(text,count){

    const sentences = splitSentences(text);

    let parts = [];

    if(sentences.length >= count){

        const base = Math.floor(sentences.length / count);
        const extra = sentences.length % count;

        let index = 0;

        for(let i=0;i<count;i++){

            const take = base + (i < extra ? 1 : 0);

            parts.push(
                sentences
                    .slice(index,index+take)
                    .join(" ")
            );

            index += take;
        }

    }
    else{

        parts = splitWords(text,count);

    }

    while(parts.length < count){

        parts.push(
            parts.length ?
            parts[parts.length-1] :
            text
        );

    }

    return parts.slice(0,count);
}


/* =========================================================
   SAHNENİN KONUSUNU ÇIKAR
========================================================= */

function detectTopic(text){

    const lower = text.toLowerCase();

    let topic = "successful entrepreneur";

    if(
        lower.includes("unternehmen") ||
        lower.includes("firma") ||
        lower.includes("geschäft") ||
        lower.includes("startup")
    ){
        topic = "German entrepreneur and growing business";
    }

    if(
        lower.includes("million") ||
        lower.includes("milliard") ||
        lower.includes("reich") ||
        lower.includes("vermögen")
    ){
        topic = "wealth creation and entrepreneurial success";
    }

    if(
        lower.includes("restaurant") ||
        lower.includes("café") ||
        lower.includes("essen")
    ){
        topic = "restaurant entrepreneur";
    }

    if(
        lower.includes("technologie") ||
        lower.includes("software") ||
        lower.includes("computer")
    ){
        topic = "technology entrepreneur";
    }

    if(
        lower.includes("sport") ||
        lower.includes("fußball") ||
        lower.includes("football")
    ){
        topic = "sports success story";
    }

    return topic;
}


/* =========================================================
   SAHNE TİPİ
========================================================= */

function getSceneType(index,total){

    const ratio = index / Math.max(1,total-1);

    if(index === 0){
        return {
            name:"Opening",
            camera:"wide cinematic establishing shot"
        };
    }

    if(ratio < 0.25){
        return {
            name:"Beginning",
            camera:"medium cinematic shot"
        };
    }

    if(ratio < 0.55){
        return {
            name:"Struggle",
            camera:"dramatic medium close-up"
        };
    }

    if(ratio < 0.8){
        return {
            name:"Turning Point",
            camera:"dynamic cinematic shot"
        };
    }

    if(index === total-1){
        return {
            name:"Success",
            camera:"epic cinematic wide shot"
        };
    }

    return {
        name:"Development",
        camera:"cinematic tracking shot"
    };
}


/* =========================================================
   GÖRSEL PROMPT OLUŞTUR
========================================================= */

function createPrompt(sceneText,index,total){

    const topic = detectTopic(sceneText);

    const sceneType = getSceneType(index,total);

    const style = styleEl.value;
    const quality = qualityEl.value;

    const location =
        "realistic German or European urban environment";

    const character =
        "consistent main character throughout the story, natural realistic appearance";

    const prompt =
`Professional ${style} scene for a German success-story documentary.

SCENE:
${sceneText}

STORY CONTEXT:
${topic}

VISUAL DESCRIPTION:
Show the events of this scene visually and realistically. The main character should be clearly visible when appropriate. Preserve the same character appearance, age, hairstyle, clothing style and overall identity across all scenes.

SETTING:
${location}, believable real-world environment, realistic architecture and authentic details.

ACTION:
The characters are actively doing something related to the scene instead of simply posing for the camera.

CAMERA:
${sceneType.camera}, cinematic composition, natural perspective, foreground and background depth, subtle depth of field.

LIGHTING:
Natural cinematic lighting, realistic shadows, professional film lighting, believable highlights.

MOOD:
${sceneType.name}, emotionally engaging but realistic, documentary atmosphere.

QUALITY:
${quality}, highly detailed, realistic skin texture, realistic hands, realistic clothing, natural facial expressions, physically accurate environment.

VISUAL STYLE:
High-end German television documentary, cinematic film still, photorealistic, realistic colors, professional cinematography.

COMPOSITION:
Strong storytelling composition, clear focal subject, visually interesting background, no unnecessary empty space.

FORMAT:
${formatEl.value}.

NEGATIVE:
cartoon, anime, illustration, painting, 3D render, CGI look, plastic skin, blurry image, low quality, distorted face, deformed body, extra arms, extra legs, extra fingers, missing fingers, duplicate people, bad anatomy, watermark, logo, subtitles, captions, text, letters, artificial looking face.`;


    return prompt.trim();
}


/* =========================================================
   SAHNE OLUŞTUR
========================================================= */

function createScenes(){

    const story = cleanStory(storyEl.value);

    if(!story){

        setStatus(
            "❌ Önce hikâyeyi yaz veya yapıştır.",
            "error"
        );

        return;
    }

    const count = Number(sceneCountEl.value);

    setStatus(
        "⏳ Hikâye sahnelere ayrılıyor ve her sahne için prompt oluşturuluyor..."
    );

    scenes = [];

    const parts = divideStory(story,count);

    for(let i=0;i<count;i++){

        const text = parts[i] || "";

        scenes.push({

            id:i+1,

            text:text,

            prompt:createPrompt(
                text,
                i,
                count
            ),

            image:null,

            imageUrl:null,

            loading:false,

            error:null

        });

    }

    renderScenes();

    allImagesBtn.disabled = false;

    setStatus(
        `✅ ${scenes.length} sahne oluşturuldu. Her sahnenin görsel prompt'u hazır.`,
        "success"
    );

}


/* =========================================================
   SAHNELERİ GÖSTER
========================================================= */

function renderScenes(){

    sceneInfoEl.textContent =
        scenes.length + " sahne";

    if(!scenes.length){

        scenesEl.innerHTML = `
            <div class="empty">
                Henüz sahne oluşturulmadı.
            </div>
        `;

        return;
    }

    const html = scenes.map((scene,index)=>{

        return `

        <div class="scene">

            <div class="scene-head">

                <div class="scene-number">
                    🎬 SAHNE ${scene.id}
                </div>

                <div class="scene-status" id="sceneStatus-${scene.id}">
                    ${scene.image ? "✅ Görsel hazır" : "⏳ Görsel bekliyor"}
                </div>

            </div>

            <div class="scene-body">

                <div class="scene-image" id="imageBox-${scene.id}">

                    ${
                        scene.imageUrl

                        ?

                        `<img
                            src="${scene.imageUrl}"
                            alt="Scene ${scene.id}"
                        >`

                        :

                        `<div class="placeholder">
                            🖼️<br>
                            Görsel henüz üretilmedi
                        </div>`
                    }

                </div>


                <label>
                    📝 Sahne Metni
                </label>

                <textarea
                    class="scene-text"
                    id="sceneText-${scene.id}"
                    onchange="updateSceneText(${scene.id},this.value)"
                >${escapeHtml(scene.text)}</textarea>


                <label>
                    🎨 GÖRSEL PROMPT
                </label>

                <div class="prompt-box">

                    <textarea
                        class="prompt"
                        id="prompt-${scene.id}"
                        onchange="updatePrompt(${scene.id},this.value)"
                    >${escapeHtml(scene.prompt)}</textarea>

                    <div class="prompt-buttons">

                        <button
                            class="secondary"
                            onclick="copyPrompt(${scene.id})">
                            📋 Promptu Kopyala
                        </button>

                        <button
                            class="warning"
                            onclick="regeneratePrompt(${scene.id})">
                            🔄 Promptu Yenile
                        </button>

                    </div>

                </div>


                ${
                    scene.error
                    ?
                    `<div class="error">
                        ❌ ${escapeHtml(scene.error)}
                    </div>`
                    :
                    ""
                }


                <div class="scene-actions">

                    <button
                        class="success"
                        onclick="generateImage(${scene.id})"
                        ${scene.loading ? "disabled" : ""}>
                        ${
                            scene.loading
                            ?
                            "⏳ Üretiliyor..."
                            :
                            "🖼️ GÖRSEL ÜRET"
                        }
                    </button>

                    ${
                        scene.imageUrl
                        ?
                        `<button
                            class="secondary"
                            onclick="openImage(${scene.id})">
                            🔍 Görseli Aç
                        </button>`
                        :
                        ""
                    }

                </div>

            </div>

        </div>

        `;

    }).join("");

    scenesEl.innerHTML =
        `<div class="scene-grid">${html}</div>`;

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   SAHNE METNİ GÜNCELLE
========================================================= */

function updateSceneText(id,value){

    const scene = scenes.find(x=>x.id===id);

    if(!scene) return;

    scene.text = value;

}


/* =========================================================
   PROMPT GÜNCELLE
========================================================= */

function updatePrompt(id,value){

    const scene = scenes.find(x=>x.id===id);

    if(!scene) return;

    scene.prompt = value;

}


/* =========================================================
   PROMPT KOPYALA
========================================================= */

async function copyPrompt(id){

    const scene = scenes.find(x=>x.id===id);

    if(!scene) return;

    try{

        await navigator.clipboard.writeText(scene.prompt);

        setStatus(
            `✅ Sahne ${id} prompt'u panoya kopyalandı.`,
            "success"
        );

    }
    catch(e){

        const area =
            document.getElementById(`prompt-${id}`);

        area.select();

        document.execCommand("copy");

        setStatus(
            `✅ Sahne ${id} prompt'u kopyalandı.`,
            "success"
        );

    }

}


/* =========================================================
   PROMPT YENİLE
========================================================= */

function regeneratePrompt(id){

    const scene = scenes.find(x=>x.id===id);

    if(!scene) return;

    scene.prompt = createPrompt(
        scene.text,
        id-1,
        scenes.length
    );

    renderScenes();

    setStatus(
        `✅ Sahne ${id} prompt'u yeniden oluşturuldu.`,
        "success"
    );

}


/* =========================================================
   POLLINATIONS URL
========================================================= */

function buildImageUrl(prompt,seed){

    const dimensions = getDimensions();

    const encoded =
        encodeURIComponent(prompt);

    return (
        "https://image.pollinations.ai/prompt/" +
        encoded +
        "?width=" + dimensions.width +
        "&height=" + dimensions.height +
        "&seed=" + seed +
        "&nologo=true"
    );

}


/* =========================================================
   GÖRSELİ GERÇEKTEN YÜKLE
========================================================= */

function loadImage(url){

    return new Promise((resolve,reject)=>{

        const img = new Image();

        img.onload = ()=>resolve(img);

        img.onerror = ()=>{
            reject(
                new Error(
                    "Görsel sunucusundan cevap alınamadı."
                )
            );
        };

        img.src = url;

    });

}


/* =========================================================
   TEK SAHNE GÖRSEL
========================================================= */

async function generateImage(id){

    const scene = scenes.find(x=>x.id===id);

    if(!scene) return;

    if(!scene.prompt || scene.prompt.trim().length < 50){

        scene.error =
            "Görsel prompt'u boş veya çok kısa.";

        renderScenes();

        return;
    }

    scene.loading = true;
    scene.error = null;

    renderScenes();

    setStatus(
        `🖼️ Sahne ${id} görseli üretiliyor...`
    );

    try{

        const seed =
            Math.floor(
                Math.random()*999999999
            );

        const url =
            buildImageUrl(
                scene.prompt,
                seed
            );

        await loadImage(url);

        scene.imageUrl = url;

        scene.image = true;

        scene.loading = false;

        setStatus(
            `✅ Sahne ${id} görseli hazır.`,
            "success"
        );

    }
    catch(error){

        scene.loading = false;

        scene.error =
            "Görsel üretilemedi. İnternet bağlantısını kontrol et veya tekrar dene.";

        setStatus(
            `❌ Sahne ${id} görseli üretilemedi.`,
            "error"
        );

    }

    renderScenes();

}


/* =========================================================
   TÜM GÖRSELLER
========================================================= */

async function generateAllImages(){

    if(!scenes.length){

        setStatus(
            "❌ Önce sahneleri oluştur.",
            "error"
        );

        return;
    }

    allImagesBtn.disabled = true;

    progressWrap.style.display = "block";

    let completed = 0;

    for(const scene of scenes){

        setStatus(
            `🖼️ ${scene.id}/${scenes.length} görsel üretiliyor...`
        );

        await generateImage(scene.id);

        completed++;

        progressEl.style.width =
            ((completed/scenes.length)*100) + "%";

        await sleep(500);

    }

    allImagesBtn.disabled = false;

    setStatus(
        "🎉 Tüm sahne görsellerinin üretim işlemi tamamlandı.",
        "success"
    );

}


/* =========================================================
   GÖRSELİ AÇ
========================================================= */

function openImage(id){

    const scene =
        scenes.find(x=>x.id===id);

    if(!scene || !scene.imageUrl) return;

    window.open(
        scene.imageUrl,
        "_blank"
    );

}


/* =========================================================
   TEMİZLE
========================================================= */

function clearAll(){

    if(!confirm(
        "Tüm sahneler ve hikâye temizlensin mi?"
    )){
        return;
    }

    scenes = [];

    storyEl.value = "";

    renderScenes();

    allImagesBtn.disabled = true;

    progressWrap.style.display = "none";

    progressEl.style.width = "0%";

    setStatus(
        "Temizlendi. Yeni hikâyeyi yapıştırabilirsin."
    );

}


/* =========================================================
   SLEEP
========================================================= */

function sleep(ms){

    return new Promise(
        resolve => setTimeout(resolve,ms)
    );

}
