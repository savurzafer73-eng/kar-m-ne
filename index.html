/* =========================================================
   DURUM
========================================================= */

function setStatus(text){
  globalStatus.textContent = text;
}

function setProgress(value){
  value = Math.max(0,Math.min(100,value));
  progress.style.width = value + "%";
}


/* =========================================================
   YARDIMCI
========================================================= */

function sleep(ms){
  return new Promise(function(resolve){
    setTimeout(resolve,ms);
  });
}

function escapeHTML(str){
  return String(str || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================================================
   HİKÂYE BÖLME
========================================================= */

function splitStory(text,count){

  text = String(text || "").trim();

  if(!text){
    return [];
  }

  var paragraphs = text
    .split(/\n+/)
    .map(function(x){
      return x.trim();
    })
    .filter(Boolean);

  var sentences = [];

  paragraphs.forEach(function(p){

    var parts = p.match(/[^.!?]+[.!?]+|[^.!?]+$/g);

    if(parts){
      parts.forEach(function(s){
        s = s.trim();
        if(s){
          sentences.push(s);
        }
      });
    }

  });

  if(sentences.length === 0){
    sentences = [text];
  }

  var result = [];
  var per = Math.ceil(sentences.length / count);

  for(var i=0;i<count;i++){

    var start = i * per;
    var end = Math.min(start + per,sentences.length);

    var chunk = sentences.slice(start,end).join(" ");

    if(chunk){
      result.push(chunk);
    }
  }

  while(result.length < count){
    result.push(result[result.length-1] || "");
  }

  return result.slice(0,count);
}


/* =========================================================
   PROMPT OLUŞTURMA
========================================================= */

function createPrompt(text,index){

  var prompt =
    "Cinematic photorealistic documentary scene for a German business success story. " +
    "Ultra realistic photography, natural human expressions, realistic skin texture, " +
    "professional cinematic lighting, realistic environment, documentary photography, " +
    "35mm lens, shallow depth of field, detailed background, realistic shadows, " +
    "subtle film grain, premium streaming documentary quality, 16:9 composition. " +
    "Scene number " + (index+1) + ". " +
    "Main subject must remain visually consistent between scenes. " +
    "No text, no captions, no watermark, no logo, no distorted hands, no extra fingers. " +
    "Story context: " + text;

  return prompt;
}


/* =========================================================
   SAHNE OLUŞTUR
========================================================= */

function createScenes(){

  try{

    var text = storyInput.value.trim();

    if(!text){
      setStatus("❌ Önce hikâyeyi gir.");
      return;
    }

    var count = parseInt(sceneCount.value,10);

    var chunks = splitStory(text,count);

    scenes = [];

    for(var i=0;i<count;i++){

      scenes.push({
        id:i+1,
        text:chunks[i] || "",
        prompt:createPrompt(chunks[i] || "",i),
        imageURL:"",
        imageBlob:null,
        audioBlob:null,
        audioURL:"",
        audioDuration:0
      });
    }

    renderScenes();

    setProgress(0);

    setStatus(
      "✅ " + scenes.length +
      " sahne oluşturuldu. Her sahne için ayrıntılı görsel promptu hazır."
    );

  }catch(error){

    console.error(error);

    setStatus(
      "❌ SAHNE OLUŞTURMA HATASI: " +
      error.message
    );
  }
}


/* =========================================================

========================================================= */

  return {

}

    var stopBtn = document.createElement("button");
    stopBtn.className = "red";
    stopBtn.textContent = "⏹ Durdur";

    stopBtn.addEventListener("click",function(){

    });

/* =========================================================
   GÖRSEL GÖSTER
========================================================= */

function showSceneImage(scene){

  var preview = document.getElementById("preview-"+scene.id);

  if(!preview){
    return;
  }

  preview.innerHTML = "";

  var img = document.createElement("img");

  img.src = scene.imageURL;

  img.alt = "Sahne " + scene.id;

  preview.appendChild(img);
}


/* =========================================================
   POLLINATIONS GÖRSEL
========================================================= */

async function generateImage(scene){

  try{

    setStatus(
      "🖼️ Sahne " + scene.id +
      " görseli hazırlanıyor..."
    );

    var prompt = encodeURIComponent(scene.prompt);

    var url =
      "https://image.pollinations.ai/prompt/" +
      prompt +
      "?width=1280&height=720&nologo=true&seed=" +
      Math.floor(Math.random()*999999999);

    var response = await fetch(url);

    if(!response.ok){
      throw new Error(
        "Görsel sunucusu HTTP " + response.status
      );
    }

    var blob = await response.blob();

    scene.imageBlob = blob;

    if(scene.imageURL){
      try{
        URL.revokeObjectURL(scene.imageURL);
      }catch(e){}
    }

    scene.imageURL = URL.createObjectURL(blob);

    showSceneImage(scene);

    setBadge(scene.id,"🖼️ Görsel hazır");

    setStatus(
      "✅ Sahne " + scene.id +
      " görseli hazır."
    );

  }catch(error){

    console.error(error);

    setStatus(
      "❌ Sahne " + scene.id +
      " görsel hatası: " +
      error.message
    );
  }
}


/* =========================================================
   TÜM GÖRSELLER
========================================================= */

async function generateAllImages(){

  if(!scenes.length){
    setStatus("❌ Önce sahneleri oluştur.");
    return;
  }

  generateImagesBtn.disabled = true;

  try{

    for(var i=0;i<scenes.length;i++){

      setProgress((i/scenes.length)*100);

      await generateImage(scenes[i]);

      await sleep(500);
    }

    setProgress(100);

    setStatus("✅ Tüm sahne görselleri hazır.");

  }finally{

    generateImagesBtn.disabled = false;
  }
}


/* =========================================================
   LOCAL GÖRSEL
========================================================= */

function loadImageFile(scene,file){

  try{

    if(scene.imageURL){
      try{
        URL.revokeObjectURL(scene.imageURL);
      }catch(e){}
    }

    scene.imageBlob = file;
    scene.imageURL = URL.createObjectURL(file);

    showSceneImage(scene);

    setBadge(scene.id,"📁 Görsel yüklendi");

/* =========================================================
   AUDIO ARRAYBUFFER
========================================================= */

function blobToArrayBuffer(blob){

  return new Promise(function(resolve,reject){

    var reader = new FileReader();

    reader.onload = function(){
      resolve(reader.result);
    };

    reader.onerror = function(){
      reject(reader.error || new Error("Dosya okunamadı"));
    };

    reader.readAsArrayBuffer(blob);

  });
}


/* =========================================================
   GERÇEK SES SÜRESİ
   ÖNEMLİ FIX
========================================================= */

async function getAudioDuration(blob){

  if(!blob){
    throw new Error("Ses verisi bulunamadı.");
  }

  var AC =
    window.AudioContext ||
    window.webkitAudioContext;

  if(!AC){
    throw new Error(
      "Bu Chrome sürümünde Web Audio desteklenmiyor."
    );
  }

  var ctx = new AC();

  try{

    var arrayBuffer =
      await blobToArrayBuffer(blob);

    var decoded =
      await new Promise(function(resolve,reject){

        ctx.decodeAudioData(
          arrayBuffer.slice(0),
          function(buffer){
            resolve(buffer);
          },
          function(error){
            reject(
              error ||
              new Error("Ses çözümlenemedi.")
            );
          }
        );

      });

    var duration = Number(decoded.duration);

    if(!isFinite(duration) || duration <= 0){
      throw new Error(
        "Gerçek ses süresi okunamadı."
      );
    }

    return duration;

  }finally{

    try{
      await ctx.close();
    }catch(e){}
  }
}

      await navigator.mediaDevices.getDisplayMedia({

      captureStream.getTracks().forEach(function(track){

      throw new Error(
        "Ses yakalanmadı. Chrome penceresinde 'Sekme sesi paylaş' seçeneğini aç."

  }catch(error){

      error.message
    );

}

/* =========================================================
   TEK SAHNE SES KAYDI
========================================================= */

async function recordScene(scene){

  if(!captureStream){

    setStatus(
      "⚠️ Önce 'SES YAKALAMAYI HAZIRLA' butonuna bas."
    );

    return;
  }

  var tracks =
    captureStream.getAudioTracks();

  if(!tracks.length){

    setStatus(
      "❌ Aktif ses yakalama kanalı yok."
    );

    return;
  }

  try{

    speechSynthesis.cancel();

    var audioOnly =
      new MediaStream(
        tracks.map(function(track){
          return track.clone();
        })
      );

    var chunks = [];

    var mime = "";

    if(MediaRecorder.isTypeSupported(
      "audio/webm;codecs=opus"
    )){
      mime = "audio/webm;codecs=opus";
    }else if(MediaRecorder.isTypeSupported(
      "audio/webm"
    )){
      mime = "audio/webm";
    }else{
      mime = "";
    }

    var recorder =
      mime ?
      new MediaRecorder(
        audioOnly,
        {mimeType:mime}
      ) :
      new MediaRecorder(audioOnly);

    mediaRecorder = recorder;

    var stopped = false;

    var stopRecorder =
      function(){

        if(stopped){
          return;
        }

        stopped = true;

        try{
          recorder.stop();
        }catch(e){}

      };

    recorder.ondataavailable =
      function(e){

        if(e.data && e.data.size > 0){
          chunks.push(e.data);
        }

      };

    var finished =
      new Promise(function(resolve,reject){

        recorder.onerror =
          function(e){
            reject(
              e.error ||
              new Error("MediaRecorder hatası")
            );
          };

        recorder.onstop =
          function(){
            resolve();
          };

      });

    recorder.start(200);

    setBadge(
      scene.id,
      "🎙️ Kaydediliyor..."
    );

    setStatus(
      "🎙️ Sahne " +
      scene.id +
      " seslendiriliyor ve kaydediliyor..."
    );

    var lang =
      languageSelect.value;

    var rate =
      parseFloat(rateInput.value) || 0.95;

    var utterance =
      new SpeechSynthesisUtterance(
        scene.text
      );

    utterance.lang = lang;
    utterance.rate = rate;
    utterance.pitch = 1;
    utterance.volume = 1;

    utterance.onend =
      function(){

        setTimeout(function(){
          stopRecorder();
        },300);

      };

    utterance.onerror =
      function(e){

        stopRecorder();

        console.error(e);

      };

    speechSynthesis.speak(
      utterance
    );

    await finished;

    audioOnly.getTracks().forEach(
      function(track){
        try{
          track.stop();
        }catch(e){}
      }
    );

    if(!chunks.length){
      throw new Error(
        "Ses kaydı oluşmadı."
      );
    }

    var blob =
      new Blob(
        chunks,
        {
          type:
            mime ||
            "audio/webm"
        }
      );

    if(blob.size <= 0){
      throw new Error(
        "Ses dosyası boş."
      );
    }

    if(scene.audioURL){

      try{
        URL.revokeObjectURL(
          scene.audioURL
        );
      }catch(e){}
    }

    scene.audioBlob = blob;

    scene.audioURL =
      URL.createObjectURL(blob);

    /*
      V41.1 ÖNEMLİ:
      audio.duration kullanılmıyor.
      Gerçek WebM ses verisi decode edilerek
      saniye hesaplanıyor.
    */

    scene.audioDuration =
      await getAudioDuration(blob);

    if(
      !isFinite(scene.audioDuration) ||
      scene.audioDuration <= 0
    ){

      throw new Error(
        "Ses süresi geçersiz."
      );
    }

    updateAudioInfo(scene);

    setBadge(
      scene.id,
      "🎙️ " +
      scene.audioDuration.toFixed(2) +
      " sn"
    );

    setStatus(
      "✅ Sahne " +
      scene.id +
      " kaydedildi. Gerçek ses süresi: " +
      scene.audioDuration.toFixed(2) +
      " saniye."
    );

  }catch(error){

    console.error(error);

    setBadge(
      scene.id,
      "❌ Ses hatası"
    );

    setStatus(
      "❌ Sahne " +
      scene.id +
      " ses kayıt hatası: " +
      error.message
    );
  }finally{

    mediaRecorder = null;
  }
}

/* =========================================================
   SES SÜRESİNİ GARANTİLE
========================================================= */

async function ensureAudioDuration(scene){

  var d =
    Number(scene.audioDuration);

  if(
    isFinite(d) &&
    d > 0
  ){
    return d;
  }

  if(!scene.audioBlob){

    if(scene.audioURL){

      var response =
        await fetch(
          scene.audioURL
        );

      var blob =
        await response.blob();

      scene.audioBlob =
        blob;
    }
  }

  if(!scene.audioBlob){

    throw new Error(
      "Sahne " +
      scene.id +
      " için ses yok."
    );
  }

  scene.audioDuration =
    await getAudioDuration(
      scene.audioBlob
    );

  d =
    Number(scene.audioDuration);

  if(
    !isFinite(d) ||
    d <= 0
  ){

    throw new Error(
      "Sahne " +
      scene.id +
      " ses süresi geçersiz."
    );
  }

  updateAudioInfo(scene);

  return d;
}


/* =========================================================
   COVER / CONTAIN HESABI
========================================================= */

function drawCover(
  ctx,
  img,
  canvasW,
  canvasH,
  zoom,
  moveX,
  moveY
){

  var iw = img.naturalWidth || img.width;
  var ih = img.naturalHeight || img.height;

  if(!iw || !ih){
    return;
  }

  var scale =
    Math.max(
      canvasW/iw,
      canvasH/ih
    );

  scale *= zoom;

  var w =
    iw * scale;

  var h =
    ih * scale;

  var x =
    (canvasW-w)/2 +
    moveX;

  var y =
    (canvasH-h)/2 +
    moveY;

  ctx.drawImage(
    img,
    x,
    y,
    w,
    h
  );
}


/* =========================================================
   ALT YAZI
========================================================= */

function drawSubtitle(
  ctx,
  text,
  canvasW,
  canvasH
){

  if(!text){
    return;
  }

  var fontSize =
    Math.max(
      22,
      Math.round(canvasW * 0.024)
    );

  ctx.font =
    "bold " +
    fontSize +
    "px Arial";

  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";

  var maxWidth =
    canvasW * 0.82;

  var words =
    text.split(/\s+/);

  var lines = [];
  var current = "";

  words.forEach(function(word){

    var test =
      current ?
      current + " " + word :
      word;

    if(
      ctx.measureText(test).width >
      maxWidth
    ){

      if(current){
        lines.push(current);
      }

      current = word;

    }else{

      current = test;
    }
  });

  if(current){
    lines.push(current);
  }

  var lineHeight =
    fontSize * 1.3;

  var totalHeight =
    lines.length *
    lineHeight;

  var baseY =
    canvasH -
    totalHeight -
    canvasH * 0.06;

  var padding =
    fontSize * 0.65;

  var boxTop =
    baseY -
    totalHeight/2 -
    padding;

  var boxBottom =
    baseY +
    totalHeight/2 +
    padding;

  /*
    Rounded rect yerine
    Chrome 109 uyumlu basit kutu.
  */

  ctx.fillStyle =
    "rgba(0,0,0,0.70)";

  ctx.fillRect(
    canvasW*0.07,
    boxTop,
    canvasW*0.86,
    boxBottom-boxTop
  );

  ctx.fillStyle =
    "#ffffff";

  for(var i=0;i<lines.length;i++){

    ctx.fillText(
      lines[i],
      canvasW/2,
      baseY +
      i*lineHeight -
      (lines.length-1)*lineHeight/2
    );
  }
}


/* =========================================================
   LOGO ÇİZ
========================================================= */

function drawLogoSync(
  ctx,
  logoImg,
  canvasW,
  canvasH
){

  if(!logoImg){
    return;
  }

  var maxW =
    canvasW * 0.16;

  var maxH =
    canvasH * 0.10;

  var ratio =
    logoImg.naturalWidth /
    logoImg.naturalHeight;

  var w =
    maxW;

  var h =
    w / ratio;

  if(h > maxH){

    h = maxH;
    w = h * ratio;
  }

  var x =
    canvasW -
    w -
    canvasW*0.025;

  var y =
    canvasH*0.025;

  ctx.globalAlpha =
    0.90;

  ctx.drawImage(
    logoImg,
    x,
    y,
    w,
    h
  );

  ctx.globalAlpha =
    1;
}


/* =========================================================
   VIDEO RENDER
========================================================= */

async function renderVideo(){

  if(renderRunning){
    return;
  }

  if(!scenes.length){

    setStatus(
      "❌ Önce sahneleri oluştur."
    );

    return;
  }

  renderRunning = true;

  renderBtn.disabled = true;

  try{

    setStatus(
      "🎬 Video hazırlığı başlıyor..."
    );

    /*
      1. Görseller
    */

    var images =
      await prepareSceneImages();

    /*
      2. Ses süreleri
    */

    var durations = [];

    for(
      var di=0;
      di<scenes.length;
      di++
    ){

      var dur =
        await ensureAudioDuration(
          scenes[di]
        );

      durations.push(dur);
    }

    /*
      3. Canvas
    */

    var size =
      getCanvasSize();

    var canvas =
      document.createElement("canvas");

    canvas.width =
      size.width;

    canvas.height =
      size.height;

    var ctx =
      canvas.getContext(
        "2d",
        {
          alpha:false
        }
      );

    /*
      4. Video stream
    */

    var videoStream =
      canvas.captureStream(30);

    /*
      5. Web Audio
    */

    var AC =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AC){

      throw new Error(
        "Web Audio desteklenmiyor."
      );
    }

    var audioCtx =
      new AC();

    try{
      await audioCtx.resume();
    }catch(e){}

    var destination =
      audioCtx.createMediaStreamDestination();

    /*
      6. Birleştirilmiş stream
    */

    var finalStream =
      new MediaStream();

    videoStream
      .getVideoTracks()
      .forEach(function(track){

        finalStream.addTrack(track);

      });

    destination
      .stream
      .getAudioTracks()
      .forEach(function(track){

        finalStream.addTrack(track);

      });

    /*
      7. MediaRecorder
    */

    var outputMime =
      "";

    if(
      MediaRecorder.isTypeSupported(
        "video/webm;codecs=vp9,opus"
      )
    ){

      outputMime =
        "video/webm;codecs=vp9,opus";

    }else if(
      MediaRecorder.isTypeSupported(
        "video/webm;codecs=vp8,opus"
      )
    ){

      outputMime =
        "video/webm;codecs=vp8,opus";

    }else{

      outputMime =
        "video/webm";
    }

    var recorder =
      new MediaRecorder(
        finalStream,
        {
          mimeType:outputMime,
          videoBitsPerSecond:5000000,
          audioBitsPerSecond:128000
        }
      );

    var chunks = [];

    recorder.ondataavailable =
      function(e){

        if(e.data && e.data.size > 0){
          chunks.push(e.data);
        }

      };

    var recorderFinished =
      new Promise(
        function(resolve,reject){

          recorder.onstop =
            function(){
              resolve();
            };

          recorder.onerror =
            function(e){
              reject(
                e.error ||
                new Error(
                  "Video MediaRecorder hatası"
                )
              );
            };

        }
      );

    recorder.start(250);

    /*
      Logo preload
    */

    var logoImg = null;

    if(logoURL){

      try{

        logoImg =
          await loadImage(
            logoURL
          );

      }catch(e){

        logoImg = null;
      }
    }

    /*
      8. SAHNELER
    */

    for(
      var i=0;
      i<scenes.length;
      i++
    ){

      var scene =
        scenes[i];

      var img =
        images[i];

      var duration =
        durations[i];

      if(
        !isFinite(duration) ||
        duration <= 0
      ){

        throw new Error(
          "Sahne " +
          scene.id +
          " için geçersiz süre."
        );
      }

      setStatus(
        "🎬 Sahne " +
        scene.id +
        " / " +
        scenes.length +
        " hazırlanıyor... Ses süresi: " +
        duration.toFixed(2) +
        " sn"
      );

      setBadge(
        scene.id,
        "🎬 Render"
      );

      /*
        Audio
      */

      var arrayBuffer =
        await blobToArrayBuffer(
          scene.audioBlob
        );

      var audioBuffer =
        await new Promise(
          function(resolve,reject){

            audioCtx.decodeAudioData(
              arrayBuffer.slice(0),
              function(buffer){
                resolve(buffer);
              },
              function(error){
                reject(
                  error ||
                  new Error(
                    "Sahne sesi çözülemedi."
                  )
                );
              }
            );

          }
        );

      var source =
        audioCtx.createBufferSource();

      source.buffer =
        audioBuffer;

      source.connect(
        destination
      );

      /*
        Hareket parametreleri
      */

      var startTime =
        performance.now();

      var durationMs =
        duration * 1000;

      /*
        Hafif sinematik hareket
      */

      var moveDirection =
        i % 2 === 0 ? 1 : -1;

      source.start();

      while(true){

        var elapsed =
          performance.now() -
          startTime;

        var progressScene =
          Math.min(
            1,
            elapsed/durationMs
          );

        /*
          Yavaş zoom
        */

        var zoom =
          1.0 +
          progressScene * 0.10;

        /*
          Yatay kamera hareketi
        */

        var moveX =
          moveDirection *
          progressScene *
          canvas.width *
          0.025;

        var moveY =
          Math.sin(
            progressScene *
            Math.PI
          ) *
          canvas.height *
          0.012;

        /*
          Arka plan
        */

        ctx.fillStyle =
          "#000";

        ctx.fillRect(
          0,
          0,
          canvas.width,
          canvas.height
        );

        drawCover(
          ctx,
          img,
          canvas.width,
          canvas.height,
          zoom,
          moveX,
          moveY
        );

        drawLogoSync(
          ctx,
          logoImg,
          canvas.width,
          canvas.height
        );

        drawSubtitle(
          ctx,
          scene.text,
          canvas.width,
          canvas.height
        );

        setProgress(
          (
            (
              i +
              progressScene
            ) /
            scenes.length
          ) * 100
        );

        if(progressScene >= 1){
          break;
        }

        await new Promise(
          function(resolve){
            requestAnimationFrame(
              resolve
            );
          }
        );
      }

      /*
        Ses kaynağının tamamlanmasını bekle
      */

      await new Promise(
        function(resolve){
          setTimeout(
            resolve,
            100
          );
        }
      );

      try{
        source.stop();
      }catch(e){}

      source.disconnect();

      setBadge(
        scene.id,
        "✅ Tamamlandı"
      );
    }

    /*
      Recorder kapat
    */

    recorder.stop();

    await recorderFinished;

    /*
      Stream kapat
    */

    videoStream
      .getTracks()
      .forEach(function(track){

        try{
          track.stop();
        }catch(e){}

      });

    finalStream
      .getTracks()
      .forEach(function(track){

        try{
          track.stop();
        }catch(e){}

      });

    /*
      AudioContext kapat
    */

    try{
      await audioCtx.close();
    }catch(e){}

    /*
      Blob
    */

    var videoBlob =
      new Blob(
        chunks,
        {
          type:
            outputMime ||
            "video/webm"
        }
      );

    if(videoBlob.size <= 0){

      throw new Error(
        "Video dosyası boş oluştu."
      );
    }

    var videoURL =
      URL.createObjectURL(
        videoBlob
      );

    resultVideo.src =
      videoURL;

    resultVideo.load();

    downloadArea.innerHTML =
      "";

    var download =
      document.createElement("a");

    download.className =
      "download";

    download.href =
      videoURL;

    download.download =
      "GeldStory-Mina-Video-" +
      Date.now() +
      ".webm";

    download.textContent =
      "⬇️ WEBM VİDEOYU İNDİR";

    downloadArea.appendChild(
      download
    );

    setProgress(100);

    setStatus(
      "🎉 VİDEO HAZIR! Gerçek sesler videoya eklendi."
    );

  }catch(error){

    console.error(error);

    setStatus(
      "❌ VİDEO OLUŞTURMA HATASI: " +
      error.message
    );

  }finally{

    renderRunning = false;

    renderBtn.disabled = false;
  }
}

   BUTONLAR
========================================================= */

createScenesBtn.addEventListener(
  "click",
  createScenes
);

generateImagesBtn.addEventListener(
  "click",
  generateAllImages
);

prepareAudioBtn.addEventListener(
  "click",
  prepareAudioCapture
);

recordAllBtn.addEventListener(
  "click",
  recordAll
);

stopAllBtn.addEventListener(
  "click",
  stopAll
);

renderBtn.addEventListener(
  "click",
  renderVideo
);


/* =========================================================
   BAŞLANGIÇ
========================================================= */

setStatus(
  "Mina Video AI V41.1 hazır. Hikâyeni girerek başlayabilirsin."
);

</script>
