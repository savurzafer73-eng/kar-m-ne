<!DOCTYPE html>

<html lang="tr">
<head>

<title>Batak Royale</title>

<style>
*{

    margin:0;
    padding:0;

html,body{

body{

button{

#app{

/* ================= MENU ================= */

#menu{
    position:absolute;
    inset:0;
    z-index:1000;
    display:flex;
    flex-direction:column;
    justify-content:center;

}

.logo{
    text-align:center;
    margin-bottom:35px;
}

.logoCards{
    font-size:52px;

    margin-bottom:12px;

.logo h1{

}

.logo p{

    letter-spacing:3px;
}

.menuBtn{
    width:min(340px,90vw);
    height:58px;
    margin:6px;
    border-radius:17px;

    font-size:16px;

    border:1px solid #50ca8b;
    box-shadow:

}

.menuBtn:active{
    transform:scale(.97);
}

.menuBtn.dark{

    border-color:#43564c;
}

.soundBtn{
    margin-top:18px;

}

/* ================= GAME ================= */

#game{
    position:absolute;
    inset:0;
    display:none;
}

.topbar{
    position:absolute;
    left:0;
    right:0;
    top:0;
    height:58px;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:7px 9px;
    background:linear-gradient(180deg,#07170f,#06130d);
    border-bottom:1px solid rgba(130,210,155,.15);
}

.stat{
    min-width:65px;
    text-align:center;
}

.stat small{

    color:#759a85;
    font-size:8px;
    letter-spacing:1px;
}

.stat b{
    display:block;
    margin-top:3px;
    font-size:14px;
}

.pauseBtn{
    width:40px;
    height:40px;
    border-radius:12px;
    background:#17251f;
    border:1px solid #3a5246;
    color:#fff;
    font-size:17px;
}

/* ================= TABLE ================= */

.table{
    position:absolute;
    top:58px;
    left:0;
    right:0;
    bottom:0;
    overflow:hidden;
    background:
        radial-gradient(ellipse at center,#17643d 0%,#0d4329 45%,#062316 78%,#03120b 100%);
}

.table:before{
    content:"";
    position:absolute;
    left:6%;
    right:6%;
    top:7%;
    bottom:7%;
    border:1px solid rgba(170,225,185,.12);
    border-radius:45%;
    box-shadow:
        inset 0 0 45px rgba(0,0,0,.28),
        0 0 45px rgba(0,0,0,.22);
}

/* ================= LABELS ================= */

.playerLabel{
    position:absolute;
    z-index:30;
    padding:6px 11px;
    border-radius:18px;
    background:rgba(2,10,6,.78);
    border:1px solid rgba(160,220,180,.2);
    box-shadow:0 5px 14px rgba(0,0,0,.5);
    font-size:9px;
    font-weight:900;
}

.labelTop{
    top:64px;
    left:50%;
    transform:translateX(-50%);
}

.labelRight{
    right:5px;
    top:47%;
}

.labelLeft{
    left:5px;
    top:47%;
}

.labelBottom{
    left:50%;
    bottom:5px;
    transform:translateX(-50%);
}

/* ================= HANDS ================= */

.hand{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    width:min(420px,94vw);
    z-index:40;
}

#partnerHand{
    top:89px;
}

#playerHand{
    bottom:51px;
}

.handTitle{
    text-align:center;
    color:#b7d8c1;
    font-size:8px;
    margin-bottom:3px;
    letter-spacing:.5px;
}

.handRows{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.handRow{
    width:max-content;
    display:flex;
    gap:0;
}

.handRow.bottom{
    position:relative;
    z-index:2;
    margin-top:-42px;
}

/* ================= CARDS ================= */

.card{
    position:relative;
    width:54px;
    height:84px;
    flex:0 0 54px;
    border-radius:7px;
    background:linear-gradient(135deg,#fff,#ededed);
    border:1px solid #d1d1d1;
    box-shadow:
        0 5px 9px rgba(0,0,0,.45),
        inset 0 0 0 1px rgba(0,0,0,.07);
    color:#111;
    overflow:hidden;
    transition:transform .15s ease,filter .15s ease;
}

.card.red{
    color:#c51d2b;
}

.card .corner{
    position:absolute;
    left:4px;
    top:3px;
    font-size:13px;
    line-height:15px;
    font-weight:900;
    z-index:2;
}

.card .bigSuit{
    position:absolute;
    left:0;
    right:0;
    top:22px;
    bottom:0;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:30px;
}

.card.playable{
    cursor:pointer;
}

.card.playable:active{
    transform:translateY(-10px) scale(1.03);
    filter:brightness(1.08);
}

@media(max-width:390px){

    .hand{
        width:100%;
    }

    .card{
        width:48px;
        height:78px;
        flex-basis:48px;
    }

    .handRow.bottom{
        margin-top:-39px;
    }

    .card .bigSuit{
        font-size:27px;
    }
}

.centerArea{

    left:50%;
    top:50%;

}

.centerGlow{

}

.played{
    position:absolute;

    height:84px;
    border-radius:7px;

    border:1px solid #ddd;

    align-items:center;

}

.played.red{
    color:#c51d2b;
}

.played .rank{

    left:5px;
    top:3px;
    font-size:13px;
}

.played.show{
    opacity:1;
    animation:cardEnter .38s cubic-bezier(.2,.8,.2,1);
}

@keyframes cardEnter{
    from{
        opacity:0;
        transform:scale(.45);
    }
    to{

        transform:scale(1);
    }
}

.played.p0{

}

.played.p1{

}

.played.p2{

    font-weight:900;

    pointer-events:none;

    white-space:nowrap;
}

#toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* ================= BID ================= */

#bidOverlay{

    padding-top:63px;

}

#bidPanel{

    padding:11px 13px;

.bidInfo{

    margin-bottom:7px;
}

.bidButtons{

.bidBtn{

.bidBtn.pass{

.bidBtn:disabled{

/* ================= TRUMP ================= */

    border:1px solid #37684f;
    color:#fff;
    font-size:32px;
}

.trumpBtn.red{

}

/* ================= RESULT ================= */

.resultBig{

.actionBtn{

    background:linear-gradient(#238f59,#12623b);

    font-weight:900;
}

.actionBtn.dark{

    border-color:#3a5044;

/* ================= WIN ================= */

.winFlash{
    animation:flash .65s ease;
}

@keyframes flash{
    0%{filter:brightness(1)}
    45%{filter:brightness(1.7)}
    100%{filter:brightness(1)}
}
</style>

<script>
"use strict";

/* =========================================================
   BATAK ROYALE
   TEMİZ ÇALIŞAN SÜRÜM
   ========================================================= */

const SUITS = ["♠","♥","♦","♣"];

const SUIT_ORDER = {
    "♠":0,
    "♥":1,
    "♦":2,
    "♣":3
};

const RANKS = [
    {name:"2",value:2},
    {name:"3",value:3},
    {name:"4",value:4},
    {name:"5",value:5},
    {name:"6",value:6},
    {name:"7",value:7},
    {name:"8",value:8},
    {name:"9",value:9},
    {name:"10",value:10},
    {name:"J",value:11},
    {name:"Q",value:12},
    {name:"K",value:13},
    {name:"A",value:14}
];

const NAMES = [
    "SEN",
    "RAKİP 1",
    "PARTNER",
    "RAKİP 2"
];

let S = createState();

let soundOn = true;
let audioCtx = null;
let toastTimer = null;
let turnTimer = null;

function createState(){

    return {
        team:false,
        round:1,

        deck:[],
        hands:[[],[],[],[]],

        auctionTurn:0,
        bidWinner:0,
        bidStep:0,
        currentBid:0,

        trump:null,

        turn:0,
        leadSuit:null,

        trick:[],
        tricks:[0,0,0,0],

        scoreA:0,
        scoreB:0,

        playing:false,
        paused:false,
        busy:false
    };
}

/* ================= AUDIO ================= */

function beep(freq=500,duration=.07,type="sine"){

    if(!soundOn) return;

    try{

        if(!audioCtx){
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        if(audioCtx.state==="suspended"){
            audioCtx.resume();
        }

        const osc=audioCtx.createOscillator();
        const gain=audioCtx.createGain();

        osc.type=type;
        osc.frequency.value=freq;

        gain.gain.setValueAtTime(.0001,audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(.07,audioCtx.currentTime+.01);
        gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime+duration+.02);

    }catch(e){}
}

function toggleSound(){

    soundOn=!soundOn;

    document.getElementById("soundText").textContent =
        soundOn ? "AÇIK" : "KAPALI";

    if(soundOn){
        beep(700,.08);
    }
}

/* ================= CARDS ================= */

function compareCards(a,b){

    if(a.suit!==b.suit){
        return SUIT_ORDER[a.suit]-SUIT_ORDER[b.suit];
    }

    return b.value-a.value;
}

function makeDeck(){

    const deck=[];

    for(const suit of SUITS){

        for(const rank of RANKS){

            deck.push({
                suit:suit,
                name:rank.name,
                value:rank.value
            });

        }

    }

    return deck;
}

function shuffle(deck){

    for(let i=deck.length-1;i>0;i--){

        const j=Math.floor(Math.random()*(i+1));

        const temp=deck[i];

        deck[i]=deck[j];
        deck[j]=temp;
    }

    return deck;
}

function cardName(card){
    return card.name+card.suit;
}

/* ================= MENU ================= */

function startGame(team){

    beep(620,.08);

    S=createState();

    S.team=team;

    document.getElementById("menu").style.display="none";
    document.getElementById("game").style.display="block";

    startRound();
}

function backMenu(){

    clearTimeout(turnTimer);

    S.playing=false;
    S.busy=false;
    S.paused=false;

    hideAllOverlays();

    document.getElementById("game").style.display="none";
    document.getElementById("menu").style.display="flex";
}

function hideAllOverlays(){

    document.getElementById("bidOverlay").classList.remove("show");
    document.getElementById("trumpOverlay").classList.remove("show");
    document.getElementById("pauseOverlay").classList.remove("show");
    document.getElementById("resultOverlay").classList.remove("show");
}

/* ================= ROUND ================= */

function startRound(){

    clearTimeout(turnTimer);

    S.deck=shuffle(makeDeck());
    S.hands=[[],[],[],[]];

    for(let i=0;i<52;i++){
        S.hands[i%4].push(S.deck[i]);
    }

    for(let p=0;p<4;p++){
        S.hands[p].sort(compareCards);
    }

    S.auctionTurn=(S.round-1)%4;
    S.bidWinner=S.auctionTurn;
    S.bidStep=0;
    S.currentBid=0;

    S.trump=null;
    S.turn=0;
    S.leadSuit=null;

    S.trick=[];
    S.tricks=[0,0,0,0];

    S.playing=false;
    S.busy=false;
    S.paused=false;

    clearPlayedCards();

    updateTop();
    renderHands();

    document.getElementById("resultOverlay").classList.remove("show");
    document.getElementById("trumpOverlay").classList.remove("show");

    startAuction();
}

/* ================= TOP ================= */

function updateTop(){

    document.getElementById("roundText").textContent=S.round;

    document.getElementById("trumpText").textContent=
        S.trump || "—";

    document.getElementById("scoreText").textContent=
        S.scoreA+" - "+S.scoreB;
}

/* ================= HAND RENDER ================= */

function createCardElement(card,player,index){

    const el=document.createElement("div");

    el.className="card";

    if(card.suit==="♥" || card.suit==="♦"){
        el.classList.add("red");
    }

    el.innerHTML=
        '<div class="corner">'+
        card.name+
        '<br>'+
        card.suit+
        '</div>'+
        '<div class="bigSuit">'+
        card.suit+
        '</div>';

    if(player===0 &&
       S.playing &&
       S.turn===0 &&
       canPlayCard(0,index)){

        el.classList.add("playable");

        el.onclick=function(){
            playCard(0,index);
        };
    }

    if(player===2 &&
       S.team &&
       S.playing &&
       S.turn===2 &&
       canPlayCard(2,index)){

        el.classList.add("playable");

        el.onclick=function(){
            playCard(2,index);
        };
    }

    return el;
}

function renderHands(){

    const playerRow1=document.getElementById("playerRow1");
    const playerRow2=document.getElementById("playerRow2");

    const partnerRow1=document.getElementById("partnerRow1");
    const partnerRow2=document.getElementById("partnerRow2");

    playerRow1.innerHTML="";
    playerRow2.innerHTML="";
    partnerRow1.innerHTML="";
    partnerRow2.innerHTML="";

    S.hands[0].sort(compareCards);

    S.hands[0].forEach(function(card,index){

        const el=createCardElement(card,0,index);

        if(index<6){
            playerRow1.appendChild(el);
        }else{
            playerRow2.appendChild(el);
        }
    });

    if(S.team){

        S.hands[2].sort(compareCards);

        S.hands[2].forEach(function(card,index){

            const el=createCardElement(card,2,index);

            if(index<6){
                partnerRow1.appendChild(el);
            }else{
                partnerRow2.appendChild(el);
            }
        });
    }
}

/* ================= AUCTION ================= */

function startAuction(){

    S.playing=false;
    S.busy=false;

    document.getElementById("bidOverlay").classList.add("show");

    updateBidUI();
}

function updateBidUI(){

    const name=NAMES[S.auctionTurn];

    document.getElementById("bidTurnName").textContent=
        name+" İHALEDE";

    const userTurn=S.auctionTurn===0;

    document.querySelectorAll(".bidBtn").forEach(function(btn){
        btn.disabled=!userTurn;
        btn.style.opacity=userTurn ? "1" : ".45";
    });

    if(!userTurn){

        clearTimeout(turnTimer);

        turnTimer=setTimeout(function(){
            aiBid();
        },700);
    }
}

function playerBid(value){

    if(S.auctionTurn!==0) return;
    if(S.busy) return;

    beep(value===0 ? 250 : 650,.07);

    processBid(0,value);
}

function aiBid(){

    if(S.auctionTurn===0) return;
    if(S.busy) return;

    const player=S.auctionTurn;
    const hand=S.hands[player];

    let strength=0;

    for(const card of hand){

        if(card.value===14){
            strength+=2;
        }else if(card.value===13){
            strength+=1;
        }else if(card.value===12){
            strength+=.5;
        }
    }

    let bid=0;

    if(strength>=9){
        bid=9;
    }else if(strength>=7){
        bid=8;
    }else if(strength>=5){
        bid=7;
    }else if(strength>=3){
        bid=6;
    }

    if(bid<=S.currentBid){
        bid=0;
    }

    processBid(player,bid);
}

function processBid(player,bid){

    if(S.busy) return;

    if(bid>0){

        if(bid<=S.currentBid){
            toast("Daha yüksek ihale vermelisin");
            return;
        }

        S.currentBid=bid;

        /*
           ÖNEMLİ:
           İhalenin gerçek kazananını burada saklıyoruz.
        */

        S.bidWinner=player;

        toast(
            NAMES[player]+" "+bid+" aldı"
        );
    }

    S.bidStep++;

    if(S.bidStep>=4){

        finishAuction();
        return;
    }

    S.auctionTurn=(player+1)%4;

    updateBidUI();
}

function finishAuction(){

    document.getElementById("bidOverlay").classList.remove("show");

    if(S.currentBid===0){

        S.bidWinner=0;
        S.currentBid=5;

        toast("Herkes pas geçti — ihale sana 5");

        turnTimer=setTimeout(function(){
            openTrumpFor(0);
        },700);

        return;
    }

    const winner=S.bidWinner;

    toast(
        NAMES[winner]+" ihaleyi "+
        S.currentBid+
        " ile aldı"
    );

    turnTimer=setTimeout(function(){
        openTrumpFor(winner);
    },800);
}

/* ================= TRUMP ================= */

function openTrumpFor(player){

    S.bidWinner=player;

    if(player===0){

        document.getElementById("trumpOverlay").classList.add("show");

        return;
    }

    aiTrump(player);
}

function chooseTrump(suit){

    if(S.bidWinner!==0) return;

    S.trump=suit;

    document.getElementById("trumpOverlay").classList.remove("show");

    beep(850,.1);

    toast("KOZ: "+suit);

    turnTimer=setTimeout(function(){
        startPlay();
    },500);
}

function aiTrump(player){

    const counts={
        "♠":0,
        "♥":0,
        "♦":0,
        "♣":0
    };

    for(const card of S.hands[player]){
        counts[card.suit]++;
    }

    let best=SUITS[0];

    for(const suit of SUITS){

        if(counts[suit]>counts[best]){
            best=suit;
        }
    }

    S.trump=best;

    updateTop();

    toast(
        NAMES[player]+" koz seçti: "+best
    );

    turnTimer=setTimeout(function(){
        startPlay();
    },700);
}

/* ================= PLAY START ================= */

function startPlay(){

    S.playing=true;
    S.busy=false;

    S.turn=S.bidWinner;

    S.trick=[];
    S.leadSuit=null;

    updateTop();
    renderHands();

    turnTimer=setTimeout(function(){
        nextTurn();
    },450);
}

/* ================= VALID CARD ================= */

function canPlayCard(player,index){

    if(!S.playing) return false;
    if(S.paused) return false;
    if(S.turn!==player) return false;

    const hand=S.hands[player];

    if(index<0 || index>=hand.length){
        return false;
    }

    if(!S.leadSuit){
        return true;
    }

    const card=hand[index];

    const hasLead=hand.some(function(c){
        return c.suit===S.leadSuit;
    });

    if(hasLead){
        return card.suit===S.leadSuit;
    }

    return true;
}

/* ================= TURN ================= */

function nextTurn(){

    if(!S.playing) return;
    if(S.paused) return;
    if(S.busy) return;

    if(S.trick.length>=4) return;

    const player=S.turn;

    /* SEN */

    if(player===0){

        renderHands();

        toast("Sıra sende");

        return;
    }

    /* PARTNER */

    if(player===2 && S.team){

        renderHands();

        toast("PARTNER KARTINI SEN OYNA");

        return;
    }

    /* AI */

    clearTimeout(turnTimer);

    turnTimer=setTimeout(function(){

        if(!S.playing || S.paused) return;

        const index=chooseAICard(player);

        playCard(player,index);

    },650);
}

/* ================= AI ================= */

function chooseAICard(player){

    const hand=S.hands[player];
    const valid=[];

    for(let i=0;i<hand.length;i++){

        if(canPlayCard(player,i)){
            valid.push(i);
        }
    }

    if(valid.length===0){
        return 0;
    }

    /* Liderlik */

    if(!S.leadSuit){

        let best=valid[0];

        for(const i of valid){

            if(hand[i].value>hand[best].value){
                best=i;
            }
        }

        return best;
    }

    /* Kazanabilecekleri bul */

    const winning=[];

    for(const i of valid){

        if(cardBeats(hand[i],currentWinningCard())){
            winning.push(i);
        }
    }

    if(winning.length){

        let best=winning[0];

        for(const i of winning){

            if(cardPower(hand[i])<cardPower(hand[best])){
                best=i;
            }
        }

        return best;
    }

    /* En düşük kart */

    let low=valid[0];

    for(const i of valid){

        if(cardPower(hand[i])<cardPower(hand[low])){
            low=i;
        }
    }

    return low;
}

function cardPower(card){

    if(card.suit===S.trump){
        return 100+card.value;
    }

    if(card.suit===S.leadSuit){
        return 50+card.value;
    }

    return card.value;
}

function currentWinningCard(){

    if(S.trick.length===0){
        return null;
    }

    let best=S.trick[0];

    for(let i=1;i<S.trick.length;i++){

        if(cardBeats(S.trick[i].card,best.card)){
            best=S.trick[i];
        }
    }

    return best.card;
}

function cardBeats(a,b){

    if(!b) return true;

    if(a.suit===b.suit){
        return a.value>b.value;
    }

    if(a.suit===S.trump && b.suit!==S.trump){
        return true;
    }

    if(a.suit!==S.trump && b.suit===S.trump){
        return false;
    }

    if(a.suit===S.leadSuit && b.suit!==S.leadSuit){
        return true;
    }

    return false;
}

/* ================= PLAY CARD ================= */

async function playCard(player,index){

    if(S.busy) return;

    if(!canPlayCard(player,index)){

        if(player===0 || (player===2 && S.team)){
            toast("Bu kartı oynayamazsın");
            beep(180,.06);
        }

        return;
    }

    S.busy=true;

    const card=S.hands[player][index];

    if(!S.leadSuit){
        S.leadSuit=card.suit;
    }

    S.hands[player].splice(index,1);

    S.trick.push({
        player:player,
        card:card
    });

    renderHands();

    showPlayedCard(player,card);

    beep(
        520+(player*80),
        .08
    );

    toast(
        NAMES[player]+" → "+cardName(card)
    );

    S.turn=(player+1)%4;

    if(S.trick.length===4){

        await sleep(700);

        resolveTrick();

        return;
    }

    S.busy=false;

    await sleep(300);

    nextTurn();
}

/* ================= CARD ANIMATION ================= */

function showPlayedCard(player,card){

    const el=document.getElementById("played"+player);

    el.className="played p"+player;

    if(card.suit==="♥" || card.suit==="♦"){
        el.classList.add("red");
    }

    el.innerHTML=
        '<span class="rank">'+
        card.name+
        card.suit+
        '</span>'+
        '<span>'+
        card.suit+
        '</span>';

    void el.offsetWidth;

    el.classList.add("show");
}

/* ================= TRICK ================= */

function resolveTrick(){

    if(S.trick.length!==4){
        S.busy=false;
        return;
    }

    let winner=S.trick[0];

    for(let i=1;i<S.trick.length;i++){

        if(cardBeats(
            S.trick[i].card,
            winner.card
        )){
            winner=S.trick[i];
        }
    }

    const winnerPlayer=winner.player;

    S.tricks[winnerPlayer]++;

    const name=document.getElementById("trickName");

    name.textContent=
        NAMES[winnerPlayer]+" ELİ ALDI";

    name.classList.add("show");

    document.querySelector(".table")
        .classList.add("winFlash");

    beep(900,.14);

    setTimeout(function(){

        document.querySelector(".table")
            .classList.remove("winFlash");

        moveCardsToWinner(winnerPlayer);

    },550);
}

/* ================= WINNER MOVE ================= */

function moveCardsToWinner(player){

    document.querySelectorAll(".played")
        .forEach(function(el){

            if(!el.classList.contains("show")){
                return;
            }

            el.style.transition=
                "all .5s cubic-bezier(.2,.8,.2,1)";

            if(player===0){

                el.style.transform=
                    "translateY(105px) scale(.35)";

            }else if(player===1){

                el.style.transform=
                    "translateX(110px) scale(.35)";

            }else if(player===2){

                el.style.transform=
                    "translateY(-105px) scale(.35)";

            }else{

                el.style.transform=
                    "translateX(-110px) scale(.35)";
            }

            el.style.opacity="0";
        });

    setTimeout(function(){

        clearPlayedCards();

        document.getElementById("trickName")
            .classList.remove("show");

        S.trick=[];
        S.leadSuit=null;

        const finished=
            S.hands[0].length===0 &&
            S.hands[1].length===0 &&
            S.hands[2].length===0 &&
            S.hands[3].length===0;

        if(finished){

            finishRound();
            return;
        }

        S.turn=player;

        S.busy=false;

        renderHands();

        turnTimer=setTimeout(function(){
            nextTurn();
        },350);

    },550);
}

/* ================= CLEAR ================= */

function clearPlayedCards(){

    for(let i=0;i<4;i++){

        const el=document.getElementById("played"+i);

        el.className="played p"+i;
        el.innerHTML="";
        el.style="";
    }
}

/* ================= RESULT ================= */

function finishRound(){

    S.playing=false;
    S.busy=false;

    let teamA;
    let teamB;

    if(S.team){

        teamA=S.tricks[0]+S.tricks[2];
        teamB=S.tricks[1]+S.tricks[3];

    }else{

        teamA=S.tricks[0];
        teamB=
            S.tricks[1]+
            S.tricks[2]+
            S.tricks[3];
    }

    S.scoreA+=teamA;
    S.scoreB+=teamB;

    updateTop();

    let title;
    let icon;

    if(teamA>teamB){

        title=S.team
            ? "🏆 SENİN TAKIMIN KAZANDI"
            : "🏆 SEN KAZANDIN";

        icon="🏆";

    }else if(teamB>teamA){

        title="RAKİPLER KAZANDI";
        icon="😈";

    }else{

        title="BERABERE";
        icon="🤝";
    }

    document.getElementById("resultTitle")
        .textContent=title;

    document.getElementById("resultBig")
        .textContent=icon;

    document.getElementById("resultScore")
        .textContent=
        "Sen: "+teamA+
        " el  •  Rakip: "+teamB+" el";

    document.getElementById("resultOverlay")
        .classList.add("show");
}

/* ================= NEW ROUND ================= */

function newRound(){

    S.round++;

    document.getElementById("resultOverlay")
        .classList.remove("show");

    startRound();
}

/* ================= PAUSE ================= */

function pauseGame(){

    if(!S.playing) return;

    if(S.paused){

        S.paused=false;

        document.getElementById("pauseOverlay")
            .classList.remove("show");

        nextTurn();

    }else{

        S.paused=true;

        clearTimeout(turnTimer);

        document.getElementById("pauseOverlay")
            .classList.add("show");
    }
}

/* ================= TOAST ================= */

function toast(text){

    const el=document.getElementById("toast");

    el.textContent=text;

    el.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer=setTimeout(function(){

        el.classList.remove("show");

    },1200);
}

/* ================= SLEEP ================= */

function sleep(ms){

    return new Promise(function(resolve){
        setTimeout(resolve,ms);
    });
}

/* ================= VISIBILITY ================= */

document.addEventListener(
    "visibilitychange",
    function(){

        if(
            document.hidden &&
            S.playing &&
            !S.paused
        ){

            S.paused=true;

            document.getElementById("pauseOverlay")
                .classList.add("show");
        }
    }
);
</script>
