<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mina Video AI V15</title>

<style>
*{box-sizing:border-box}
html,body{
    margin:0;
    padding:0;
    background:#080b12;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}
button,input,textarea,select{
    font:inherit;
}
button{
    cursor:pointer;
}
.app{
    min-height:100vh;
}
.header{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    background:#101520;
    border-bottom:1px solid #202938;
    position:sticky;
    top:0;
    z-index:20;
}
.logo{
    display:flex;
    align-items:center;
    gap:12px;
    font-size:21px;
    font-weight:bold;
}
.logoIcon{
    width:42px;
    height:42px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#7c3aed,#ec4899);
    font-size:23px;
}
.status{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:#aeb8c9;
}
.dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#22c55e;
    box-shadow:0 0 12px #22c55e;
}
.layout{
    display:grid;
    grid-template-columns:360px 1fr 390px;
    min-height:calc(100vh - 70px);
}
.panel{
    border-right:1px solid #202938;
    background:#0d121b;
}
.panel.right{
    border-right:0;
    border-left:1px solid #202938;
}
.panelTitle{
    padding:18px 20px 10px;
    font-size:14px;
    font-weight:bold;
    color:#cbd5e1;
}
.section{
    padding:12px 18px 18px;
    border-bottom:1px solid #1c2533;
}
label{
    display:block;
    color:#91a0b5;
    font-size:12px;
    margin:0 0 7px;
}
textarea,input,select{
    width:100%;
    background:#111824;
    color:#fff;
    border:1px solid #293447;
    border-radius:10px;
    outline:none;
}
textarea{
    min-height:230px;
    padding:13px;
    resize:vertical;
    line-height:1.5;
}
input,select{
    height:42px;
    padding:0 11px;
}
textarea:focus,input:focus,select:focus{
    border-color:#8b5cf6;
    box-shadow:0 0 0 2px #8b5cf622;
}
.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}
.row3{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:8px;
}
.btn{
    border:0;
    border-radius:10px;
    min-height:42px;
    padding:0 14px;
    color:#fff;
    font-weight:bold;
}
.primary{
    background:linear-gradient(135deg,#7c3aed,#ec4899);
}
.secondary{
    background:#1a2331;
    border:1px solid #303d50;
}
.success{
    background:#166534;
}
.danger{
    background:#7f1d1d;
}
.btn:active{
    transform:scale(.98);
}
.full{
    width:100%;
}
.small{
    font-size:12px;
}
.center{
    background:#080c13;
    display:flex;
    flex-direction:column;
    min-width:0;
}
.preview{
    flex:1;
    padding:22px;
}
.previewBox{
    width:100%;
    max-width:920px;
    aspect-ratio:16/9;
    margin:auto;
    background:#03050a;
    border:1px solid #263142;
    border-radius:16px;
    overflow:hidden;
    position:relative;
    box-shadow:0 20px 60px #0008;
}
.previewImage{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}
.previewOverlay{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    padding:28px;
    background:linear-gradient(transparent 55%,#000b);
}
.sceneBadge{
    align-self:flex-start;
    padding:6px 10px;
    background:#0009;
    border:1px solid #ffffff25;
    border-radius:20px;
    font-size:12px;
    margin-bottom:12px;
}
.subtitle{
    font-size:20px;
    font-weight:bold;
    line-height:1.35;
    text-shadow:0 2px 8px #000;
    min-height:27px;
}
.previewControls{
    max-width:920px;
    margin:14px auto 0;
    width:100%;
    display:flex;
    gap:8px;
    align-items:center;
}
.timeline{
    height:95px;
    background:#0d121b;
    border-top:1px solid #202938;
    padding:12px 16px;
    overflow-x:auto;
}
.timelineInner{
    display:flex;
    gap:8px;
    height:68px;
    min-width:max-content;
}
.timeScene{
    width:130px;
    border:1px solid #293447;
    background:#111824;
    border-radius:9px;
    overflow:hidden;
    position:relative;
}
.timeScene.active{
    border-color:#a78bfa;
    box-shadow:0 0 0 1px #a78bfa;
}
.timeThumb{
    width:100%;
    height:43px;
    object-fit:cover;
    display:block;
    background:#070a10;
}
.timeLabel{
    font-size:10px;
    padding:4px 6px;
    color:#b7c0cf;
    white-space:nowrap;
    overflow:hidden;
}
.sceneList{
    max-height:calc(100vh - 160px);
    overflow:auto;
}
.sceneCard{
    margin:10px 14px;
    padding:10px;
    border:1px solid #273245;
    background:#101722;
    border-radius:12px;
}
.sceneCard.active{
    border-color:#8b5cf6;
    box-shadow:0 0 0 1px #8b5cf633;
}
.sceneTop{
    display:flex;
    justify-content:space-between;
    gap:8px;
    align-items:center;
    margin-bottom:8px;
}
.sceneNumber{
    font-weight:bold;
    font-size:13px;
}
.sceneDuration{
    font-size:11px;
    color:#9ca3af;
}
.sceneThumb{
    width:100%;
    aspect-ratio:16/9;
    object-fit:cover;
    border-radius:8px;
    background:#070a10;
    display:block;
}
.sceneText{
    font-size:11px;
    color:#aeb8c9;
    margin-top:8px;
    line-height:1.4;
    max-height:42px;
    overflow:hidden;
}
.sceneActions{
    display:flex;
    gap:6px;
    margin-top:9px;
}
.iconBtn{
    flex:1;
    height:32px;
    background:#192231;
    color:#dbe4f0;
    border:1px solid #2b394c;
    border-radius:7px;
    font-size:11px;
}
.progressWrap{
    margin-top:10px;
}
.progress{
    height:7px;
    background:#1a2331;
    border-radius:20px;
    overflow:hidden;
}
.progressBar{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,#7c3aed,#ec4899);
    transition:.2s;
}
.log{
    max-height:120px;
    overflow:auto;
    font-family:monospace;
    font-size:10px;
    color:#8fa0b6;
    background:#080c13;
    padding:9px;
    border-radius:8px;
    margin-top:9px;
}
.settingsGrid{
    display:grid;
    gap:10px;
}
.checkbox{
    display:flex;
    align-items:center;
    gap:8px;
    color:#aeb8c9;
    font-size:12px;
}
.checkbox input{
    width:auto;
    height:auto;
}
.empty{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#66758a;
    text-align:center;
    padding:30px;
}
.kbd{
    background:#1a2331;
    border:1px solid #303d50;
    padding:2px 6px;
    border-radius:5px;
    font-size:10px;
}
@media(max-width:1100px){
    .layout{
        grid-template-columns:300px 1fr;
    }
    .panel.right{
        display:none;
    }
}
@media(max-width:760px){
    .layout{
        display:block;
    }
    .panel{
        border:0;
        border-bottom:1px solid #202938;
    }
    .sceneList{
        max-height:none;
    }
    .preview{
        padding:10px;
    }
    .header{
        padding:0 12px;
    }
}
</style>
</head>

<body>
<div class="app">

<header class="header">
    <div class="logo">
        <div class="logoIcon">🎬</div>
        <div>Mina Video AI <span style="color:#a78bfa">V15</span></div>
    </div>

    <div class="status">
        <span class="dot"></span>
        <span id="statusText">Hazır</span>
    </div>
</header>

<div class="layout">

<!-- SOL PANEL -->
<aside class="panel">

    <div class="panelTitle">📝 Hikâye</div>

    <div class="section">
        <label>Hikâyeni buraya yaz</label>

        <textarea id="story" placeholder="Örneğin:

1950 yılında Amerika'da küçük bir restoranın sahibi olan yaşlı bir adam vardı.

Yıllarca başarısız olmuştu. İnsanlar onun hayallerinden vazgeçmesini söylüyordu.

Ama o pes etmedi.

Bir gün kapısını çalan bir adam, hayatını değiştirecek bir teklif yaptı..."></textarea>

        <div style="height:10px"></div>

        <button class="btn primary full" id="splitBtn">
            🧠 Hikâyeyi Sahnelere Böl
        </button>
    </div>

    <div class="panelTitle">🎨 Görsel Ayarları</div>

    <div class="section">
        <div class="settingsGrid">

            <div>
                <label>Görsel tarzı</label>
                <select id="visualStyle">
                    <option value="cinematic realistic">Sinematik Gerçekçi</option>
                    <option value="dark cinematic">Karanlık Sinematik</option>
                    <option value="documentary realistic">Belgesel Gerçekçi</option>
                    <option value="historical cinematic">Tarihsel Sinematik</option>
                    <option value="noir cinematic">Film Noir</option>
                    <option value="dramatic realistic">Dramatik Gerçekçi</option>
                </select>
            </div>

            <div>
                <label>Görüntü oranı</label>
                <select id="aspect">
                    <option value="16:9">16:9 YouTube</option>
                    <option value="9:16">9:16 Shorts</option>
                    <option value="1:1">1:1 Instagram</option>
                </select>
            </div>

            <div>
                <label>Görsel model</label>
                <select id="model">
                    <option value="flux">Flux</option>
                </select>
            </div>

            <div class="row">
                <div>
                    <label>Sahne süresi</label>
                    <select id="duration">
                        <option value="5">5 sn</option>
                        <option value="7" selected>7 sn</option>
                        <option value="10">10 sn</option>
                        <option value="12">12 sn</option>
                    </select>
                </div>

                <div>
                    <label>FPS</label>
                    <select id="fps">
                        <option>24</option>
                        <option selected>30</option>
                        <option>60</option>
                    </select>
                </div>
            </div>

        </div>
    </div>

    <div class="panelTitle">🎥 Kamera</div>

    <div class="section">
        <select id="camera">
            <option value="slow cinematic push in">Yavaş yaklaşma</option>
            <option value="slow cinematic zoom out">Yavaş uzaklaşma</option>
            <option value="smooth camera pan left">Sola kamera hareketi</option>
            <option value="smooth camera pan right">Sağa kamera hareketi</option>
            <option value="slow cinematic tilt up">Yukarı tilt</option>
            <option value="slow cinematic tilt down">Aşağı tilt</option>
            <option value="subtle handheld movement">Hafif handheld</option>
            <option value="static cinematic camera">Sabit sinematik</option>
        </select>
    </div>

    <div class="panelTitle">🔊 Ses</div>

    <div class="section">

        <div class="checkbox">
            <input type="checkbox" id="voiceEnabled" checked>
            <span>Seslendirme kullan</span>
        </div>

        <br>

        <label>Seslendirme metni</label>

        <textarea id="voiceText" style="min-height:120px"
        placeholder="Hikâyenin seslendirme metni..."></textarea>

        <br><br>

        <button class="btn secondary full" id="voiceBtn">
            🎙️ Tarayıcı Seslendirmesi
        </button>

        <div style="height:8px"></div>

        <div class="checkbox">
            <input type="checkbox" id="subtitleEnabled" checked>
            <span>Altyazı göster</span>
        </div>

    </div>

</aside>


<!-- ORTA PANEL -->
<main class="center">

    <div class="preview">

        <div class="previewBox">

            <img
                id="previewImage"
                class="previewImage"
                src=""
                alt="Mina Video AI">

            <div class="previewOverlay">

                <div class="sceneBadge" id="previewBadge">
                    Sahne yok
                </div>

                <div class="subtitle" id="previewSubtitle"></div>

            </div>

        </div>

        <div class="previewControls">

            <button class="btn secondary" id="prevBtn">◀</button>

            <button class="btn primary" id="playBtn">▶ Oynat</button>

            <button class="btn secondary" id="nextBtn">▶</button>

            <div style="flex:1"></div>

            <span class="small" id="previewCounter">0 / 0</span>

        </div>

    </div>

    <div class="timeline">
        <div class="timelineInner" id="timeline"></div>
    </div>

</main>


<!-- SAĞ PANEL -->
<aside class="panel right">

    <div class="panelTitle">
        🎬 Sahneler
        <span id="sceneCount" style="color:#8b5cf6">(0)</span>
    </div>

    <div class="sceneList" id="sceneList">

        <div class="empty" id="emptyState">
            <div>
                <div style="font-size:40px;margin-bottom:12px">🎬</div>
                <div>Henüz sahne oluşturulmadı.</div>
                <div style="font-size:12px;margin-top:8px">
                    Soldaki hikâyeyi yaz ve<br>
                    <b>“Hikâyeyi Sahnelere Böl”</b> butonuna bas.
                </div>
            </div>
        </div>

    </div>

    <div class="section">

        <button class="btn primary full" id="generateAllBtn">
            🖼️ Tüm Görselleri Üret
        </button>

        <div style="height:8px"></div>

        <button class="btn secondary full" id="generateCurrentBtn">
            🖼️ Aktif Sahneyi Üret
        </button>

        <div style="height:8px"></div>

        <button class="btn success full" id="previewVideoBtn">
            🎞️ Video Önizlemesi
        </button>

        <div style="height:8px"></div>

        <button class="btn secondary full" id="exportBtn">
            💾 Projeyi Kaydet
        </button>

        <div class="progressWrap">
            <div class="progress">
                <div class="progressBar" id="progressBar"></div>
            </div>
        </div>

        <div class="log" id="log">
            Mina Video AI V15 hazır.
        </div>

    </div>

</aside>

</div>
</div>


<script>
/* =========================================================
   MINA VIDEO AI V15
   ========================================================= */

const state = {
    scenes: [],
    active: 0,
    playing: false,
    timer: null,
    generated: 0
};

const $ = id => document.getElementById(id);

function log(message){
    const box = $("log");
    const time = new Date().toLocaleTimeString();
    box.innerHTML += "<div>[" + time + "] " + escapeHTML(message) + "</div>";
    box.scrollTop = box.scrollHeight;
}

function escapeHTML(str){
    return String(str || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;");
}

function setStatus(text){
    $("statusText").textContent = text;
}

function setProgress(value){
    $("progressBar").style.width = Math.max(0,Math.min(100,value)) + "%";
}

function slug(text){
    return text
        .toLowerCase()
        .replace(/[ğ]/g,"g")
        .replace(/[ü]/g,"u")
        .replace(/[ş]/g,"s")
        .replace(/[ı]/g,"i")
        .replace(/[ö]/g,"o")
        .replace(/[ç]/g,"c")
        .replace(/[^a-z0-9]+/g,"-")
        .replace(/^-+|-+$/g,"")
        .slice(0,100);
}


/* ---------------------------------------------------------
   HİKÂYE ANALİZİ
--------------------------------------------------------- */

function splitIntoSentences(text){

    return text
        .replace(/\r/g,"")
        .split(/(?<=[.!?])\s+|\n+/)
        .map(x => x.trim())
        .filter(x => x.length > 10);
}


function buildScenePrompt(text,index){

    const style = $("visualStyle").value;
    const camera = $("camera").value;

    const cinematicContext = [
        "cinematic composition",
        "highly detailed",
        "photorealistic",
        "dramatic lighting",
        "natural skin texture",
        "realistic environment",
        "film still",
        "professional cinematography",
        style,
        camera,
        "no text",
        "no subtitles",
        "no watermark"
    ].join(", ");

    return text + ", " + cinematicContext;
}


function createScenes(){

    const story = $("story").value.trim();

    if(!story){
        alert("Önce hikâyeni yazmalısın.");
        return;
    }

    const sentences = splitIntoSentences(story);

    if(sentences.length === 0){
        alert("Hikâye analiz edilemedi.");
        return;
    }

    /*
      Çok kısa cümleleri birleştirerek daha doğal sahneler
      oluşturuyoruz.
    */

    const scenes = [];

    let buffer = "";

    sentences.forEach(sentence => {

        if((buffer + " " + sentence).length < 260){
            buffer += (buffer ? " " : "") + sentence;
        }else{
            if(buffer){
                scenes.push(buffer);
            }
            buffer = sentence;
        }

    });

    if(buffer){
        scenes.push(buffer);
    }

    state.scenes = scenes.map((text,index)=>({

        id: Date.now() + "_" + index,

        number:index + 1,

        text:text,

        prompt:buildScenePrompt(text,index),

        image:"",

        duration:Number($("duration").value),

        subtitle:text,

        voice:text,

        camera:$("camera").value

    }));

    state.active = 0;

    $("voiceText").value = state.scenes
        .map(s => s.voice)
        .join(" ");

    renderScenes();
    renderTimeline();
    selectScene(0);

    setProgress(0);

    log(state.scenes.length + " sahne oluşturuldu.");
    setStatus(state.scenes.length + " sahne hazır");
}


/* ---------------------------------------------------------
   SCENE RENDER
--------------------------------------------------------- */

function renderScenes(){

    const list = $("sceneList");

    $("sceneCount").textContent = "(" + state.scenes.length + ")";

    if(!state.scenes.length){

        list.innerHTML = `
            <div class="empty">
                <div>
                    <div style="font-size:40px;margin-bottom:12px">🎬</div>
                    <div>Henüz sahne oluşturulmadı.</div>
                </div>
            </div>
        `;

        return;
    }

    list.innerHTML = "";

    state.scenes.forEach((scene,index)=>{

        const card = document.createElement("div");

        card.className =
            "sceneCard " +
            (index === state.active ? "active" : "");

        card.innerHTML = `

            <div class="sceneTop">

                <div class="sceneNumber">
                    SAHNE ${scene.number}
                </div>

                <div class="sceneDuration">
                    ${scene.duration} sn
                </div>

            </div>

            <img
                class="sceneThumb"
                src="${scene.image || placeholder(index)}"
                alt=""
            >

            <div class="sceneText">
                ${escapeHTML(scene.text)}
            </div>

            <div class="sceneActions">

                <button class="iconBtn"
                    onclick="selectScene(${index})">
                    Aç
                </button>

                <button class="iconBtn"
                    onclick="generateScene(${index})">
                    Görsel
                </button>

                <button class="iconBtn"
                    onclick="editScene(${index})">
                    Düzenle
                </button>

            </div>

        `;

        list.appendChild(card);

    });
}


function placeholder(index){

    const svg = `
    <svg xmlns="http://www.w3.org/2000/svg" width="800" height="450">
        <rect width="100%" height="100%" fill="#080b12"/>
        <text x="50%" y="48%" text-anchor="middle"
        fill="#64748b" font-family="Arial"
        font-size="30">SAHNE ${index+1}</text>
        <text x="50%" y="58%" text-anchor="middle"
        fill="#334155" font-family="Arial"
        font-size="18">Görsel henüz oluşturulmadı</text>
    </svg>`;

    return "data:image/svg+xml;charset=utf-8," +
        encodeURIComponent(svg);
}


/* ---------------------------------------------------------
   TIMELINE
--------------------------------------------------------- */

function renderTimeline(){

    const timeline = $("timeline");

    timeline.innerHTML = "";

    state.scenes.forEach((scene,index)=>{

        const item = document.createElement("div");

        item.className =
            "timeScene " +
            (index === state.active ? "active" : "");

        item.onclick = () => selectScene(index);

        item.innerHTML = `

            <img
                class="timeThumb"
                src="${scene.image || placeholder(index)}"
            >

            <div class="timeLabel">
                ${index+1}. SAHNE · ${scene.duration}s
            </div>

        `;

        timeline.appendChild(item);

    });
}


/* ---------------------------------------------------------
   SCENE SELECT
--------------------------------------------------------- */

function selectScene(index){

    if(index < 0 || index >= state.scenes.length) return;

    state.active = index;

    const scene = state.scenes[index];

    $("previewImage").src =
        scene.image || placeholder(index);

    $("previewBadge").textContent =
        "Sahne " + scene.number + " · " + scene.duration + " sn";

    $("previewSubtitle").textContent =
        $("subtitleEnabled").checked
        ? scene.subtitle
        : "";

    $("previewCounter").textContent =
        (index + 1) + " / " + state.scenes.length;

    $("voiceText").value = scene.voice;

    renderScenes();
    renderTimeline();
}


/* ---------------------------------------------------------
   SCENE EDIT
--------------------------------------------------------- */

function editScene(index){

    const scene = state.scenes[index];

    const newText = prompt(
        "Sahne metni:",
        scene.text
    );

    if(newText === null) return;

    scene.text = newText;
    scene.subtitle = newText;
    scene.voice = newText;

    scene.prompt = buildScenePrompt(
        newText,
        index
    );

    renderScenes();
    renderTimeline();
    selectScene(index);

    log("Sahne " + (index+1) + " düzenlendi.");
}


/* ---------------------------------------------------------
   IMAGE URL
--------------------------------------------------------- */

function imageURL(promptText){

    const encoded = encodeURIComponent(promptText);

    /*
      Pollinations güncel endpoint yapısı.
    */

    return "https://gen.pollinations.ai/image/" +
        encoded +
        "?model=" + encodeURIComponent($("model").value) +
        "&width=1280&height=720&nologo=true";
}


/* ---------------------------------------------------------
   SINGLE IMAGE
--------------------------------------------------------- */

async function generateScene(index){

    const scene = state.scenes[index];

    if(!scene){
        alert("Önce sahneleri oluştur.");
        return;
    }

    selectScene(index);

    setStatus("Sahne " + (index+1) + " üretiliyor...");
    log("Sahne " + (index+1) + " görseli hazırlanıyor.");

    const url = imageURL(scene.prompt);

    /*
      Görseli img src olarak kullanıyoruz.
      Tarayıcı görseli doğrudan yükleyebiliyorsa
      sahne otomatik olarak görüntülenir.
    */

    $("previewImage").src = url;

    scene.image = url;

    renderScenes();
    renderTimeline();

    state.generated++;

    setStatus("Sahne " + (index+1) + " hazır");

    log("Sahne " + (index+1) + " görsel URL'si oluşturuldu.");

    return url;
}


/* ---------------------------------------------------------
   ALL IMAGES
--------------------------------------------------------- */

async function generateAll(){

    if(!state.scenes.length){
        alert("Önce hikâyeyi sahnelere böl.");
        return;
    }

    setStatus("Görseller hazırlanıyor...");

    for(let i=0;i<state.scenes.length;i++){

        selectScene(i);

        await generateScene(i);

        setProgress(
            ((i+1) / state.scenes.length) * 100
        );

        /*
          Tarayıcıyı boğmamak için küçük bekleme.
        */

        await wait(350);

    }

    setStatus("Tüm görseller hazır");

    log("Tüm sahneler tamamlandı.");
}


function wait(ms){
    return new Promise(resolve => setTimeout(resolve,ms));
}


/* ---------------------------------------------------------
   VIDEO PREVIEW
--------------------------------------------------------- */

function playPreview(){

    if(!state.scenes.length){
        alert("Önce sahne oluştur.");
        return;
    }

    if(state.playing){
        stopPreview();
        return;
    }

    state.playing = true;

    $("playBtn").textContent = "⏸ Durdur";

    runScene();

}


function runScene(){

    if(!state.playing) return;

    const scene = state.scenes[state.active];

    selectScene(state.active);

    const duration = scene.duration * 1000;

    state.timer = setTimeout(()=>{

        if(state.active < state.scenes.length - 1){

            state.active++;

            runScene();

        }else{

            stopPreview();

        }

    },duration);

}


function stopPreview(){

    state.playing = false;

    clearTimeout(state.timer);

    $("playBtn").textContent = "▶ Oynat";

}


/* ---------------------------------------------------------
   NEXT / PREVIOUS
--------------------------------------------------------- */

function nextScene(){

    if(!state.scenes.length) return;

    let index = state.active + 1;

    if(index >= state.scenes.length){
        index = 0;
    }

    selectScene(index);
}


function previousScene(){

    if(!state.scenes.length) return;

    let index = state.active - 1;

    if(index < 0){
        index = state.scenes.length - 1;
    }

    selectScene(index);
}


/* ---------------------------------------------------------
   BROWSER VOICE
--------------------------------------------------------- */

function speakText(){

    if(!("speechSynthesis" in window)){

        alert(
            "Bu tarayıcı seslendirmeyi desteklemiyor."
        );

        return;
    }

    const text = $("voiceText").value.trim();

    if(!text){
        alert("Seslendirilecek metin yok.");
        return;
    }

    speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(text);

    utterance.lang = "tr-TR";
    utterance.rate = 0.92;
    utterance.pitch = 1;

    speechSynthesis.speak(utterance);

    log("Tarayıcı seslendirmesi başlatıldı.");
}


/* ---------------------------------------------------------
   EXPORT PROJECT
--------------------------------------------------------- */

function exportProject(){

    const project = {

        app:"Mina Video AI",

        version:"V15",

        created:new Date().toISOString(),

        settings:{
            style:$("visualStyle").value,
            aspect:$("aspect").value,
            model:$("model").value,
            fps:$("fps").value,
            camera:$("camera").value
        },

        story:$("story").value,

        scenes:state.scenes

    };

    const blob = new Blob(
        [JSON.stringify(project,null,2)],
        {type:"application/json"}
    );

    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");

    a.href = url;
    a.download = "mina-video-ai-v15-project.json";

    a.click();

    URL.revokeObjectURL(url);

    log("Proje kaydedildi.");
}


/* ---------------------------------------------------------
   SETTINGS CHANGE
--------------------------------------------------------- */

$("camera").addEventListener("change",()=>{

    state.scenes.forEach((scene,index)=>{

        scene.camera = $("camera").value;

        scene.prompt =
            buildScenePrompt(
                scene.text,
                index
            );

    });

});


$("visualStyle").addEventListener("change",()=>{

    state.scenes.forEach((scene,index)=>{

        scene.prompt =
            buildScenePrompt(
                scene.text,
                index
            );

    });

});


$("duration").addEventListener("change",()=>{

    state.scenes.forEach(scene=>{
        scene.duration =
            Number($("duration").value);
    });

    renderScenes();
    renderTimeline();

});


$("subtitleEnabled").addEventListener("change",()=>{

    if(state.scenes.length){
        selectScene(state.active);
    }

});


/* ---------------------------------------------------------
   BUTTONS
--------------------------------------------------------- */

$("splitBtn").onclick = createScenes;

$("generateAllBtn").onclick = generateAll;

$("generateCurrentBtn").onclick = ()=>{

    if(!state.scenes.length){
        alert("Önce sahneleri oluştur.");
        return;
    }

    generateScene(state.active);

};

$("playBtn").onclick = playPreview;

$("nextBtn").onclick = nextScene;

$("prevBtn").onclick = previousScene;

$("voiceBtn").onclick = speakText;

$("exportBtn").onclick = exportProject;

$("previewVideoBtn").onclick = ()=>{

    if(!state.scenes.length){

        alert("Önce sahneleri oluştur.");

        return;
    }

    selectScene(0);

    playPreview();

};


/* ---------------------------------------------------------
   KEYBOARD
--------------------------------------------------------- */

document.addEventListener("keydown",e=>{

    if(e.target.tagName === "TEXTAREA" ||
       e.target.tagName === "INPUT") return;

    if(e.key === "ArrowRight"){
        nextScene();
    }

    if(e.key === "ArrowLeft"){
        previousScene();
    }

    if(e.key === " "){
        e.preventDefault();
        playPreview();
    }

});


/* ---------------------------------------------------------
   INITIAL
--------------------------------------------------------- */

$("previewImage").src = placeholder(0);

log("Mina Video AI V15 başlatıldı.");
log("Hikâyeni yazıp 'Hikâyeyi Sahnelere Böl' butonuna bas.");

</script>
